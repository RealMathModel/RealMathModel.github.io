 9, "kind": "Recall", "q": "By naming convention, an accessor (getter) for a bool data field 'on' is usually named:", "opts": ["on()", "isOn()", "getOn()", "readOn()"], "ans": 1, "exp": "Accessors retrieve private fields; for bool fields the 'is' prefix is conventional: isOn(). Mutators (setters) modify, e.g. setOn(bool)."}, {"ch": 9, "kind": "Recall", "q": "In UML class notation, + and - mean:", "opts": ["+ private, - public", "+ public, - private", "+ add, - remove", "+ static, - const"], "ans": 1, "exp": "+ marks public visibility, - marks private. Fields are shown as name: type; functions as name(param: type): returnType."}, {"ch": 2, "kind": "Recall", "q": "The range of a signed int is:", "opts": ["[-2^63, 2^63 - 1]", "[-2^31, 2^31 - 1]", "[0, 2^32 - 1]", "[-2^15, 2^15 - 1]"], "ans": 1, "exp": "int is [-2^31, 2^31 - 1] (about +/-2.1 billion). short is [-2^15, 2^15-1]; unsigned int is [0, 2^32-1]. long matches int on typical 32-bit-int systems."}, {"ch": 2, "kind": "Recall", "q": "Among short, int, long, float, double, which needs the LEAST memory?", "opts": ["float", "They're equal", "short (2 bytes)", "int"], "ans": 2, "exp": "short uses 2 bytes (16 bits) on modern machines -- the smallest of these. int/float are typically 4, double 8."}, {"ch": 2, "kind": "Recall", "q": "The range of an unsigned short is:", "opts": ["[-2^15, 2^15 - 1]", "[0, 2^15 - 1]", "[0, 2^16 - 1]", "[-2^16, 2^16 - 1]"], "ans": 2, "exp": "unsigned short is [0, 2^16 - 1]. Dropping the sign bit doubles the positive range but removes negatives."}, {"ch": 2, "kind": "Recall", "q": "Compared to a float, a double is:", "opts": ["The same size", "Usually twice as big (double precision)", "Half the size", "Smaller but more precise"], "ans": 1, "exp": "float is single precision; double is double precision -- usually twice the size, holding more significant digits."}, {"ch": 2, "kind": "Recall", "q": "C++ numeric limit constants are defined in which header?", "opts": ["<limits>", "<cstdlib>", "<cmath>", "<climits> only"], "ans": 0, "exp": "The <limits> header defines numeric range constants. (These may be missing on some older compilers.)"}, {"ch": 2, "kind": "Recall", "q": "Which writes the integer eight as an OCTAL literal?", "opts": ["0x8", "8", "8o", "010"], "ans": 3, "exp": "A leading 0 makes a literal octal: 010 = 8. A leading 0x/0X makes it hex. Plain digits are decimal."}, {"ch": 2, "kind": "Recall", "q": "Why is it called 'floating-point'?", "opts": ["The values float in memory", "Values are stored in scientific notation, so the decimal point 'floats' to a new position", "Points are approximate", "The point can be deleted"], "ans": 1, "exp": "Internally a value like 50.534 is stored as 5.0534E+1 -- the decimal point moves (floats) to normalize the number, hence 'floating-point'."}, {"ch": 2, "kind": "Recall", "q": "The Unix/epoch time origin is:", "opts": ["System boot time", "Midnight Jan 1, 2000", "The program's start time", "Midnight Jan 1, 1970 GMT"], "ans": 3, "exp": "The epoch is midnight, January 1, 1970 GMT. time(0) (in <ctime>) returns seconds elapsed since then -- handy for seeding srand(time(0))."}, {"ch": 2, "kind": "Concept", "q": "Some compilers compute pow(a, 2) wrong; the safe form is:", "opts": ["a ** 2", "pow(a, 2)", "pow(a, 2.0)", "a ^ 2"], "ans": 2, "exp": "pow expects floating-point; some compilers need at least one float/double argument. Write pow(a, 2.0). Also note ^ is bitwise XOR in C++, not exponent, and ** doesn't exist."}, {"ch": 2, "kind": "Concept", "q": "Which is a STATEMENT (not just an expression)?", "opts": ["x + 5", "x * y", "x > 5", "x + 5;"], "ans": 3, "exp": "An expression produces a value (x + 5, x > 5). Add a semicolon and it becomes a statement that performs the action: x + 5;"}, {"ch": 2, "kind": "Concept", "q": "Which claim is FALSE? (CP 2.22)", "opts": ["x = y = x = 0 is illegal (assuming x, y declared)", "x++ can be used as a statement", "x = x + 5 is also an expression", "Any expression can be used as a statement"], "ans": 0, "exp": "x = y = x = 0 is LEGAL when the variables are declared (= is right-associative). The other three are true. So the 'illegal' claim is the false one."}, {"ch": 2, "kind": "Trace", "q": "If today is Tuesday, what day is it in 100 days? (CP 2.13)", "opts": ["Tuesday", "Friday", "Wednesday", "Thursday"], "ans": 3, "exp": "100 % 7 = 2. Tuesday + 2 = Thursday. Cyclic day math is pure modulo."}, {"ch": 2, "kind": "Concept", "q": "An explicit cast from double to int does what to the value AND the variable being cast?", "opts": ["Rounds; leaves the variable", "Truncates the fractional part; does NOT change the original variable", "Truncates; changes the variable", "Rounds the value; changes the original variable"], "ans": 1, "exp": "Casting truncates (drops the fraction) and produces a new value -- it does not modify the variable being cast."}, {"ch": 2, "kind": "Recall", "q": "short int is synonymous with short. Which pair is also synonymous?", "opts": ["long int and long", "unsigned int and int", "char and int", "float and double"], "ans": 0, "exp": "long int == long, unsigned int == unsigned, short int == short. float/double and char/int are distinct types."}, {"ch": 3, "kind": "Recall", "q": "In a switch, the default case:", "opts": ["Is required", "Is optional and may appear anywhere among the cases", "Must be first", "Replaces break"], "ans": 1, "exp": "default is optional; it runs when no case matches and can be placed anywhere (though conventionally last). It still needs break if more code follows it."}, {"ch": 3, "kind": "Concept", "q": "For  a && b  to be true, and for  a || b  to be true:", "opts": ["&& needs at least one true; || needs both true", "&& needs both true; || needs at least one true", "Both need both true", "Both need at least one true"], "ans": 1, "exp": "AND (&&) is true only when BOTH operands are true. OR (||) is true when AT LEAST ONE is true."}, {"ch": 3, "kind": "Trace", "q": "What does  cout << (3 > 2 ? 'A' : 'B');  print?", "opts": ["true", "B", "1", "A"], "ans": 3, "exp": "3 > 2 is true, so the ternary yields the first branch 'A'. The ternary evaluates only the selected branch."}, {"ch": 4, "kind": "Recall", "q": "Assuming E = 2.71828, what does log(E) return? (<cmath>)", "opts": ["1.0", "2.71828", "10.0", "0.0"], "ans": 0, "exp": "log is the NATURAL log (ln). ln(e) = 1.0. log10(10.0) = 1.0; exp(1.0) = 2.71828."}, {"ch": 4, "kind": "Recall", "q": "What does pow(2.0, 3) return, and of what type?", "opts": ["9.0, a double", "8.0, a double", "8, an int", "6.0, a double"], "ans": 1, "exp": "pow returns a double: 2^3 = 8.0. All <cmath> functions return double."}, {"ch": 4, "kind": "Recall", "q": "What does sqrt(4.0) return?", "opts": ["Error", "2.0", "2", "16.0"], "ans": 1, "exp": "sqrt(4.0) = 2.0 (a double). sqrt requires x >= 0."}, {"ch": 4, "kind": "Recall", "q": "ceil(2.1) and floor(2.1) return, respectively:", "opts": ["3 and 2", "2.1 and 2.1", "3.0 and 2.0", "2.0 and 3.0"], "ans": 2, "exp": "ceil rounds up (3.0), floor rounds down (2.0). Both return doubles. ceil(-2.1) = -2.0, floor(-2.1) = -3.0 (toward +inf / -inf)."}, {"ch": 4, "kind": "Recall", "q": "min, max, and abs are declared in which header?", "opts": ["<iomanip>", "<cmath>", "<algorithm> only", "<cstdlib>"], "ans": 3, "exp": "Per the course summary, min/max/abs are in <cstdlib> and work with int, long, float, or double. abs(-2.1) returns 2.1; max(2.5, 3.0) returns 3.0."}, {"ch": 4, "kind": "Recall", "q": "The size of a char and the ASCII scheme width are:", "opts": ["4 bytes, 32-bit", "1 byte, 8-bit", "2 bytes, 16-bit", "1 byte, 7-bit only"], "ans": 1, "exp": "char is 1 byte; C++ uses the 8-bit ASCII encoding to map characters to codes."}, {"ch": 4, "kind": "Recall", "q": "'A' to 'Z' occupy which ASCII range?", "opts": ["65-90", "97-122", "48-57", "65-122"], "ans": 0, "exp": "'A'-'Z' = 65-90, 'a'-'z' = 97-122, '0'-'9' = 48-57. Lowercase = uppercase + 32."}, {"ch": 4, "kind": "Recall", "q": "The ASCII code of the tab escape '\\t' is:", "opts": ["8", "10", "13", "9"], "ans": 3, "exp": "\\b=8 (backspace), \\t=9 (tab), \\n=10 (linefeed), \\f=12 (formfeed), \\r=13 (carriage return), \\\\=92, \\\"=34."}, {"ch": 4, "kind": "Recall", "q": "Which is NOT a whitespace character?", "opts": ["'\\n'", "'\\0'", "'\\t'", "space ' '"], "ans": 1, "exp": "Whitespace = space, \\t, \\f, \\r, \\n. '\\0' is the NULL terminator (code 0), not whitespace."}, {"ch": 4, "kind": "Concept", "q": "The difference between '\\n' and endl is:", "opts": ["'\\n' flushes; endl doesn't", "endl also flushes the output buffer; '\\n' just moves to a new line", "endl is faster", "No difference"], "ans": 1, "exp": "Both start a new line, but endl ALSO flushes the buffer (forcing immediate display). That flush makes endl slightly slower in tight loops."}, {"ch": 4, "kind": "Trace", "q": "What does this store? (int -> char keeps low 8 bits)", "code": "char c = 0xFF41;\ncout << c;", "opts": ["A (only the low byte 0x41 = 65 is kept)", "FF41", "Compile error", "Garbage"], "ans": 0, "exp": "Casting an int to char keeps only the low 8 bits: 0xFF41 -> 0x41 = 65 = 'A'."}, {"ch": 4, "kind": "Trace", "q": "What does  char c = 65.25; cout << c;  print?", "opts": ["65", "65.25", "A", "Compile error"], "ans": 2, "exp": "A floating value cast to char goes double -> int (truncate to 65) -> char ('A'). Prints A."}, {"ch": 4, "kind": "Trace", "q": "What integer is  '2' + '3'  (as ASCII codes)?", "opts": ["'5'", "101", "23", "5"], "ans": 1, "exp": "'2'=50, '3'=51. char + char adds codes: 50 + 51 = 101. Not 2 + 3."}, {"ch": 4, "kind": "Concept", "q": "'A' versus \"A\":", "opts": ["'A' is a string; \"A\" is a char", "Both are strings", "Identical", "'A' is a char (single quotes); \"A\" is a string (double quotes)"], "ans": 3, "exp": "Single quotes = a single char ('A'). Double quotes = a string literal (\"A\", which also carries a hidden '\\0')."}, {"ch": 4, "kind": "Concept", "q": "The string type is:", "opts": ["A primitive type like int", "A built-in keyword", "An object type (instance of the string class), needs <string>", "A char array only"], "ans": 2, "exp": "string is NOT primitive -- it's a class; a string variable is an object. Include <string>. Functions are called as s.length(), s.at(i), etc."}, {"ch": 4, "kind": "Concept", "q": "getline(cin, s, delimiter): the delimiter character is:", "opts": ["Left in the buffer", "Required, no default", "Stored at the end of s", "Read from input but NOT stored in s; defaults to '\\n'"], "ans": 3, "exp": "getline reads up to the delimiter, consumes it from the stream, but does NOT put it in s. The third argument defaults to '\\n', so getline(cin, s) reads a whole line."}, {"ch": 4, "kind": "Recall", "q": "s.length() and s.size() are:", "opts": ["size() is for arrays only", "length() includes the '\\0'", "The same -- both return the character count", "Different (size counts bytes)"], "ans": 2, "exp": "For std::string, length() and size() are identical. (std::string doesn't expose a '\\0' in its count.)"}, {"ch": 4, "kind": "Trace", "q": "What prints (no 'fixed')?", "code": "cout << setprecision(5) << 12.34567;", "opts": ["12.34567", "12.3", "12.35", "12.346"], "ans": 3, "exp": "Without fixed, setprecision = total significant digits. 5 sig-figs of 12.34567, rounded -> 12.346."}, {"ch": 4, "kind": "Trace", "q": "What prints?", "code": "cout << setprecision(3) << 23456;", "opts": ["2.34e4", "23500", "234", "23456"], "ans": 3, "exp": "If the precision is smaller than the integer part it's IGNORED, and it has no effect on plain integers anyway -> 23456."}, {"ch": 4, "kind": "Recall", "q": "After 'fixed' with no setprecision, how many digits print after the decimal point?", "opts": ["2", "All of them", "0", "6 (the default)"], "ans": 3, "exp": "fixed defaults to 6 digits after the decimal point. After fixed, setprecision(n) sets digits AFTER the point (not total significant digits)."}, {"ch": 4, "kind": "Trace", "q": "What prints?", "code": "cout << showpoint << 1;", "opts": ["1.00000", "1.", "1.0", "1"], "ans": 3, "exp": "showpoint only affects floating-point values. Applied to the int 1 it has no effect -> prints 1."}, {"ch": 4, "kind": "Concept", "q": "If the item is wider than setw's width, the output is:", "opts": ["An error", "Printed in full; the width auto-increases (no truncation)", "Truncated to the width", "Padded anyway"], "ans": 1, "exp": "setw sets a MINIMUM field width. If the value needs more room, it's printed in full -- setw never truncates."}, {"ch": 4, "kind": "Trace", "q": "What prints (use _ for space)?", "code": "cout << left << setw(8) << \"Hello\" << \"World\";", "opts": ["HelloWorld", "Hello___World  (Hello left-justified in 8, 3 trailing spaces)", "Hello World", "___HelloWorld"], "ans": 1, "exp": "left justifies within setw's field: 'Hello' in 8 cols, left -> 3 trailing spaces. Then 'World' prints immediately (setw is transient). 'Hello___World'."}, {"ch": 6, "kind": "Recall", "q": "The actual value passed in a call is the ARGUMENT; the variable that receives it in the function header is the:", "opts": ["Prototype", "Parameter (formal parameter)", "Local constant", "Return value"], "ans": 1, "exp": "Argument (actual parameter) = the value passed at the call site. Parameter (formal parameter) = the variable in the function definition that receives it."}, {"ch": 6, "kind": "Concept", "q": "A function prototype (declaration) differs from a definition in that it:", "opts": ["Allocates the function's memory", "Includes the body", "Gives only the signature + return type and ends with a semicolon (no body)", "Must repeat parameter names"], "ans": 2, "exp": "A prototype declares the interface (return type, name, parameter types) and ends with ';' -- no body. Parameter names are optional in a prototype."}, {"ch": 6, "kind": "Concept", "q": "The <cmath> functions like abs/sqrt are 'overloaded' meaning:", "opts": ["They take any number of arguments", "Versions exist for different argument types (int, float, double), chosen by the compiler", "They return multiple values", "They can be redefined by you"], "ans": 1, "exp": "Overloading provides multiple versions distinguished by parameter types; the compiler picks the matching one for your argument's type."}, {"ch": 7, "kind": "Concept", "q": "In the deck-of-cards model (cards 0..51), the suit and rank are:", "opts": ["suit = card % 13, rank = card / 13", "suit = card % 4, rank = card / 4", "suit = card / 13, rank = card % 13", "suit = card / 4, rank = card % 4"], "ans": 2, "exp": "With 13 ranks per suit: suit = card / 13 (0..3), rank = card % 13 (0..12). Division groups; modulo positions within the group."}, {"ch": 7, "kind": "Concept", "q": "To count letter occurrences with int counts[26], you increment:", "opts": ["counts[ch - 'a']++", "counts[ch]++", "counts['a' - ch]++", "counts[ch - '0']++"], "ans": 0, "exp": "ch - 'a' maps 'a'..'z' to 0..25, the array index. So counts[ch - 'a']++ tallies that letter."}, {"ch": 7, "kind": "Recall", "q": "Linear search vs binary search:", "opts": ["Both need sorted arrays", "Linear needs a sorted array; binary works on any array", "Linear works on any array (O(n)); binary needs a sorted array (O(log n))", "Both are O(1)"], "ans": 2, "exp": "Linear search scans sequentially -- works unsorted, O(n). Binary search halves a SORTED array each step, O(log n)."}, {"ch": 7, "kind": "Recall", "q": "Selection sort works by:", "opts": ["Partitioning around a pivot", "Splitting and merging halves", "Swapping adjacent out-of-order pairs repeatedly", "Repeatedly selecting the smallest remaining element and swapping it into the next position"], "ans": 3, "exp": "Selection sort finds the minimum of the unsorted region and swaps it into place, advancing one position each pass."}, {"ch": 7, "kind": "Concept", "q": "A correct array function prototype is:", "opts": ["void p(int, int);", "void p(int[10]);", "void p(int* []);", "void p(int[], int);"], "ans": 3, "exp": "For an array parameter you keep the empty brackets: void p(int[], int size). The size is passed separately because the array decays to a pointer."}, {"ch": 7, "kind": "Concept", "q": "If function A passes a const array to function B, then B's parameter must:", "opts": ["Return the array", "Also be declared const (cascading const)", "Be non-const for speed", "Copy the array first"], "ans": 1, "exp": "const cascades: a const array can only be passed to a parameter that is also const, otherwise B could modify what A promised not to."}, {"ch": 7, "kind": "Concept", "q": "A lookup/lookup-table replaces a long if-else ladder; e.g. month name is:", "code": "string months[] = {\"January\", ..., \"December\"};", "opts": ["months[monthNumber + 1]", "months[monthNumber]", "months[monthNumber - 1]", "months.at(monthNumber, -1)"], "ans": 2, "exp": "Months 1..12 map to indices 0..11, so months[monthNumber - 1]. This one expression replaces a 12-branch if-else."}, {"ch": 8, "kind": "Concept", "q": "In the closest-pair scan over points, the inner loop starts at:", "code": "for (int i = 0; i < n; i++)\n    for (int j = ?; j < n; j++)", "opts": ["j = i", "j = 0", "j = 1", "j = i + 1"], "ans": 3, "exp": "Starting the inner loop at j = i + 1 checks each unordered pair once, avoiding self-pairs (i==j) and duplicate (j,i) comparisons."}, {"ch": 8, "kind": "Concept", "q": "In Sudoku, the top-left cell of the 3x3 box containing grid[i][j] is:", "opts": ["grid[i%3][j%3]", "grid[i/3][j/3]", "grid[i-3][j-3]", "grid[(i/3)*3][(j/3)*3]"], "ans": 3, "exp": "(i/3)*3 snaps the row down to the box's starting row (0,3,6); same for columns. So the box origin is grid[(i/3)*3][(j/3)*3]."}, {"ch": 8, "kind": "Recall", "q": "Weather data for 10 days x 24 hours x 2 metrics is naturally a:", "opts": ["2D array [10][48]", "Array of strings", "3D array data[10][24][2]", "1D array of 480"], "ans": 2, "exp": "Three independent dimensions -> a 3D array data[10][24][2]: day, hour, metric."}, {"ch": 9, "kind": "Concept", "q": "Copying one object to another with = does what by default?", "code": "Circle c2 = c1;", "opts": ["Compile error", "Makes them share memory", "Memberwise copy: copies each data field; c2 is independent", "Copies only public fields"], "ans": 2, "exp": "Default copy is memberwise -- each data field is copied, producing an independent object. Changing c2 afterward doesn't affect c1."}, {"ch": 9, "kind": "Concept", "q": "A const member function such as  double getArea() const  promises:", "opts": ["It is private", "Not to modify the object's data members", "The return value is const", "It can only be called once"], "ans": 1, "exp": "The trailing const means the function won't modify the object's state; it can be called on const objects."}, {"ch": 9, "kind": "Concept", "q": "To display the area of a temporary (anonymous) object you write:", "opts": ["cout << Circle{}.getArea;", "cout << getArea(Circle);", "cout << Circle.getArea();", "cout << Circle().getArea();"], "ans": 3, "exp": "Circle() constructs an anonymous object; .getArea() calls on it. The parentheses are required -- without them Circle is just a type name."}, {"ch": 9, "kind": "Concept", "q": "A member function defined INSIDE the class body is:", "opts": ["Automatically inline", "Always private", "A constructor", "Illegal -- must be outside"], "ans": 0, "exp": "Functions defined within the class definition are implicitly inline. Defining them outside (with ClassName::) does not make them inline."}, {"ch": 9, "kind": "Recall", "q": "In separate compilation, the class definition usually goes in the ___ and the function bodies in the ___:", "opts": [".cpp / .h", "both in .cpp", "both in .h", ".h (header) / .cpp (source)"], "ans": 3, "exp": "The class definition (members) lives in a .h header; the out-of-class function bodies (ReturnType ClassName::method) live in the .cpp. Headers use inclusion guards."}, {"ch": 9, "kind": "Concept", "q": "At end of scope, an object's members are destroyed in what order relative to construction?", "opts": ["Reverse order of construction", "Alphabetical", "Random order", "Same order as constructed"], "ans": 0, "exp": "Construction initializes members in declaration order; destruction runs in the REVERSE order. (LIFO, like the stack.)"}, {"ch": 9, "kind": "Concept", "q": "Encapsulation in a class means:", "opts": ["Using only global variables", "Making everything public", "Hiding data (private fields) and exposing controlled access via public functions", "Avoiding constructors"], "ans": 2, "exp": "Encapsulation = private data + public interface (accessors/mutators). The outside world can't touch the internals directly, so the class controls its own state."}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.23:  Explain the C++ keywords. List some C++ keywords you learned in this chapter.", "opts": ["A comment is a line that's written by the programmer and completely ignored by the compiler , mainly for making the code easier...", "They Keywords are the words that are built inside the compiler and can be used as identifiers using , namespace return , int.", "They Keywords are the words that are built inside the compiler and cannot be used as identifiers using , namespace return , int.", "If we want the ith element we write a[i-1] (0 based indexing), secondly no you cannot , you should copy element by element."], "ans": 2, "exp": "They Keywords are the words that are built inside the compiler and cannot be used as identifiers using , namespace return , int."}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.24:  Is C++ case sensitive? What is the case for C++ keywords?", "opts": ["Yes , C++ is case sensitive. The case for C++ keywords is uppercase.", "Yes , C++ is case sensitive. The case for C++ keywords is lowercase.", "Yes , C++ is case insensitive. The case for C++ keywords is lowercase.", "no , C++ is case sensitive. The case for C++ keywords is lowercase."], "ans": 1, "exp": "Yes , C++ is case sensitive. The case for C++ keywords is lowercase."},   1:["Intro & errors","build pipeline, comments, output — checkpoints only"],
  2:["Elementary","types, casting, %, overflow, precision"],
  3:["Selections","logic, short-circuit, switch, precedence, ternary"],
  4:["Math / char / string","ASCII arithmetic, manipulators, I/O"],
  5:["Loops","firing order, overflow, eof, scope, continue, nesting"],
  6:["Functions","value vs reference, overload, defaults, scope, static"],
  7:["1-D arrays & C-strings","bounds, sharing, search/sort, '\\0'"],
  8:["2-D arrays","row-major, offsets, passing, nesting"],
  9:["Objects & classes","constructors, init lists, encapsulation, this"]
};
const KIND_COLOR = {Concept:"var(--k-concept)",Trace:"var(--k-trace)",Recall:"var(--k-recall)",Output:"var(--k-output)",Checkpoint:"var(--k-checkpoint)",Midterm:"var(--amber)",Final:"var(--amber)"};
const EXAMS = [
  {tag:"M",  title:"Midterm Exam 2026",            sub:"Chapters 1–5 · reproduced exactly, in exam order"},
  {tag:"F1", title:"Final Exam — Concepts & Tracing", sub:"Previous years · multiple choice · verified answers"},
  {tag:"F2", title:"Final Exam — PIC 10A (Output)",   sub:"Fall 2006 · type the output · compiler-verified"},
];
const EXAM_TITLE = {M:"Midterm Exam", F1:"Final — Concepts", F2:"Final — PIC 10A"};

const norm = s => (s||"").trim().toLowerCase().replace(/\s+/g,"");
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const isCode = t => /\n/.test(t) || /[;{}]|cout|cin|rand\(|::|#include|<<|>>|\(\)/.test(t);
function answerNode(label, text, color){
  const p=el("p"); p.style.margin="0 0 6px"; p.style.fontSize="13.5px"; if(color)p.style.color=color;
  const b=el("b",null,label); b.style.color="var(--muted)"; b.style.fontWeight="600"; p.appendChild(b);
  if(isCode(text)){ p.appendChild(el("div","inlinecode",text)); }
  else { p.append(" "+text); }
  return p;
}

const state = {
  chapters:new Set([1,2,3,4,5,6,7,8,9]),
  set:"Both", immediate:true, count:"All",
  qs:[], idx:0, answered:{}, order:{},
  times:{}, shownAt:null, sessionStart:null, tick:null
};
const app = document.getElementById("app");
const fmtClock = ms => { const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
function commitTime(i){ if(state.shownAt!=null) state.times[i]=(performance.now()-state.shownAt)/1000; }
function stopTick(){ if(state.tick){clearInterval(state.tick); state.tick=null;} }
function updTimer(){ const e=document.getElementById("sesstime"); if(e&&state.sessionStart!=null) e.textContent=fmtClock(performance.now()-state.sessionStart); }

function nMcq(){return BANK.filter(q=>q.kind!=="Checkpoint").length;}
function nCp(){return BANK.filter(q=>q.kind==="Checkpoint").length;}

/* ---------------- START ---------------- */
function renderStart(){
  stopTick();
  app.innerHTML="";
  const pr = el("p","prompt"); pr.innerHTML='<span class="u">hasan</span>@<span class="p">iug</span>:<span class="d">~/cpp</span>$ ./mastery<span class="cursor"></span>';
  app.appendChild(pr);
  const h=el("h1"); h.innerHTML='C++ Mastery <span class="ac">Console</span>'; app.appendChild(h);
  const nChap = BANK.filter(q=>typeof q.ch==="number").length;
  app.appendChild(el("p","sub","Chapters 1–9 · "+nChap+" multiple-choice items · concept traps, output traces, and the book's Check Points."));

  // chapters
  const s1=el("div","sec");
  s1.appendChild(el("div","label","Scope — chapters"));
  const chips=el("div","chips");
  for(let c=1;c<=9;c++){
    const chip=el("div","chip"+(state.chapters.has(c)?" on":""));
    chip.appendChild(el("span","box"));
    chip.appendChild(el("span","cn","CH"+c));
    const t=el("span","ct"); t.appendChild(document.createTextNode(CH_TITLES[c][0]+" ")); 
    const sm=el("small"); sm.textContent="· "+CH_TITLES[c][1]; t.appendChild(sm);
    chip.appendChild(t);
    chip.onclick=()=>{ state.chapters.has(c)?state.chapters.delete(c):state.chapters.add(c); chip.classList.toggle("on"); updateNote();};
    chips.appendChild(chip);
  }
  s1.appendChild(chips);
  const mr=el("div","minirow");
  const all=el("button","mini","select all"); all.onclick=()=>{state.chapters=new Set([1,2,3,4,5,6,7,8,9]); renderStart();};
  const none=el("button","mini","clear"); none.onclick=()=>{state.chapters=new Set(); renderStart();};
  mr.append(all,none); s1.appendChild(mr);
  app.appendChild(s1);

  // Exams — fixed, paper-style sets (Midterm + previous-year Finals)
  const exsec=el("div","sec");
  exsec.appendChild(el("div","label","Exams — previous papers"));
  EXAMS.forEach(ex=>{
    const n=BANK.filter(q=>q.ch===ex.tag).length;
    if(!n) return;
    const card=el("div","examcard");
    const head=el("div","exhead");
    head.appendChild(el("span","extag","EXAM"));
    head.appendChild(el("span","extitle",ex.title));
    card.appendChild(head);
    card.appendChild(el("div","exsub",ex.sub+" · "+n+" questions"));
    const run=el("button","btn primary","▸ Start "+ex.title);
    run.onclick=()=>startExam(ex.tag);
    card.appendChild(run);
    exsec.appendChild(card);
  });
  app.appendChild(exsec);

  // set selector
  const s2=el("div","sec");
  s2.appendChild(el("div","label","Question set"));
  const seg=el("div","seg");
  [["Both","Both"],["MCQ only","MCQ only"],["Checkpoints only","Checkpoints only"]].forEach(([lbl,val])=>{
    const b=el("button",state.set===val?"on":"",lbl); b.onclick=()=>{state.set=val; [...seg.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); updateNote();};
    seg.appendChild(b);
  });
  s2.appendChild(seg);
  app.appendChild(s2);

  // options row
  const s3=el("div","sec"); s3.appendChild(el("div","label","Options"));
  const row=el("div","row");
  // immediate toggle
  const tog=el("div","tog"+(state.immediate?" on":"")); tog.appendChild(el("span","switch"));
  tog.appendChild(el("span",null,"Immediate feedback")); 
  tog.onclick=()=>{state.immediate=!state.immediate; tog.classList.toggle("on");};
  row.appendChild(tog);
  // count
  const cfld=el("div","fld"); cfld.appendChild(el("span",null,"Length"));
  const cseg=el("div","seg");
  ["All","25","40"].forEach(v=>{const b=el("button",state.count===v?"on":"",v); b.onclick=()=>{state.count=v;[...cseg.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");}; cseg.appendChild(b);});
  cfld.appendChild(cseg); row.appendChild(cfld);
  s3.appendChild(row);
  app.appendChild(s3);

  const noteP=el("p","note"); noteP.id="note"; app.appendChild(noteP); updateNote();

  const run=el("button","btn primary run","▸ Start session");
  run.style.marginTop="20px";
  run.onclick=startSession;
  app.appendChild(run);

  app.appendChild(el("p","note","Tip: in your phone browser, use Share → Add to Home Screen for an app icon. Works fully offline once saved."));
}
function updateNote(){
  const n=document.getElementById("note"); if(!n)return;
  let pool=BANK.filter(q=>state.chapters.has(q.ch));
  if(state.set==="MCQ only") pool=pool.filter(q=>q.kind!=="Checkpoint");
  if(state.set==="Checkpoints only") pool=pool.filter(q=>q.kind==="Checkpoint");
  n.innerHTML="";
  n.append(document.createTextNode("Pool: "));
  const b=el("b",null,pool.length+" items"); n.appendChild(b);
  n.append(document.createTextNode(`  ·  ${nMcq()} MCQ/trace/output + ${nCp()} Check Point items, now all auto-graded multiple choice. Your documented answer is shown as the explanation.`));
}

/* ---------------- SESSION ---------------- */
function startExam(tag){
  const pool=BANK.filter(q=>q.ch===tag);   // fixed exam order, no shuffle
  if(!pool.length) return;
  state.qs=pool; state.idx=0; state.answered={}; state.order={};
  state.times={}; state.sessionStart=performance.now();
  stopTick(); state.tick=setInterval(updTimer,1000);
  renderQ();
}
function startSession(){
  let pool=BANK.filter(q=>state.chapters.has(q.ch));
  if(state.set==="MCQ only") pool=pool.filter(q=>q.kind!=="Checkpoint");
  if(state.set==="Checkpoints only") pool=pool.filter(q=>q.kind==="Checkpoint");
  if(pool.length===0){ return; }
  pool=shuffle(pool.slice());
  if(state.count!=="All") pool=pool.slice(0,parseInt(state.count));
  pool.sort((a,b)=> (a.ch-b.ch) || ((a.kind==="Checkpoint")-(b.kind==="Checkpoint")));
  state.qs=pool; state.idx=0; state.answered={}; state.order={};
  state.times={}; state.sessionStart=performance.now();
  stopTick(); state.tick=setInterval(updTimer,1000);
  renderQ();
}

function renderQ(){
  const q=state.qs[state.idx], i=state.idx, total=state.qs.length;
  app.innerHTML="";
  // head
  const head=el("div","qhead");
  const chb=el("span","badge ch","CH "+q.ch); head.appendChild(chb);
  const kb=el("span","badge kind",q.kind); kb.style.background=KIND_COLOR[q.kind]; head.appendChild(kb);
  const t=el("span","timer"); t.id="sesstime"; t.textContent=state.sessionStart!=null?fmtClock(performance.now()-state.sessionStart):"00:00"; head.appendChild(t);
  head.appendChild(el("span","count",`${i+1} / ${total}`));
  app.appendChild(head);
  state.shownAt=performance.now();
  const bar=el("div","bar"); const fill=el("i"); fill.style.width=((i+1)/total*100)+"%"; bar.appendChild(fill); app.appendChild(bar);

  app.appendChild(el("p","qtext",q.q));
  if(q.code){ app.appendChild(el("pre","code",q.code)); }

  const body=el("div"); app.appendChild(body);
  if(q.answers) renderFree(q,body);
  else renderMcq(q,body);

  // nav
  const nav=el("div","nav");
  if(i>0){const b=el("button","btn ghost","‹ Back"); b.onclick=()=>{state.idx--; renderQ();}; nav.appendChild(b);}
  nav.appendChild(el("div","sp"));
  const nb=el("button","btn primary", i===total-1?"Finish ▸":"Next ›"); nb.onclick=next; nav.appendChild(nb);
  app.appendChild(nav);
  window.scrollTo(0,0);
}
function next(){ if(state.idx===state.qs.length-1) renderResults(); else {state.idx++; renderQ();} }

function renderMcq(q,body){
  const i=state.idx;
  if(!state.order[i]){ state.order[i]= q.fixed ? q.opts.map((t,ix)=>({t,ix})) : shuffle(q.opts.map((t,ix)=>({t,ix}))); }
  const pairs=state.order[i];
  const correct=q.opts[q.ans];
  const answered=state.answered[i]!=null;
  const wrap=el("div","opts");
  const letters="ABCDEFGH";
  pairs.forEach((p,n)=>{
    const b=el("button","opt"); b.disabled=answered && state.immediate;
    b.appendChild(el("span","ltr",letters[n]+"."));
    b.appendChild(el("span",isCode(p.t)?"codeopt":null,p.t));
    if(answered && state.immediate){
      if(p.t===correct) b.classList.add("correct");
      else if(p.t===state.answered[i]) b.classList.add("wrong");
    }
    b.onclick=()=>{
      commitTime(i);
      state.answered[i]=p.t;
      if(state.immediate){ renderQ(); }
      else { [...wrap.children].forEach(x=>x.style.outline=""); b.style.outline="2px solid var(--amber)"; }
    };
    wrap.appendChild(b);
  });
  body.appendChild(wrap);
  if(answered && state.immediate) body.appendChild(feedback(state.answered[i]===correct, q));
}
function renderFree(q,body){
  const i=state.idx;
  const answered=state.answered[i]!=null;
  body.appendChild(el("p","frhint","Type the program's exact output (spaces & case ignored):"));
  const fr=el("div","fr");
  const inp=el("input"); inp.type="text"; inp.value=answered?state.answered[i]:""; inp.placeholder="output…";
  inp.disabled=answered&&state.immediate; inp.autocomplete="off"; inp.autocapitalize="off"; inp.spellcheck=false;
  const chk=el("button","btn primary","Check"); chk.disabled=answered&&state.immediate;
  const submit=()=>{ if(!inp.value.trim())return; commitTime(i); state.answered[i]=inp.value; renderQ(); };
  chk.onclick=submit; inp.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  fr.append(inp,chk); body.appendChild(fr);
  if(answered && state.immediate){
    const ok=q.answers.some(a=>norm(a)===norm(state.answered[i]));
    body.appendChild(feedback(ok,q));
  }
}
function feedback(ok,q){
  const fb=el("div","fb "+(ok?"ok":"no"));
  const v=el("p","v"); v.textContent=ok?"✓ PASS":"✗ FAIL"; fb.appendChild(v);
  if(!ok){ fb.appendChild(answerNode("Answer:", q.answers?q.answers[0]:q.opts[q.ans])); }
  if(q.exp){ fb.appendChild(el("p","exp",q.exp)); }
  return fb;
}

/* ---------------- RESULTS ---------------- */
function isCorrect(i){
  const q=state.qs[i], a=state.answered[i];
  if(a==null) return false;
  if(q.answers) return q.answers.some(x=>norm(x)===norm(a));
  return a===q.opts[q.ans];
}
function correctText(q){ if(q.answers)return q.answers[0]; return q.opts[q.ans]; }

function renderResults(){
  stopTick();
  app.innerHTML="";
  const total=state.qs.length; let correct=0;
  const perCh={}, perKind={}, misses=[];
  state.qs.forEach((q,i)=>{
    const ok=isCorrect(i); if(ok)correct++;
    (perCh[q.ch]=perCh[q.ch]||[0,0]); perCh[q.ch][1]++; if(ok)perCh[q.ch][0]++;
    (perKind[q.kind]=perKind[q.kind]||[0,0]); perKind[q.kind][1]++; if(ok)perKind[q.kind][0]++;
    if(!ok) misses.push([q,state.answered[i],i]);
  });
  const pct=total?Math.round(100*correct/total):0;
  const pass=pct>=70;

  // --- timing analysis ---
  const tvals = state.qs.map((q,i)=>state.times[i]).filter(v=>v!=null);
  const totalT = state.sessionStart!=null ? (performance.now()-state.sessionStart)/1000 : 0;
  const answeredT = tvals.reduce((a,b)=>a+b,0);
  const avg = tvals.length ? answeredT/tvals.length : 0;
  const sorted=[...tvals].sort((a,b)=>a-b);
  const median = sorted.length ? sorted[Math.floor(sorted.length/2)] : 0;
  // rank: accuracy-gated (speed can't buy it)
  const tiers=[[95,"CHAMPION"],[85,"Sharp"],[70,"Solid build"],[50,"Building"],[0,"Needs a rebuild"]];
  const rank=tiers.find(t=>pct>=t[0])[1];
  const pace = median===0 ? "" : (median<8?"blazing":(median<=20?"steady":"deliberate"));
  const flair = (pct>=95 && pace==="blazing") ? " ⚡" : "";
  // rushed misses = wrong AND fast;  grinders = right but slow
  let rushed=0, grinders=0;
  state.qs.forEach((q,i)=>{
    const tt=state.times[i]; if(tt==null) return;
    const fast = tt < Math.max(2.5, 0.45*median);
    const slow = median>0 && tt > 2.4*median;
    if(!isCorrect(i) && fast) rushed++;
    if(isCorrect(i) && slow) grinders++;
  });

  const pr=el("p","prompt"); pr.innerHTML='<span class="u">hasan</span>@<span class="p">iug</span>:<span class="d">~/cpp</span>$ make test'; app.appendChild(pr);
  const sc=el("div","score");
  sc.appendChild(el("div","pf", pass?"build passed":"tests incomplete"));
  const big=el("div","big "+(pass?"pass":"fail"),pct+"%"); sc.appendChild(big);
  sc.appendChild(el("div","frac",correct+" / "+total+" correct"));
  const rk=el("div","rank"); rk.innerHTML='RANK&nbsp; <b>'+rank+flair+'</b>'+(pace?'<span class="pacetag">'+pace+' pace</span>':''); sc.appendChild(rk);
  app.appendChild(sc);

  // pace stats strip
  if(tvals.length){
    const ps=el("div","pacebox");
    const stat=(lbl,val)=>{const d=el("div","pstat"); d.appendChild(el("div","pv",val)); d.appendChild(el("div","pl",lbl)); return d;};
    ps.appendChild(stat("total time", fmtClock(totalT*1000)));
    ps.appendChild(stat("avg / question", avg.toFixed(1)+"s"));
    ps.appendChild(stat("median", median.toFixed(1)+"s"));
    app.appendChild(ps);
    if(rushed||grinders){
      const ins=el("div","insights");
      if(rushed){ const r=el("div","insight bad"); r.textContent="⚠ "+rushed+" rushed miss"+(rushed>1?"es":"")+" — wrong answers under "+Math.max(2.5,0.45*median).toFixed(1)+"s. These read like guesses; slow down and re-derive."; ins.appendChild(r); }
      if(grinders){ const g=el("div","insight warn"); g.textContent="◷ "+grinders+" grinder"+(grinders>1?"s":"")+" — correct but slow. You know these; drill them for exam-speed fluency."; ins.appendChild(g); }
      app.appendChild(ins);
    }
  }


  const t1=el("div","sec"); t1.appendChild(el("div","label","By chapter")); t1.appendChild(meterTable(perCh,k=> EXAM_TITLE[k] || ("Chapter "+k))); app.appendChild(t1);
  const t2=el("div","sec"); t2.appendChild(el("div","label","By type")); t2.appendChild(meterTable(perKind,k=>k)); app.appendChild(t2);

  if(misses.length){
    const m=el("div","sec"); m.appendChild(el("div","label","Review — "+misses.length+" to revisit"));
    misses.forEach(([q,chosen,qi])=>{
      const r=el("div","rev");
      const tt=state.times[qi];
      r.appendChild(el("div","tag","CH "+q.ch+" · "+q.kind+(tt!=null?" · "+tt.toFixed(1)+"s":"")));
      r.appendChild(el("p","rq",q.q));
      if(q.code) r.appendChild(el("pre","code",q.code));
      r.appendChild(answerNode("Your answer:", chosen==null?"(skipped)":chosen, "var(--bad)"));
      r.appendChild(answerNode("Correct:", correctText(q), "var(--good)"));
      if(q.exp) r.appendChild(el("p","ex",q.exp));
      m.appendChild(r);
    });
    app.appendChild(m);
  } else {
    app.appendChild(el("p","empty","✓ clean sweep — every test passed."));
  }

  const nav=el("div","nav");
  const again=el("button","btn primary","↻ New session"); again.onclick=renderStart;
  nav.appendChild(el("div","sp")); nav.appendChild(again); app.appendChild(nav);
  window.scrollTo(0,0);
}
function meterTable(data,namer){
  const t=el("div","tbl");
  Object.keys(data).sort((a,b)=>a-b||a.localeCompare(b)).forEach(k=>{
    const [c,n]=data[k]; const p=n?Math.round(100*c/n):0;
    const row=el("div","trow");
    row.appendChild(el("div","nm",namer(k)));
    const meter=el("div","meter"); const fi=el("i"); fi.style.width=p+"%";
    fi.style.background = p>=70?"var(--good)":(p>=40?"var(--amber)":"var(--bad)");
    meter.appendChild(fi); row.appendChild(meter);
    row.appendChild(el("div","pct",c+"/"+n+" · "+p+"%"));
    t.appendChild(row);
  });
  return t;
}

renderStart();
</script>
</body>
</html>
