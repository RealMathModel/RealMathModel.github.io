<title>C++ Mastery Console — Ch 1–9</title>

<style>
:root{
  --bg:#0B1220; --bg2:#0E1726; --panel:#141E33; --panel2:#192541;
  --line:#26334E; --line2:#33425f;
  --ink:#E7ECF7; --muted:#8A97AD; --faint:#5C6981;
  --amber:#E7B53D; --amber-dim:#9c7a25;
  --good:#4FC08A; --good-bg:#11281f; --good-line:#235c43;
  --bad:#EB6A4E;  --bad-bg:#2a1410;  --bad-line:#6b3022;
  --k-concept:#E7B53D; --k-trace:#6F9BE8; --k-recall:#B79BE0; --k-output:#E08A5B; --k-checkpoint:#4FB89A;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 70% -10%, rgba(231,181,61,.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(79,184,154,.06), transparent 55%),
    var(--bg);
  color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  min-height:100vh; min-height:100dvh;
}
.wrap{max-width:740px; margin:0 auto; padding:0 16px env(safe-area-inset-bottom) 16px;
  padding-top:calc(12px + env(safe-area-inset-top));}
/* terminal chrome */
.term{background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line); border-radius:12px; overflow:hidden;
  box-shadow:0 24px 60px -28px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);}
.termbar{display:flex; align-items:center; gap:8px; padding:10px 14px;
  background:rgba(255,255,255,.02); border-bottom:1px solid var(--line);}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#e8654b}.dot.y{background:#e7b53d}.dot.g{background:#4fc08a}
.termtitle{font-family:var(--mono); font-size:12px; color:var(--faint); margin-left:8px; letter-spacing:.02em}
.termbody{padding:18px 18px 22px}
@media(min-width:560px){.termbody{padding:24px 26px 28px}}
.prompt{font-family:var(--mono); font-size:13px; color:var(--muted); margin:0 0 4px}
.prompt .u{color:var(--good)} .prompt .p{color:var(--k-trace)} .prompt .d{color:var(--amber)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--amber);
  vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h1{font-family:var(--mono); font-weight:700; font-size:26px; letter-spacing:-.01em;
  margin:6px 0 2px; line-height:1.12}
@media(min-width:560px){h1{font-size:31px}}
h1 .ac{color:var(--amber)}
.sub{color:var(--muted); font-size:14px; margin:0 0 18px}
/* sections */
.sec{margin-top:22px}
.label{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--faint); margin:0 0 10px; display:flex; align-items:center; gap:8px}
.label::before{content:""; width:14px; height:1px; background:var(--line2)}
/* chapter chips */
.chips{display:grid; grid-template-columns:1fr; gap:7px}
@media(min-width:560px){.chips{grid-template-columns:1fr 1fr}}
.chip{display:flex; align-items:center; gap:11px; padding:11px 13px; cursor:pointer;
  background:var(--panel); border:1px solid var(--line); border-radius:9px;
  transition:border-color .15s, background .15s; user-select:none}
.chip:hover{border-color:var(--line2)}
.chip.on{border-color:var(--amber-dim); background:linear-gradient(var(--panel),var(--panel2))}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2); flex:0 0 auto;
  display:grid;place-items:center; font-family:var(--mono); font-size:12px; color:var(--bg)}
.chip.on .box{background:var(--amber); border-color:var(--amber)}
.chip.on .box::after{content:"✓"; color:#1a1405; font-weight:700; font-size:12px}
.cn{font-family:var(--mono); color:var(--amber); font-size:13px; flex:0 0 auto}
.ct{font-size:13px; color:var(--ink)} .ct small{color:var(--muted)}
.minirow{display:flex; gap:14px; margin:8px 2px 0}
.mini{font-family:var(--mono); font-size:12px; color:var(--muted); background:none; border:none;
  cursor:pointer; padding:0; text-decoration:underline; text-underline-offset:3px}
.mini:hover{color:var(--amber)}
/* segmented + toggles */
.seg{display:inline-flex; background:var(--bg2); border:1px solid var(--line); border-radius:9px; padding:3px; flex-wrap:wrap}
.seg button{font-family:var(--sans); font-size:13px; color:var(--muted); background:none; border:none;
  padding:8px 14px; border-radius:7px; cursor:pointer; transition:.15s}
.seg button.on{background:var(--amber); color:#1a1405; font-weight:600}
.row{display:flex; flex-wrap:wrap; gap:18px; align-items:center}
.fld{display:flex; flex-direction:column; gap:8px}
.fld>span{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint)}
.tog{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; font-size:14px; color:var(--ink)}
.switch{width:42px;height:24px;border-radius:13px;background:var(--line);position:relative;transition:.18s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.18s}
.tog.on .switch{background:var(--amber)} .tog.on .switch::after{left:21px;background:#1a1405}
/* buttons */
.btn{font-family:var(--sans); font-size:15px; font-weight:600; cursor:pointer; border-radius:10px;
  padding:13px 22px; border:1px solid transparent; transition:.15s; -webkit-tap-highlight-color:transparent}
.btn.primary{background:var(--amber); color:#1a1405; box-shadow:0 10px 30px -12px rgba(231,181,61,.6)}
.btn.primary:hover{filter:brightness(1.06)} .btn.primary:active{transform:translateY(1px)}
.btn.ghost{background:transparent; color:var(--muted); border-color:var(--line)}
.btn.ghost:hover{color:var(--ink); border-color:var(--line2)}
.btn.run{font-family:var(--mono); letter-spacing:.02em}
.note{color:var(--faint); font-size:12.5px; line-height:1.6; margin:18px 2px 0}
.note b{color:var(--muted); font-weight:600}
/* quiz */
.qhead{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.badge{font-family:var(--mono); font-size:11px; letter-spacing:.06em; padding:4px 9px; border-radius:6px;
  border:1px solid var(--line2); color:var(--muted)}
.badge.ch{color:var(--ink)}
.badge.kind{border:none; color:#11192b; font-weight:700}
.count{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--faint)}
.bar{height:5px; background:var(--bg2); border-radius:99px; overflow:hidden; margin-bottom:20px; border:1px solid var(--line)}
.bar>i{display:block; height:100%; background:linear-gradient(90deg,var(--amber-dim),var(--amber)); transition:width .35s ease}
.qtext{font-size:18px; line-height:1.45; margin:0 0 14px; white-space:pre-wrap}
@media(min-width:560px){.qtext{font-size:19px}}
pre.code{font-family:var(--mono); font-size:13.5px; line-height:1.6; background:#0a0f1c;
  border:1px solid var(--line); border-left:3px solid var(--k-trace); border-radius:9px;
  padding:14px 15px; margin:0 0 16px; overflow-x:auto; color:#d7e0f2; white-space:pre}
@media(min-width:560px){pre.code{font-size:14px}}
.opts{display:flex; flex-direction:column; gap:9px; margin-top:4px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 14px;
  cursor:pointer; transition:.13s; color:var(--ink); font-size:15px; font-family:var(--sans); line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--line2); background:var(--panel2)}
.opt:disabled{cursor:default}
.opt .ltr{font-family:var(--mono); font-weight:700; color:var(--amber); flex:0 0 auto}
.opt.correct{background:var(--good-bg); border-color:var(--good-line)}
.opt.correct .ltr{color:var(--good)}
.opt.wrong{background:var(--bad-bg); border-color:var(--bad-line)}
.opt.wrong .ltr{color:var(--bad)}
/* free response */
.fr{display:flex; gap:9px; margin-top:6px; flex-wrap:wrap}
.fr input{flex:1 1 200px; font-family:var(--mono); font-size:15px; background:#0a0f1c; color:var(--ink);
  border:1px solid var(--line2); border-radius:9px; padding:12px 13px; outline:none}
.fr input:focus{border-color:var(--amber)}
.frhint{font-size:12.5px; color:var(--faint); margin:14px 0 6px; font-family:var(--mono)}
/* feedback / reveal */
.fb{margin-top:16px; border-radius:10px; padding:13px 15px; border:1px solid}
.fb.ok{background:var(--good-bg); border-color:var(--good-line)}
.fb.no{background:var(--bad-bg); border-color:var(--bad-line)}
.fb .v{font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.04em; margin:0 0 6px; display:flex; gap:8px; align-items:center}
.fb.ok .v{color:var(--good)} .fb.no .v{color:var(--bad)}
.fb .ans{font-size:14px; color:var(--ink); margin:0 0 7px}
.fb .ans b{color:var(--muted); font-weight:600}
.fb .exp{font-size:14px; color:#cdd6e6; white-space:pre-wrap; line-height:1.5}
.reveal{margin-top:14px; border:1px solid var(--k-checkpoint); border-radius:10px;
  background:#0f211c; padding:14px 15px}
.reveal h4{font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--k-checkpoint);
  margin:0 0 8px; text-transform:uppercase}
.reveal p{margin:0; white-space:pre-wrap; font-size:14px; color:#d7e7e1; line-height:1.55}
.grade{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap}
.grade button{flex:1 1 140px}
.btn.got{background:var(--good); color:#06231a}
.btn.miss{background:var(--bad); color:#2a0f08}
/* nav */
.nav{display:flex; gap:10px; margin-top:22px}
.nav .sp{flex:1}
/* results */
.score{font-family:var(--mono); text-align:center; margin:8px 0 4px}
.score .pf{font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.score .big{font-size:58px; font-weight:700; line-height:1; margin:6px 0}
.score .big.pass{color:var(--good)} .score .big.fail{color:var(--amber)}
.score .frac{color:var(--muted); font-size:15px}
.tbl{margin-top:18px}
.tbl .trow{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}
.tbl .trow .nm{font-size:14px; color:var(--ink); flex:0 0 130px}
.tbl .trow .meter{flex:1; height:8px; background:var(--bg2); border-radius:99px; overflow:hidden; border:1px solid var(--line)}
.tbl .trow .meter>i{display:block;height:100%;background:var(--amber)}
.tbl .trow .pct{font-family:var(--mono); font-size:12.5px; color:var(--muted); flex:0 0 64px; text-align:right}
.rev{margin-top:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px}
.rev .rq{font-size:14.5px; margin:0 0 8px; white-space:pre-wrap}
.rev .tag{font-family:var(--mono); font-size:11px; color:var(--faint); margin-bottom:6px}
.rev .ya{font-size:13px; color:var(--bad)} .rev .ca{font-size:13px; color:var(--good)}
.rev .ex{font-size:13px; color:#cdd6e6; margin-top:6px; white-space:pre-wrap; line-height:1.5}
.rev pre.code{margin:8px 0}
.center{text-align:center}
.empty{font-family:var(--mono); color:var(--good); text-align:center; padding:18px; font-size:15px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
</style>
</head>

<script>
const BANK = [{"ch": 2, "kind": "Trace", "q": "What value ends up in d?", "code": "double d = 5 / 2 + 1.5;", "opts": ["4.0", "3.5", "4.5", "3.0"], "ans": 1, "exp": "5/2 is int/int = 2 (truncated) BEFORE the + happens. Then 2 + 1.5 = 3.5. The 1.5 only promotes its own addition, not the division that already finished."}, {"ch": 2, "kind": "Trace", "q": "What is printed?", "code": "cout << 1 / 2 + 1 / 2;", "opts": ["1", "0", "0.5", "1.0"], "ans": 1, "exp": "Each 1/2 is integer division = 0. 0 + 0 = 0. Don't let the math fool you -- there's no double anywhere."}, {"ch": 2, "kind": "Trace", "q": "What is printed?", "code": "cout << 7 / 2 * 2;", "opts": ["7", "6", "8", "7.0"], "ans": 1, "exp": "Left to right, same precedence: 7/2 = 3 (int), 3*2 = 6. Integer division loses the .5 permanently."}, {"ch": 2, "kind": "Concept", "q": "With int a=10, b=3, which gives 3.3333 (not 3.0)?", "code": "// A:\nstatic_cast<double>(a / b)\n// B:\nstatic_cast<double>(a) / b", "opts": ["A", "B", "Both", "Neither"], "ans": 1, "exp": "In A, a/b is computed as ints (=3) FIRST, then cast to 3.0 -- too late. In B, a becomes 10.0 first, so 10.0/3 is real division = 3.3333. Cast the operand, not the result."}, {"ch": 2, "kind": "Trace", "q": "What does this print?", "code": "cout << static_cast<int>(2.7)\n     << static_cast<int>(-2.7);", "opts": ["3-3", "2-2", "3-2", "2-3"], "ans": 1, "exp": "Casting double->int TRUNCATES toward zero (not rounds, not floors). 2.7 -> 2, -2.7 -> -2. Printed back to back: 2-2."}, {"ch": 2, "kind": "Trace", "q": "What is the result of (6 + 10) % 7 ?", "opts": ["2", "16", "3", "1"], "ans": 0, "exp": "16 % 7 = 2 (16 = 2*7 + 2). This is the cyclic pattern: days/hours/clock arithmetic all use %."}, {"ch": 2, "kind": "Trace", "q": "What does -7 % 3 evaluate to?", "opts": ["1", "-1", "2", "-2"], "ans": 1, "exp": "For %, the sign follows the LEFT operand. -7 % 3 = -1. (And 7 % -3 = 1.) Not a math-style non-negative remainder."}, {"ch": 2, "kind": "Concept", "q": "After this runs, x is:", "code": "int x = 7;\nx %= 3 + 2;", "opts": ["x = 1  (i.e. 7 % 3, then + 2)", "x = 2  (i.e. 7 % (3+2))", "x = 0", "Compile error"], "ans": 1, "exp": "Augmented assignment treats the whole RHS as one unit: x = x % (3 + 2) = 7 % 5 = 2. The op (%) is applied last, after 3+2 is evaluated."}, {"ch": 2, "kind": "Trace", "q": "What are y and x afterwards?", "code": "int x = 5;\nint y = x++;\nint z = ++x;", "opts": ["y=5, x=7, z=7", "y=6, x=7, z=7", "y=5, x=6, z=6", "y=6, x=6, z=7"], "ans": 0, "exp": "x++ yields the OLD value (y=5) then makes x=6. ++x makes x=7 then yields the NEW value (z=7). Track 'value handed back' separately from 'value stored'."}, {"ch": 2, "kind": "Concept", "q": "Why should you never rely on the output of  ++i + i ?", "opts": ["It's a syntax error", "C++ does not specify the order in which the two operands are evaluated", "++i always wins", "The + can't take an incremented operand"], "ans": 1, "exp": "C++ leaves operand evaluation order UNSPECIFIED here, so whether the left ++i runs before reading the right i isn't guaranteed. Never write code whose result depends on evaluation order."}, {"ch": 2, "kind": "Trace", "q": "A signed short holds max 32767. What is s after:", "code": "short s = 32767;\ns = s + 1;", "opts": ["32768", "-32768", "0", "Compile error"], "ans": 1, "exp": "Integer overflow wraps around in two's complement to -32768. C++ reports NO error or warning at runtime. Trace the magnitude, not just the algebra."}, {"ch": 2, "kind": "Trace", "q": "What is printed?", "code": "unsigned int u = 0;\nu = u - 1;\ncout << u;", "opts": ["-1", "0", "4294967295", "Compile error"], "ans": 2, "exp": "unsigned can't be negative, so 0 - 1 wraps to the maximum: 2^32 - 1 = 4294967295. Mixing unsigned with subtraction is a classic surprise."}, {"ch": 2, "kind": "Trace", "q": "What does  static_cast<int>(10.03 * 100)  print?", "opts": ["1003", "1002", "1002.99", "1003.0"], "ans": 1, "exp": "Floating round-off: 10.03 * 100 is actually 1002.9999999999999, not 1003. int-cast truncates -> 1002. The money-in-cents bug."}, {"ch": 2, "kind": "Trace", "q": "What is printed?", "code": "cout << 0xFFFF << \" \" << 010;", "opts": ["FFFF 10", "65535 8", "65535 10", "255 8"], "ans": 1, "exp": "0x = hex: FFFF = 65535. A leading 0 = OCTAL: 010 = 8 (not ten!). cout shows both in decimal."}, {"ch": 2, "kind": "Concept", "q": "Which line is illegal?", "code": "// A:\nint i = j = k = 1;\n// B:\nint i, j, k;  i = j = k = 1;", "opts": ["A (j, k used before declaration)", "B", "Both", "Neither"], "ans": 0, "exp": "A tries to use j and k before they exist. B declares them first; then i=(j=(k=1)) works because = is right-associative."}, {"ch": 2, "kind": "Trace", "q": "What does this print?", "code": "cout << (x = 5);", "opts": ["nothing", "5", "x", "1"], "ans": 1, "exp": "An assignment is itself an expression whose value is the value assigned. (x = 5) yields 5, so cout prints 5 (and x becomes 5)."}, {"ch": 2, "kind": "Recall", "q": "sizeof is best described as:", "opts": ["A <cmath> function evaluated at runtime", "A compile-time operator giving a type/variable's size in bytes", "A macro that works only on variables", "A function that works only on type names"], "ans": 1, "exp": "sizeof is a built-in COMPILE-TIME operator (not a function), works on both types and variables, e.g. 4 for int, 8 for double on typical machines."}, {"ch": 2, "kind": "Concept", "q": "Which is a correct named-constant declaration?", "code": "// A:\nconst double PI;  PI = 3.14159;\n// B:\nconst double PI = 3.14159;", "opts": ["A", "B", "Both", "Neither"], "ans": 1, "exp": "A const MUST be initialized in the same statement it's declared -- you can't assign to it afterward. Convention also names constants in UPPERCASE."}, {"ch": 2, "kind": "Recall", "q": "To use pow(), which header must you include?", "opts": ["<cstdlib>", "<cmath>", "<iomanip>", "<ctime>"], "ans": 1, "exp": "pow/sqrt/log/exp/ceil/floor live in <cmath>. time(0) is <ctime>; rand/srand/abs(int) is <cstdlib>; manipulators are <iomanip>. Forgetting the header -> compile error."}, {"ch": 2, "kind": "Concept", "q": "celsius = (5 / 9) * (f - 32);  is always 0. Best fix?", "opts": ["Include <cmath>", "Write (5.0 / 9) * (f - 32)", "Make f a double", "Add parentheses around 5/9"], "ans": 1, "exp": "5/9 with two ints truncates to 0, zeroing everything. Force one operand to floating point: 5.0/9. Making f a double doesn't help -- 5/9 is still computed as ints first."}, {"ch": 2, "kind": "Recall", "q": "The difference between a declaration and a definition is:", "opts": ["No difference in C++", "A definition allocates storage; a pure declaration only introduces the name/type", "A declaration allocates storage; a definition only names it", "Both always allocate storage"], "ans": 1, "exp": "A definition tells the compiler to allocate storage. Every definition is also a declaration, but a declaration (e.g. a function prototype) need not define/allocate anything."}, {"ch": 3, "kind": "Trace", "q": "What is printed?", "code": "int x = 0;\nif (false && (++x)) { }\ncout << x;", "opts": ["1", "0", "Compile error", "Undefined"], "ans": 1, "exp": "&& short-circuits: false makes the whole thing false without evaluating the right side, so ++x never runs. x stays 0."}, {"ch": 3, "kind": "Trace", "q": "What is printed?", "code": "int x = 0;\nif (true || (++x)) { }\ncout << x;", "opts": ["1", "0", "Compile error", "2"], "ans": 1, "exp": "|| short-circuits: true alone decides the result, so the right operand (++x) is skipped. x stays 0."}, {"ch": 3, "kind": "Trace", "q": "What does  cout << !5;  print?", "opts": ["5", "0", "1", "-5"], "ans": 1, "exp": "5 is nonzero, i.e. true. !true = false = 0. (Any nonzero value is treated as true.)"}, {"ch": 3, "kind": "Trace", "q": "Evaluate  5 > 3 > 1 .", "opts": ["1 (true)", "0 (false)", "Compile error", "5"], "ans": 1, "exp": "< and > are left-associative: (5>3) = 1, then 1 > 1 = 0 (false). No chained comparison in C++."}, {"ch": 3, "kind": "Concept", "q": "The guard  if (!amount <= 50)  actually parses as, and behaves how?", "opts": ["!(amount <= 50) -- as intended", "(!amount) <= 50 -- which is ALWAYS true", "!(amount) <= 50 -- always false", "Syntax error"], "ans": 1, "exp": "! binds tighter than <=, so it's (!amount) <= 50. !amount is 0 or 1, both <= 50 -> always true. You meant !(amount <= 50)."}, {"ch": 3, "kind": "Concept", "q": "if (1 <= days <= 31) is a logic error because:", "opts": ["<= can't be used twice", "(1 <= days) yields 0/1, then 0/1 <= 31 is always true", "days must be a double", "It needs an else"], "ans": 1, "exp": "Left-to-right: (1 <= days) is a bool (0 or 1); 0 or 1 <= 31 is always true. Write (1 <= days) && (days <= 31)."}, {"ch": 3, "kind": "Trace", "q": "Evaluate:", "code": "3 + 4 * 4 > 5 * (4 + 3) - 1 && (4 - 3 > 5)", "opts": ["1 (true)", "0 (false)", "34", "Compile error"], "ans": 1, "exp": "Left: 3+16 = 19. Right: 5*7-1 = 34. 19 > 34 is false. Other side: 1 > 5 is false. false && false = 0. && binds looser than arithmetic/relational."}, {"ch": 3, "kind": "Concept", "q": "a < b == c parses as:", "opts": ["a < (b == c)", "(a < b) == c", "a < b < c", "Ambiguous"], "ans": 1, "exp": "Relational < outranks equality ==, so it's (a < b) == c. The 0/1 result of a<b is compared to c."}, {"ch": 3, "kind": "Trace", "q": "What is the exact output?", "code": "int x = 2;\nswitch (x) {\n  case 1: cout << \"A\";\n  case 2: cout << \"B\";\n  case 3: cout << \"C\"; break;\n  case 4: cout << \"D\";\n}", "opts": ["B", "BC", "BCD", "ABC"], "ans": 1, "exp": "switch jumps to case 2, prints B, then FALLS THROUGH case 3 (prints C) until break stops it. case 1 and 4 are never touched. Output: BC."}, {"ch": 3, "kind": "Concept", "q": "Which type is NOT allowed as a switch expression?", "opts": ["int", "char", "bool", "double"], "ans": 3, "exp": "switch needs an INTEGRAL value (int, char, bool, short, long...). float, double and string are illegal. case labels must also be integral constants -- no variables."}, {"ch": 3, "kind": "Trace", "q": "What prints? (note the semicolon)", "code": "int amount = 5;\nif (amount >= 100);\n    cout << \"Big \";\ncout << \"Done\";", "opts": ["Done", "Big Done", "(nothing)", "Big"], "ans": 1, "exp": "The ';' after if() makes the if body EMPTY. 'Big' then runs unconditionally as a normal statement. Output: 'Big Done'. A stray semicolon after if/for silently detaches the block."}, {"ch": 3, "kind": "Trace", "q": "What prints?", "code": "int x = 0;\nif (x = 5)\n    cout << \"yes\";\nelse\n    cout << \"no\";", "opts": ["no", "yes", "(nothing)", "Compile error"], "ans": 1, "exp": "x = 5 is ASSIGNMENT (not ==). It sets x to 5 and the expression's value is 5, which is nonzero = true. So 'yes' prints. Confusing = with == is a classic bug."}, {"ch": 3, "kind": "Trace", "q": "What is the value of y?", "code": "int x = 5;\nint y = (x > 0) ? (x < 10 ? 1 : 2) : 3;", "opts": ["1", "2", "3", "5"], "ans": 0, "exp": "Outer cond (x>0) is true -> take the middle branch (x<10 ? 1 : 2). x<10 is true -> 1. Nested ternaries evaluate the matching branch only."}, {"ch": 3, "kind": "Trace", "q": "What does  cout << (true + true);  print?", "opts": ["true", "1", "2", "Compile error"], "ans": 2, "exp": "true promotes to int 1, so true + true = 2. (Conversely, cout << (4 < 5) prints 1, not 'true'.)"}, {"ch": 3, "kind": "Recall", "q": "By De Morgan's law, !(c1 && c2) equals:", "opts": ["!c1 && !c2", "!c1 || !c2", "c1 || c2", "!(c1 || c2)"], "ans": 1, "exp": "!(c1 && c2) = !c1 || !c2. And !(c1 || c2) = !c1 && !c2. Negation flips AND<->OR and negates each part."}, {"ch": 3, "kind": "Concept", "q": "How does & differ from && when the right operand has a side effect?", "opts": ["Identical for booleans", "& always evaluates both operands; && may skip the right one (short-circuit)", "& short-circuits; && does not", "& is illegal on bools"], "ans": 1, "exp": "& (bitwise) and | always evaluate BOTH operands. && and || stop as soon as the result is known. If the right side has a side effect, & vs && changes behavior."}, {"ch": 3, "kind": "Concept", "q": "An else with no braces in a nested if binds to:", "opts": ["The first if", "The nearest preceding unmatched if", "Whatever indentation suggests", "The outermost if"], "ans": 1, "exp": "Dangling-else rule: else pairs with the NEAREST preceding unmatched if. Indentation is invisible to the compiler; only braces change the pairing."}, {"ch": 3, "kind": "Trace", "q": "Output? (Sunday=0..Saturday=6) Today is Saturday; what is (6+10)%7 and the day?", "opts": ["2 -> Tuesday", "3 -> Wednesday", "1 -> Monday", "16 -> overflow"], "ans": 0, "exp": "(6 + 10) % 7 = 16 % 7 = 2. Day index 2 = Tuesday. Cyclic problems (week/clock/months) are solved with %."}, {"ch": 3, "kind": "Recall", "q": "To get a random int in [a, b] inclusive, the formula is:", "opts": ["rand() % b + a", "a + rand() % (b - a + 1)", "a + rand() % (b - a)", "rand() % (a + b)"], "ans": 1, "exp": "a + rand() % (b - a + 1). The (b-a+1) span makes both ends inclusive. Seed once with srand(time(0))."}, {"ch": 3, "kind": "Concept", "q": "even = (n % 2 == 0);  vs an if/else that sets even -- which is preferred and why?", "opts": ["The if/else, it's clearer", "The direct assignment: the relational expression already yields the bool you want", "Neither compiles", "They behave differently"], "ans": 1, "exp": "A relational expression already produces a bool, so just assign it: even = (n % 2 == 0). Wrapping it in if(...) even=true; else even=false; is redundant."}, {"ch": 4, "kind": "Trace", "q": "What is printed?", "code": "char c = 'A' + 5;\ncout << c;", "opts": ["70", "F", "A5", "E"], "ans": 1, "exp": "'A'(65) + 5 = 70 (an int), stored into a char -> code 70 = 'F'. Printing a char shows the glyph, not the number."}, {"ch": 4, "kind": "Trace", "q": "What is printed?", "code": "cout << ('c' - 'a');", "opts": ["c", "2", "b", "ca"], "ans": 1, "exp": "char arithmetic = integer arithmetic on ASCII codes: 'c'(99) - 'a'(97) = 2, an INT. Prints 2, not a character."}, {"ch": 4, "kind": "Trace", "q": "What integer results?", "code": "int n = '1' + '2';", "opts": ["3", "33", "99", "12"], "ans": 2, "exp": "'1' is code 49, '2' is code 50. Adding chars adds codes: 49 + 50 = 99. NOT 1 + 2 = 3."}, {"ch": 4, "kind": "Trace", "q": "What does this print?", "code": "cout << static_cast<char>('a' + 25);", "opts": ["z", "y", "122", "Z"], "ans": 0, "exp": "'a'(97) + 25 = 122, cast to char = 'z'. The cast is what makes it print as a letter instead of 122."}, {"ch": 4, "kind": "Trace", "q": "What does  cout << toupper('a');  print? (toupper from <cctype>)", "opts": ["A", "65", "a", "97"], "ans": 1, "exp": "toupper returns an INT (the code), so cout prints 65, not 'A'. To see the letter you must wrap it: static_cast<char>(toupper('a')). Same trap with tolower."}, {"ch": 4, "kind": "Concept", "q": "With char ch='a', compare the two outputs:", "code": "cout << ++ch << \" \";  // 1\ncout << ch + 1;         // 2", "opts": ["b b", "b 99", "98 98", "b 98"], "ans": 1, "exp": "Line 1: ++ch makes ch='b' (still a char) -> prints 'b'. Line 2: ch + 1 promotes the char to int -> 'b'(98)+1 = 99 -> prints 99."}, {"ch": 4, "kind": "Trace", "q": "Evaluate the comparison  \"apple\" < \"Apple\" .", "opts": ["true", "false", "Compile error", "Undefined"], "ans": 1, "exp": "Lexicographic, by ASCII. First chars: 'a'(97) vs 'A'(65). 97 < 65 is false, so \"apple\" < \"Apple\" is FALSE (lowercase sorts AFTER uppercase)."}, {"ch": 4, "kind": "Concept", "q": "Which line is ILLEGAL?", "code": "// A:\nstring c = \"London\" + \"Paris\";\n// B:\nstring s = \"NY\"; string c = s + \"London\";", "opts": ["A (can't add two string literals)", "B", "Both", "Neither"], "ans": 0, "exp": "You cannot concatenate two raw string LITERALS with +. In B the left side of + is a std::string, which makes the whole thing legal."}, {"ch": 4, "kind": "Trace", "q": "What is s after this?", "code": "string s = \"ABC\";\ns[0] = 'X';\ns += 'D';", "opts": ["\"ABCD\"", "\"XBCD\"", "\"XBC\"", "Compile error"], "ans": 1, "exp": "s[0]='X' modifies in place -> \"XBC\". += 'D' appends a char -> \"XBCD\". Strings are mutable and indexable (0-based)."}, {"ch": 4, "kind": "Trace", "q": "What does  '9' - '0'  evaluate to?", "opts": ["9", "57", "'9'", "1"], "ans": 0, "exp": "'9'(57) - '0'(48) = 9. This is THE idiom to turn a digit character into its numeric value."}, {"ch": 4, "kind": "Trace", "q": "What does  ('1' == 1)  evaluate to?", "opts": ["true", "false", "Compile error", "1"], "ans": 1, "exp": "'1' is the char code 49, not the int 1. 49 == 1 is false. A digit character is not its numeric value."}, {"ch": 4, "kind": "Trace", "q": "What does ceil(-2.1) return? (<cmath>)", "opts": ["-3.0", "-2.0", "-2", "2.0"], "ans": 1, "exp": "ceil rounds UP toward +infinity on the number line: -2.1 -> -2.0. (floor(-2.1) would give -3.0.) Both return double, not int."}, {"ch": 4, "kind": "Trace", "q": "What does floor(-2.1) return?", "opts": ["-2.0", "-3.0", "-2", "2.0"], "ans": 1, "exp": "floor rounds DOWN toward -infinity: -2.1 -> -3.0. Pair it with the ceil trap: ceil(-2.1) = -2.0."}, {"ch": 4, "kind": "Concept", "q": "pow(2, 10) returns what, and storing into an int does what?", "code": "int x = pow(2, 10);", "opts": ["int 1024 directly", "double 1024.0, truncated to int 1024", "double 1024.0, rounded", "Compile error"], "ans": 1, "exp": "<cmath> functions return double, so pow(2,10) = 1024.0; stored into int it truncates. Watch cases like 63.99999 -> 63."}, {"ch": 4, "kind": "Trace", "q": "What is the exact output (use _ for space)?", "code": "cout << setw(5) << 42 << 7;", "opts": ["___427  (3 spaces, 42, 7)", "____42_7", "42___7", "___42___7"], "ans": 0, "exp": "setw(5) right-justifies 42 in 5 columns -> '___42'. Then 7 prints immediately with NO width (setw is transient). Result: '___427'."}, {"ch": 4, "kind": "Concept", "q": "Which manipulator is TRANSIENT (affects only the next item)?", "opts": ["fixed", "setprecision", "setw", "left"], "ans": 2, "exp": "setw applies only to the immediately following item. setprecision, fixed, showpoint, left, right are all PERSISTENT until changed. (All manipulators persist except setw.)"}, {"ch": 4, "kind": "Trace", "q": "What prints (no 'fixed' set)?", "code": "cout << setprecision(3) << 12.34567;", "opts": ["12.346", "12.3", "12.345", "12"], "ans": 1, "exp": "Without 'fixed', setprecision is TOTAL significant digits: 3 sig-figs of 12.34567 -> 12.3."}, {"ch": 4, "kind": "Trace", "q": "What prints?", "code": "cout << fixed << setprecision(2) << 12.34567;", "opts": ["12.3", "12.35", "12.34", "12.346"], "ans": 1, "exp": "After 'fixed', setprecision(n) means n digits AFTER the decimal point, with rounding: 12.34567 -> 12.35."}, {"ch": 4, "kind": "Trace", "q": "What prints?", "code": "cout << showpoint << setprecision(5) << 1.0;", "opts": ["1", "1.0", "1.0000", "1.00000"], "ans": 2, "exp": "showpoint forces the decimal point and trailing zeros; setprecision(5) = 5 significant digits -> 1.0000."}, {"ch": 4, "kind": "Concept", "q": "cin >> city cannot read \"New York\". Why, and the fix?", "opts": ["cin can't read strings; use char arrays", "cin >> stops at the first whitespace; use getline(cin, city)", "You need <sstream>", "Strings can't hold spaces"], "ans": 1, "exp": "cin >> reads up to the first whitespace, grabbing only 'New'. getline(cin, city) reads the whole line including spaces."}, {"ch": 4, "kind": "Concept", "q": "After cin >> age; the next getline(cin, city) returns empty. Best fix?", "code": "cin >> age;\ngetline(cin, city);  // city == \"\"", "opts": ["Use cin >> city", "Call cin.ignore() between them to discard the leftover '\\n'", "Declare city first", "Print endl after age"], "ans": 1, "exp": "cin >> leaves the trailing newline in the buffer; getline immediately eats that empty line. Put cin.ignore() between the >> and the getline."}, {"ch": 4, "kind": "Recall", "q": "The starting ASCII codes for '0', 'A', and 'a' are:", "opts": ["30, 41, 61", "48, 65, 97", "49, 64, 96", "48, 97, 65"], "ans": 1, "exp": "The three anchors: '0' = 48, 'A' = 65, 'a' = 97. Everything else follows (lower = upper + 32)."}, {"ch": 5, "kind": "Trace", "q": "What is the output? (CP 5.5)", "code": "int x = 80000000;\nwhile (x > 0)\n    x++;\ncout << \"x is \" << x;", "opts": ["Runs forever", "x is 2147483647", "x is -2147483648 (overflow ends the loop)", "x is 80000000"], "ans": 2, "exp": "Looks infinite but isn't: x grows past INT_MAX and overflows to -2147483648, which fails x>0, so the loop ends. A logic bug disguised as an infinite loop."}, {"ch": 5, "kind": "Trace", "q": "What numbers print? (CP 5.3c)", "code": "int i = 1;\nwhile (i < 10)\n    if (i++ % 2 == 0)\n        cout << i << ' ';", "opts": ["2 4 6 8", "1 3 5 7 9", "3 5 7 9", "infinite loop"], "ans": 2, "exp": "i++ yields the OLD i for the test then increments. When old i is even (2,4,6,8), the cout fires -- but by then i is already 3,5,7,9. Output: 3 5 7 9."}, {"ch": 5, "kind": "Trace", "q": "What is s?", "code": "int s = 0;\nfor (int i = 1; i <= 5; i++) {\n    if (i == 3) continue;\n    s += i;\n}", "opts": ["15", "12", "10", "9"], "ans": 1, "exp": "continue skips only i==3: s = 1+2+4+5 = 12. (continue ends the current iteration, not the loop.)"}, {"ch": 5, "kind": "Trace", "q": "What is s?", "code": "int s = 0;\nfor (int i = 1; i <= 5; i++) {\n    if (i == 3) break;\n    s += i;\n}", "opts": ["3", "6", "12", "15"], "ans": 0, "exp": "break leaves the loop entirely at i==3: only 1+2 = 3 was added."}, {"ch": 5, "kind": "Trace", "q": "Exact output?", "code": "for (int i = 0; i < 3; i++)\n    for (int j = 0; j < 2; j++)\n        cout << i << j << ' ';", "opts": ["00 01 10 11 20 21", "00 10 20 01 11 21", "01 23 45", "00 11 22"], "ans": 0, "exp": "For each outer i (0,1,2) the inner loop runs fully (j=0,1). So: 00 01 10 11 20 21. Total bodies = 3*2 = 6."}, {"ch": 5, "kind": "Concept", "q": "To run a body exactly n times with i starting at 0, the condition is:", "opts": ["i <= n  (n times)", "i < n  (n times)", "i <= n  (n+1 times)", "i < n  (n-1 times)"], "ans": 2, "exp": "for(i=0; i<n; i++) runs exactly n times (i: 0..n-1). i<=n runs n+1 times -- the classic off-by-one."}, {"ch": 5, "kind": "Concept", "q": "Why can this while loop spin forever?", "code": "int i = 0;\nwhile (i < 5) {\n    if (i == 2) continue;\n    cout << i;\n    i++;\n}", "opts": ["i is never initialized", "When i==2, continue jumps back to the condition, skipping i++, so i sticks at 2", "The condition should be i <= 5", "cout blocks the loop"], "ans": 1, "exp": "In a while, continue jumps straight to the condition. At i==2 it skips the i++ below it, so i stays 2 forever. (In a for-loop, continue still runs the update -- different.)"}, {"ch": 5, "kind": "Trace", "q": "Exact output?", "code": "int i = 10;\ndo {\n    cout << i << ' ';\n    i++;\n} while (i < 5);", "opts": ["(nothing)", "10", "10 11 12 13 14", "infinite"], "ans": 1, "exp": "A do-while always runs the body at least once BEFORE checking. It prints 10, then 11<5 is false, so it stops. Output: '10 '."}, {"ch": 5, "kind": "Concept", "q": "What's wrong here? (CP 5.9 style)", "code": "int total = 0, num = 0;\ndo {\n    int num;\n    cin >> num;\n    total += num;\n} while (num != 0);", "opts": ["Nothing", "Inner 'int num' shadows the outer; while() tests the OUTER num (still 0), so it loops once", "do-while can't read input", "total should be double"], "ans": 1, "exp": "The inner 'int num' is a separate variable scoped to the body. The while() condition sees the OUTER num (still 0), so the loop always exits after one pass. Remove the inner declaration."}, {"ch": 5, "kind": "Concept", "q": "Why is  while (!input.eof()) { input >> x; sum += x; }  wrong?", "opts": ["eof() doesn't exist", "eof() is set only AFTER a read fails, so the last failed read leaves x unchanged and it's added twice", "You must close the file first", "sum overflows"], "ans": 1, "exp": "The eof flag turns on only after a read attempt FAILS, not in advance. So the final loop reads nothing, x keeps its old value, and that value is added again. Use while (input >> x)."}, {"ch": 5, "kind": "Recall", "q": "Which loop REQUIRES a trailing semicolon after its condition?", "opts": ["while", "for", "do-while", "None"], "ans": 2, "exp": "do { ... } while (cond);  must end with a semicolon. A ';' after a plain while/for header instead creates an empty-body bug."}, {"ch": 5, "kind": "Concept", "q": "Summing 0.01+0.02+...+1.0 with  for(double i=0.01;i<=1.0;i+=0.01)  gives 49.5 not 50.5. Cause/fix?", "opts": ["Off by one by design", "Floating drift makes i overshoot 1.0, dropping the last term; drive the loop with an int counter", "Use <= 1.01", "double can't hold 0.01"], "ans": 1, "exp": "Repeated += 0.01 accumulates rounding error; i ends slightly above 1.0 so the final term isn't added. Use an INTEGER counter and update the double inside the body."}, {"ch": 5, "kind": "Concept", "q": "For GCD, why is the loop bound  k <= n1/2 && k <= n2/2  wrong?", "opts": ["It's correct and faster", "A divisor can equal the smaller number: GCD(4,2)=2 but n2/2=1 excludes k=2", "n1/2 is floating point", "k must start at 1"], "ans": 1, "exp": "The GCD can be one of the numbers themselves. GCD(4,2)=2, but n2/2 = 1 stops before k=2. Correct bound: k <= n1 && k <= n2 (i.e. k <= min)."}, {"ch": 5, "kind": "Trace", "q": "Input: 2 3 4 5 0. Output? (CP 5.4)", "code": "int number, max;\ncin >> number;\nmax = number;\nwhile (number != 0) {\n    cin >> number;\n    if (number > max) max = number;\n}\ncout << \"max is \" << max << \", number is \" << number;", "opts": ["max is 5, number is 0", "max is 5, number is 5", "max is 4, number is 0", "max is 0, number is 0"], "ans": 0, "exp": "First read: number=2, max=2. Then 3,4,5 push max to 5; reading 0 makes the condition false next check. Final: max is 5, number is 0."}, {"ch": 5, "kind": "Concept", "q": "Inside a nested loop, a break statement:", "opts": ["Exits all enclosing loops", "Exits only the innermost loop it's in", "Acts like continue", "Is a compile error when nested"], "ans": 1, "exp": "break (and continue) affect only the INNERMOST enclosing loop. The outer loop keeps going. To leave everything you'd need a flag or restructuring."}, {"ch": 5, "kind": "Trace", "q": "How many times does the cout run, and what prints?", "code": "for (int i = 0; i < 3; i++);\n{\n    cout << \"hi\";\n}", "opts": ["3 times: hihihi", "Once: hi (';' ended the loop; block runs after)", "Never", "Compile error"], "ans": 1, "exp": "The ';' after for() makes the loop body EMPTY (it just counts i to 3). The { cout } block is a separate scope that runs once afterward. Output: 'hi'."}, {"ch": 5, "kind": "Trace", "q": "Exact output?", "code": "int i = 0;\nwhile (i < 5) {\n    cout << i;\n    i += 2;\n}", "opts": ["01234", "024", "0246", "12345"], "ans": 1, "exp": "i goes 0 (print), 2 (print), 4 (print), then 6 which fails i<5. Output: 024."}, {"ch": 5, "kind": "Trace", "q": "Exact output?", "code": "for (int i = 5; i > 0; i--)\n    cout << i;", "opts": ["12345", "54321", "5432", "01234"], "ans": 1, "exp": "i counts down 5,4,3,2,1, stopping when i>0 fails (i=0). Output: 54321."}, {"ch": 5, "kind": "Recall", "q": "A do-while loop is classified as a:", "opts": ["Pretest loop (condition checked before body)", "Posttest loop (condition checked after body)", "Infinite loop", "Counter-controlled loop only"], "ans": 1, "exp": "do-while is a POSTTEST loop: the body runs, THEN the condition is checked, so the body always executes at least once. while/for are pretest."}, {"ch": 5, "kind": "Concept", "q": "for(;;) with empty condition is equivalent to:", "opts": ["A loop that never runs", "while(false)", "An infinite loop, like while(true)", "A compile error"], "ans": 2, "exp": "An omitted loop-continuation-condition is implicitly true, so for(;;) is an infinite loop equivalent to while(true)."}, {"ch": 6, "kind": "Trace", "q": "What is the final output? (pass-by-value)", "code": "void increment(int n) { n++; }\nint main() {\n    int x = 1;\n    increment(x);\n    cout << x;\n}", "opts": ["2", "1", "0", "garbage"], "ans": 1, "exp": "n is a COPY in increment's own stack frame. n++ changes the copy; the caller's x is untouched. Output: 1. This is exactly why a pass-by-value swap can't work."}, {"ch": 6, "kind": "Trace", "q": "What prints? (pass-by-reference)", "code": "void f(int& n) { n++; }\nint main() {\n    int x = 1;\n    f(x);\n    cout << x;\n}", "opts": ["1", "2", "0", "Compile error"], "ans": 1, "exp": "int& makes n an ALIAS for the caller's x -- same memory. n++ changes x to 2. Reference parameters reach back into the caller."}, {"ch": 6, "kind": "Trace", "q": "Exact output? (CP 6.20 -- static local)", "code": "int j = 40;\nvoid p() {\n    int i = 5;\n    static int j = 5;\n    i++; j++;\n    cout << i << ' ' << j << ' ';\n}\nint main() { p(); p(); }", "opts": ["6 6 6 6", "6 6 6 7", "6 6 7 8", "6 41 6 42"], "ans": 1, "exp": "i is recreated as 5 each call -> always 6. The STATIC j is created once (5), surviving between calls: 5->6 first call, 6->7 second. The global j=40 is hidden inside p by the static j. Output: 6 6 6 7."}, {"ch": 6, "kind": "Recall", "q": "A global variable's default value vs a local variable's:", "opts": ["Both default to 0", "Both are garbage", "Global defaults to 0; local is uninitialized (garbage)", "Global is garbage; local defaults to 0"], "ans": 2, "exp": "Globals are zero-initialized by default. Local (automatic) variables have NO default -- reading one before assigning gives unpredictable garbage."}, {"ch": 6, "kind": "Concept", "q": "What's the bug? (CP 6.24)", "code": "void minMax(double a, double b, double& mn, double& mx) {\n    if (a < b) { double mn = a; double mx = b; }\n    else       { double mn = b; double mx = a; }\n}", "opts": ["Pass-by-value, so caller unchanged", "The inner 'double mn'/'double mx' create NEW locals that shadow the reference params -- caller stays garbage", "a < b is wrong", "Needs a return"], "ans": 1, "exp": "The params ARE references (good), but writing 'double mn = a' declares brand-new locals that shadow them. The references are never assigned, so the caller's variables stay garbage. Fix: drop 'double' -> mn = a;"}, {"ch": 6, "kind": "Trace", "q": "What happens? (CP 6.26 -- reference type match)", "code": "void f(double& p) { p += 2; }\nint main() {\n    double x = 10;\n    int y = 10;\n    f(x);\n    f(y);\n}", "opts": ["x=12, y=12", "x=12, y=10", "Compile error: a non-const double& can't bind to an int (y)", "Runtime error"], "ans": 2, "exp": "A non-const double& parameter requires a double argument of the SAME type -- no auto-conversion. f(x) is fine; f(y) with an int is a COMPILE error. The program never runs."}, {"ch": 6, "kind": "Concept", "q": "What's wrong? (CP 6.27)", "code": "void p(int& i) { cout << i; }\nint p(int j)  { cout << j; return 0; }\nint main() { int k = 5; p(k); }", "opts": ["Nothing", "p(k) is ambiguous: both a reference and a value parameter match an int variable equally well", "k must be const", "Missing prototype"], "ans": 1, "exp": "For p(k) where k is an int variable, both void p(int&) and int p(int) match equally -- the compiler can't choose (and you can't overload on return type). Ambiguous call -> compile error."}, {"ch": 6, "kind": "Trace", "q": "Which overload runs for each call? Given  m(double,double)  and  m(int,double) :", "code": "m(4, 5);     // call A\nm(4, 5.4);   // call B\nm(4.5, 5.4); // call C", "opts": ["A: (int,double)  B: (int,double)  C: (double,double)", "A: (double,double)  B: (int,double)  C: (double,double)", "All call (double,double)", "A is ambiguous"], "ans": 0, "exp": "A m(4,5): (int,double) needs one conversion vs two for the other -> picks (int,double). B m(4,5.4): exact (int,double). C m(4.5,5.4): exact (double,double). The compiler picks the most specific match."}, {"ch": 6, "kind": "Concept", "q": "Which declarations are ILLEGAL? (CP 6.15)", "code": "void t1(int x, int y = 0, int z);\nvoid t2(int x = 0, int y = 0, int z);\nvoid t3(int x, int y = 0, int z = 0);\nvoid t4(int x = 0, int y = 0, int z = 0);", "opts": ["t1 and t2", "t3 and t4", "Only t1", "All legal"], "ans": 0, "exp": "Once a parameter has a default, EVERY parameter after it must too (defaults must be trailing). t1: y has a default but z doesn't. t2: same problem. t3 and t4 keep defaults trailing -> legal."}, {"ch": 6, "kind": "Concept", "q": "Can you define two functions with the same name and identical parameter lists but different return types?", "opts": ["Yes, return type distinguishes them", "No -- you cannot overload on return type alone; at least one parameter must differ", "Only if one is void", "Only inside a class"], "ans": 1, "exp": "Overloading is decided by the parameter list (the signature = name + parameters). Return type is NOT part of the signature, so it alone can't distinguish two functions -> redefinition error."}, {"ch": 6, "kind": "Recall", "q": "A function's SIGNATURE consists of:", "opts": ["Return type + name + parameters", "Name + parameter list (return type NOT included)", "Just the name", "Name + return type"], "ans": 1, "exp": "Signature = function name + parameter list. The return type is deliberately excluded, which is why you can't overload on it."}, {"ch": 6, "kind": "Concept", "q": "Does this compile? (CP 6.6)", "code": "void p(double x, double y) {\n    cout << x << y;\n    return x + y;\n}", "opts": ["Yes", "No -- a void function cannot return a value", "Only with a warning", "Yes, x+y is discarded"], "ans": 1, "exp": "p is declared void but executes 'return x + y;'. Returning a value from a void function is illegal -> compile error. A void function may only use bare 'return;' for early exit."}, {"ch": 6, "kind": "Concept", "q": "True or false: a call to a value-returning function cannot stand alone as a statement.", "opts": ["True", "False -- it can stand alone; the returned value is simply ignored", "True, it must be assigned", "Only main is exempt"], "ans": 1, "exp": "A value-returning call CAN be a statement by itself (the result is just discarded) -- uncommon but legal. A void call, by contrast, is always a statement. So the claim is False."}, {"ch": 6, "kind": "Concept", "q": "Why is returning a reference to a local variable dangerous?", "code": "int& getValue() {\n    int x = 42;\n    return x;\n}", "opts": ["It's fine, x is copied", "x is destroyed when the function returns; the caller gets a dangling reference -> undefined behavior", "References can't be returned at all", "It leaks memory"], "ans": 1, "exp": "Local x lives on the function's stack frame, destroyed on return. The returned reference dangles; using it is UB ('works on my machine', then mysterious crashes). Return by value, or pass an out-parameter."}, {"ch": 6, "kind": "Concept", "q": "A non-const reference parameter (int& p) can be bound to:", "opts": ["A literal, e.g. f(5)", "An expression, e.g. f(a + b)", "A variable, e.g. f(x)", "A function return value, e.g. f(g())"], "ans": 2, "exp": "A non-const reference needs addressable storage, so the argument must be a VARIABLE. Literals, expressions, and return values have no address to alias. (Pass-by-value accepts all of them.)"}, {"ch": 6, "kind": "Trace", "q": "Exact output? (CP 6.18)", "code": "const double PI = 3.14159;\ndouble getArea(double r) { return r * r * PI; }\nvoid displayArea(double r) { cout << getArea(r) << endl; }\nint main() {\n    cout << getArea(1) << endl;\n    displayArea(10);\n}", "opts": ["3.14159 / 314.159", "3.14159 / 31.4159", "1 / 100", "6.28 / 62.8"], "ans": 0, "exp": "getArea(1) = 1*1*PI = 3.14159. displayArea(10) prints getArea(10) = 100*PI = 314.159."}, {"ch": 6, "kind": "Recall", "q": "The call stack stores activation records in what order?", "opts": ["FIFO (first in, first out)", "LIFO (last in, first out)", "Sorted by name", "Random"], "ans": 1, "exp": "The call stack is LIFO: the most recently called function's activation record is the first removed when it returns. This is exactly what makes recursion work."}, {"ch": 6, "kind": "Concept", "q": "The inline keyword:", "opts": ["Forces the compiler to expand the function at every call site", "Is only a REQUEST; the compiler may ignore it", "Makes the function run faster guaranteed", "Is required for short functions"], "ans": 1, "exp": "inline only REQUESTS that the compiler paste the body at each call site to avoid call overhead. The compiler may decline (e.g. for long functions). Best for short, frequently-called functions."}, {"ch": 6, "kind": "Recall", "q": "In top-down/bottom-up implementation, a STUB is:", "opts": ["A test program that drives a finished sub-function", "An incomplete placeholder function (empty/trivial body) used while higher-level code is built", "A static local variable", "An inline function"], "ans": 1, "exp": "A STUB is a placeholder with a trivial body, used in top-down implementation so high-level code can be tested before its sub-functions exist. A DRIVER is the opposite -- a test harness for a finished sub-function (bottom-up)."}, {"ch": 6, "kind": "Concept", "q": "What's the error? (CP 6.21)", "code": "void p(int i) {\n    int i = 5;\n    cout << i;\n}", "opts": ["Nothing", "int i = 5; re-declares the parameter i -> redefinition error", "p needs a return", "i must be a reference"], "ans": 1, "exp": "The parameter i is already a local variable of p. Declaring 'int i = 5;' again redefines it in the same scope -> compile error. Fix: drop 'int' to make it an assignment (i = 5;)."}, {"ch": 6, "kind": "Concept", "q": "exit(1) called inside a helper function does what?", "opts": ["Returns from that function only", "Terminates the ENTIRE program immediately", "Throws an exception", "Is the same as return 1;"], "ans": 1, "exp": "exit(int) from <cstdlib> ends the whole program at once, not just the current function. The int is an exit/error code. return only leaves the current function."}, {"ch": 2, "kind": "Recall", "q": "The literal 1.2345E3 represents:", "opts": ["1.23453", "1234.5", "0.0012345", "12345"], "ans": 1, "exp": "E/e is scientific notation: 1.2345 x 10^3 = 1234.5. (Both E and e work.)"}, {"ch": 2, "kind": "Concept", "q": "Which is an INVALID identifier?", "opts": ["_count", "numOfStudents", "2ndValue", "Area"], "ans": 2, "exp": "An identifier must start with a letter or underscore -- never a digit. '2ndValue' is illegal. (Area is valid but distinct from area -- C++ is case-sensitive.)"}, {"ch": 2, "kind": "Concept", "q": "Casting a large range into a small one (e.g. double -> int) is called:", "opts": ["Widening (always safe)", "Narrowing (may lose precision)", "Promotion", "Overflow"], "ans": 1, "exp": "Small->large is widening (safe); large->small is NARROWING and can lose precision. static_cast makes the narrowing explicit and silences the warning."}, {"ch": 2, "kind": "Recall", "q": "Round-off error means:", "opts": ["Integers are stored imprecisely", "Floating-point values are approximations, so e.g. 1000.43 - 1000.0 may not be exactly 0.43", "% gives the wrong remainder", "Casting rounds instead of truncating"], "ans": 1, "exp": "Floating-point has limited digits, so doubles are approximations and arithmetic can drift slightly. Integers, by contrast, are stored exactly."}, {"ch": 3, "kind": "Concept", "q": "A switch case label must be:", "opts": ["Any expression", "An integral constant (not a variable)", "A double", "A string"], "ans": 1, "exp": "case labels must be integral CONSTANT expressions -- you cannot use a variable. The switch expression itself must also be integral."}, {"ch": 3, "kind": "Concept", "q": "Replace  if (isOn == true) ...  with the cleaner:", "opts": ["if (isOn = true)", "if (isOn)", "if (isOn == 1)", "if (!isOn == false)"], "ans": 1, "exp": "if (isOn) is the idiomatic form. '== true' is redundant, and '= true' would be an assignment bug."}, {"ch": 3, "kind": "Recall", "q": "A year is a leap year when it is:", "opts": ["Divisible by 4", "Divisible by 400, OR divisible by 4 but not by 100", "Divisible by 100", "Divisible by 4 and 100"], "ans": 1, "exp": "Leap year: divisible by 400, or (divisible by 4 and not by 100). Combine the conditions carefully with && / ||."}, {"ch": 3, "kind": "Concept", "q": "In a ternary  cond ? X : Y , how many of X and Y are evaluated?", "opts": ["Both, always", "Only the one selected by cond", "Neither until assigned", "Depends on the compiler"], "ans": 1, "exp": "cond is evaluated, then ONLY the matching branch (X or Y) is evaluated and returned -- like an if/else, not like a function that needs all arguments."}, {"ch": 4, "kind": "Concept", "q": "To convert a lowercase letter to uppercase via ASCII, the formula is:", "opts": ["c - 32 (or 'A' + (c - 'a'))", "c + 32", "c - '0'", "'a' + c"], "ans": 0, "exp": "Uppercase is 32 below lowercase: upper = c - 32, equivalently 'A' + (c - 'a'). (Lower = upper + 32.)"}, {"ch": 4, "kind": "Trace", "q": "How many characters does the string literal \"a\\nb\" contain?", "opts": ["4", "3", "2", "5"], "ans": 1, "exp": "An escape sequence is ONE character: 'a', the newline '\\n', and 'b' = 3 characters. The backslash+n is a single char, not two."}, {"ch": 4, "kind": "Trace", "q": "Is 'a' < 'A' true or false?", "opts": ["true", "false", "Compile error", "Depends"], "ans": 1, "exp": "Chars compare by ASCII code: 'a'(97) < 'A'(65) is FALSE, since 97 > 65. Lowercase codes are higher than uppercase."}, {"ch": 4, "kind": "Recall", "q": "The valid index range for a string s is:", "opts": ["1 to s.length()", "0 to s.length()", "0 to s.length() - 1", "0 to s.size() + 1"], "ans": 2, "exp": "0-based with no bounds checking: 0 .. length()-1. Accessing s[s.length()] is a classic out-of-range mistake."}, {"ch": 5, "kind": "Concept", "q": "In a sentinel-controlled loop, if the FIRST input is the sentinel value:", "opts": ["The body runs once then stops", "The body never executes", "It's an infinite loop", "It's a compile error"], "ans": 1, "exp": "The sentinel ends input. If it's entered first (pretest while), the continuation condition is false immediately, so the body runs ZERO times."}, {"ch": 5, "kind": "Concept", "q": "The palindrome check uses two indices low=0, high=len-1 and loops while:", "opts": ["low <= high", "low < high", "low != high", "high > 0"], "ans": 1, "exp": "while (low < high): compare s[low] vs s[high], move inward. When low >= high they've met -- the middle char of an odd-length string needs no check."}, {"ch": 5, "kind": "Recall", "q": "Command-line input/output redirection uses:", "opts": ["< for input, > for output", "> for input, < for output", "<< and >>", "| for both"], "ans": 0, "exp": "prog < in.txt reads input from a file; prog > out.txt writes output to a file. They can be combined."}, {"ch": 6, "kind": "Concept", "q": "For a large object (e.g. string) that the function does NOT modify, the best parameter style is:", "opts": ["Pass-by-value", "Pass-by-reference with const (const string&)", "Pass-by-reference without const", "A global variable"], "ans": 1, "exp": "const reference avoids copying the big object while preventing modification. For small primitives that aren't modified, plain pass-by-value is fine."}, {"ch": 6, "kind": "Concept", "q": "Which function header is ILLEGAL?", "code": "// A:\nint maxv(int num1, int num2);\n// B:\nint maxv(int num1, num2);", "opts": ["A", "B (each parameter must declare its own type)", "Both", "Neither"], "ans": 1, "exp": "Every parameter needs its own type. 'int num1, num2' leaves num2 untyped -> illegal. Must be (int num1, int num2)."}, {"ch": 6, "kind": "Recall", "q": "Pass-by-reference is also described as:", "opts": ["Pass-by-copy", "Pass-by-sharing (caller and callee share the same variable)", "Pass-by-pointer", "Call-by-name"], "ans": 1, "exp": "Pass-by-reference = pass-by-sharing: the parameter is an alias, so caller and callee operate on the same memory."}, {"ch": 6, "kind": "Concept", "q": "Function abstraction means:", "opts": ["Making every function inline", "Separating a function's USE from its implementation -- the caller treats it as a black box", "Using only global variables", "Avoiding parameters"], "ans": 1, "exp": "Abstraction / information hiding: callers rely on the signature, not the internals. You can change the implementation freely as long as the signature stays the same."}, {"ch": 6, "kind": "Recall", "q": "A DRIVER (in bottom-up implementation) is:", "opts": ["A placeholder function with an empty body", "A test program written to exercise a finished sub-function in isolation", "A static local variable", "The main function only"], "ans": 1, "exp": "A DRIVER is a small test harness for a completed sub-function (bottom-up). A STUB is the opposite -- an empty placeholder used so high-level code can run before its parts exist (top-down)."}, {"ch": 2, "kind": "Output", "q": "Type the exact output:", "code": "cout << 7 / 2 * 2;", "answers": ["6"], "exp": "7/2 = 3 (int division), 3*2 = 6. The fraction is gone before the multiply."}, {"ch": 2, "kind": "Output", "q": "Type the exact output:", "code": "cout << static_cast<int>(2.99) + static_cast<int>(2.99);", "answers": ["4"], "exp": "Each cast truncates 2.99 -> 2. 2 + 2 = 4. Truncation, not rounding."}, {"ch": 2, "kind": "Output", "q": "Type the value printed:", "code": "int x = 5;\nx += 3 * 2;\ncout << x;", "answers": ["11"], "exp": "x += 3*2 means x = x + (3*2) = 5 + 6 = 11. The RHS is one unit, evaluated first."}, {"ch": 3, "kind": "Output", "q": "Type the exact output:", "code": "cout << !0 << !5;", "answers": ["10"], "exp": "!0 = 1 (0 is false), !5 = 0 (5 is nonzero = true). Printed back to back: 10."}, {"ch": 3, "kind": "Output", "q": "Type the exact output:", "code": "int x = 2;\nswitch (x) {\n  case 1: cout << \"a\";\n  case 2: cout << \"b\";\n  case 3: cout << \"c\"; break;\n  default: cout << \"d\";\n}", "answers": ["bc"], "exp": "Match case 2 -> print b, FALL THROUGH to case 3 -> print c, then break. Output: bc."}, {"ch": 4, "kind": "Output", "q": "Type the exact output:", "code": "cout << ('z' - 'a');", "answers": ["25"], "exp": "'z'(122) - 'a'(97) = 25, an int. char subtraction is ASCII-code subtraction."}, {"ch": 4, "kind": "Output", "q": "Type the exact output:", "code": "cout << static_cast<char>('A' + 4);", "answers": ["e"], "exp": "'A'(65) + 4 = 69, cast to char = 'E'. (The checker is case-insensitive, but the real answer is the letter E.)"}, {"ch": 4, "kind": "Output", "q": "Type the exact output:", "code": "cout << ('5' - '0') * 2;", "answers": ["10"], "exp": "'5' - '0' converts the digit char to its value 5; 5 * 2 = 10."}, {"ch": 5, "kind": "Output", "q": "Type the exact output:", "code": "for (int i = 5; i > 0; i--)\n    cout << i;", "answers": ["54321"], "exp": "Counts down 5,4,3,2,1 and stops when i>0 fails at i=0."}, {"ch": 5, "kind": "Output", "q": "Type the value printed:", "code": "int n = 1;\nfor (int i = 1; i <= 4; i++)\n    n *= 2;\ncout << n;", "answers": ["16"], "exp": "n doubles 4 times: 2,4,8,16."}, {"ch": 5, "kind": "Output", "q": "Type the exact output (spaces don't matter):", "code": "for (int i = 0; i < 3; i++)\n    for (int j = 0; j < 2; j++)\n        cout << i << j << ' ';", "answers": ["00 01 10 11 20 21", "000110112021"], "exp": "Each outer i runs the inner j fully: 00 01 10 11 20 21. Total bodies = 3*2 = 6."}, {"ch": 6, "kind": "Output", "q": "Type the exact output (spaces don't matter):", "code": "int j = 40;\nvoid p() {\n    int i = 5;\n    static int j = 5;\n    i++; j++;\n    cout << i << ' ' << j << ' ';\n}\nint main() { p(); p(); }", "answers": ["6 6 6 7", "6667"], "exp": "i is recreated (5->6) each call. static j persists: 5->6 first call, 6->7 second. Global j=40 is hidden inside p. Output: 6 6 6 7."}, {"ch": 7, "kind": "Concept", "q": "Which array declaration is INVALID in standard C++?", "code": "int n = 5;\n// A:\nint a[10];\n// B:\nconst int N = 8; int b[N];\n// C:\nint c[n];", "opts": ["A", "B", "C (size must be a const/literal, not a regular variable)", "All valid"], "ans": 2, "exp": "The size declarator must be a constant integer expression (a literal or const int). A plain variable n is not allowed in standard C++ -> C is invalid."}, {"ch": 7, "kind": "Concept", "q": "To copy array a into array b, you:", "code": "int a[5] = {1,2,3,4,5};\nint b[5];\nb = a;   // ?", "opts": ["This works fine", "Must copy element by element in a loop; b = a is illegal", "Need b == a", "Need memcpy only"], "ans": 1, "exp": "You cannot copy arrays with =. The array name decays to an address, so b = a is illegal. Loop and copy each element: for(i...) b[i] = a[i];"}, {"ch": 7, "kind": "Trace", "q": "What is the final array? (CP 7.10)", "code": "int list[] = {1, 2, 3, 4, 5, 6};\nfor (int i = 1; i < 6; i++)\n    list[i] = list[i - 1];", "opts": ["1 2 3 4 5 6", "1 1 1 1 1 1", "6 6 6 6 6 6", "1 1 2 3 4 5"], "ans": 1, "exp": "Each step overwrites list[i] with the (already overwritten) list[i-1]. list[0]=1 propagates rightward: 1 1 1 1 1 1. The earlier write is seen by the next iteration."}, {"ch": 7, "kind": "Trace", "q": "Exact output? (CP 7.12 -- value vs array)", "code": "void m(int x, int y[]) {\n    x = 3;\n    y[0] = 3;\n}\nint main() {\n    int number = 0;\n    int numbers[1] = {0};\n    m(number, numbers);\n    cout << number << ' ' << numbers[0];\n}", "opts": ["3 3", "0 3", "0 0", "3 0"], "ans": 1, "exp": "x is a COPY (pass-by-value) -> number stays 0. y is the array's address (pass-by-sharing) -> numbers[0] becomes 3. Output: 0 3."}, {"ch": 7, "kind": "Trace", "q": "Exact output? (in-place reverse)", "code": "void reverse(int list[], int size) {\n    for (int i = 0; i < size / 2; i++) {\n        int t = list[i];\n        list[i] = list[size-1-i];\n        list[size-1-i] = t;\n    }\n}\n// called on {1,2,3,4,5}, then printed", "opts": ["1 2 3 4 5", "5 4 3 2 1", "1 2 3 2 1", "5 2 3 4 1"], "ans": 1, "exp": "size/2 = 2 swaps: (0,4) and (1,3); index 2 stays put. {1,2,3,4,5} -> 5 4 3 2 1. Stopping at size/2 is essential -- i<size would swap everything twice and undo it."}, {"ch": 7, "kind": "Concept", "q": "Reversing an array in place must loop while i < size/2 because otherwise:", "opts": ["It crashes", "It runs out of bounds", "Every element gets swapped twice, undoing the reversal (array unchanged)", "It's slower"], "ans": 2, "exp": "Going to i<size swaps each pair once on the way in and again on the way back, returning the array to its original order. Stop at the midpoint."}, {"ch": 7, "kind": "Trace", "q": "What does a[5] do here?", "code": "int a[5] = {10, 20, 30, 40, 50};\ncout << a[5];", "opts": ["Prints 50", "Compile error", "Runtime exception (index check)", "Undefined behavior -- reads past the end, no error raised"], "ans": 3, "exp": "Valid indices are 0..4. a[5] is out of bounds; C++ does NO bounds checking, so it reads neighboring memory (garbage) -- undefined behavior, not an error."}, {"ch": 7, "kind": "Trace", "q": "What are the 5 elements?", "code": "int a[5] = {1, 2};", "opts": ["1 2 (only two elements)", "1 2 garbage garbage garbage", "1 2 0 0 0", "Compile error"], "ans": 2, "exp": "Partial initialization: listed elements get their values, the REST are zero-filled. So 1 2 0 0 0. (A fully uninitialized 'int a[5];' would be all garbage.)"}, {"ch": 7, "kind": "Concept", "q": "What is the size of  int a[] = {3, 7, 1, 9}; ?", "opts": ["Unknown until runtime", "4 (compiler infers it from the initializer)", "0", "Compile error -- size required"], "ans": 1, "exp": "With an initializer you may omit the size; the compiler counts the elements -> size 4."}, {"ch": 7, "kind": "Concept", "q": "When you pass an array to a function, the function receives:", "opts": ["A full copy of the array", "The starting address (pass-by-sharing) -- it edits the caller's actual array", "Nothing; arrays can't be passed", "A const copy"], "ans": 1, "exp": "Arrays decay to a pointer to the first element. No copy is made, so changes inside the function affect the caller's array. Use const to forbid modification."}, {"ch": 7, "kind": "Concept", "q": "Inside a function with parameter  int list[] , why must you also pass the size?", "opts": ["Style preference", "The parameter is just an address; sizeof(list) gives the pointer size, not the array length", "Arrays have no length", "To enable bounds checking"], "ans": 1, "exp": "The array decays to a pointer, so the function can't recover the element count -- sizeof gives the pointer's size. You must pass the length as a separate argument."}, {"ch": 7, "kind": "Concept", "q": "How do you make a function 'return' an array?", "opts": ["return arr;", "Return type is int[]", "Pass an empty result array as a parameter and fill it (pass-by-sharing)", "It's impossible to produce array output"], "ans": 2, "exp": "C++ functions can't return arrays directly. Pass a second (empty) array parameter and have the function write into it, e.g. void reverse(const int in[], int out[], int size)."}, {"ch": 7, "kind": "Concept", "q": "Finding the index of the largest element: using >= instead of > does what on ties?", "code": "// for {1, 5, 3, 4, 5, 5}", "opts": ["No difference", "> gives index 1, >= gives index 5 (largest index instead of smallest)", "> gives index 5, >= gives index 1", "Both give index 0"], "ans": 1, "exp": "With strict > you keep the FIRST max (index 1). With >= you keep updating on equal values, ending at the LAST max (index 5). The comparison operator decides first-vs-last on ties."}, {"ch": 7, "kind": "Recall", "q": "A C-string \"abc\" actually stores how many chars, and why?", "opts": ["3 chars", "4 chars: 'a','b','c' plus the null terminator '\\0'", "5 chars", "3 chars plus a length byte"], "ans": 1, "exp": "A C-string is a char array ended by the null terminator '\\0' (code 0). \"abc\" = {'a','b','c','\\0'} = 4 chars. Library functions stop at '\\0'; if it's missing they run off the end."}, {"ch": 7, "kind": "Concept", "q": "Binary search requires what, and runs in what time?", "opts": ["Unsorted array, O(n)", "Sorted array, O(log n)", "Sorted array, O(n)", "Any array, O(1)"], "ans": 1, "exp": "Binary search needs a SORTED array and halves the range each step -> O(log n). Linear search works on any array but is O(n)."}, {"ch": 7, "kind": "Concept", "q": "The binary search loop condition must be:", "opts": ["while (high > low)", "while (high >= low)", "while (low < high)", "while (mid != key)"], "ans": 1, "exp": "It must be high >= low. With strict >, a single-element range (low == high) never enters the loop and a match is missed."}, {"ch": 7, "kind": "Recall", "q": "When binary search fails, returning -low - 1 (instead of -low) is because:", "opts": ["It's arbitrary", "If the key belongs at index 0, low=0 and -0 == 0 would falsely signal 'found at index 0'", "low is always negative", "-low overflows"], "ans": 1, "exp": "-low - 1 encodes both 'not found' and the insertion point. Plain -low fails when low=0, since -0 is 0 -- indistinguishable from a real hit at index 0."}, {"ch": 7, "kind": "Trace", "q": "What is high after this, on an EMPTY string? (size_t trap)", "code": "string s = \"\";\nsize_t high = s.length() - 1;", "opts": ["-1", "0", "A huge positive number (size_t is unsigned, so 0 - 1 wraps)", "Compile error"], "ans": 2, "exp": "length() returns size_t (UNSIGNED). 0 - 1 wraps to SIZE_MAX, a huge value -- not -1. A loop using it runs billions of times. Cast to int or check emptiness first."}, {"ch": 8, "kind": "Concept", "q": "To access row 2, column 1 of a 2D array, you write:", "opts": ["matrix[2, 1]", "matrix[2][1]", "matrix(2)(1)", "matrix[2; 1]"], "ans": 1, "exp": "Each subscript needs its OWN brackets: matrix[2][1]. matrix[2, 1] is a classic error (the comma operator would just evaluate to matrix[1])."}, {"ch": 8, "kind": "Trace", "q": "In  int m[3][4] , at what flat (row-major) offset is m[2][1]?", "opts": ["7", "9", "6", "21"], "ans": 1, "exp": "Row-major offset = i * COLS + j = 2 * 4 + 1 = 9. The array is stored row by row in one contiguous block."}, {"ch": 8, "kind": "Concept", "q": "When passing a 2D array to a function, you must specify:", "code": "// fill in: void f(int a[ ? ][ ? ], int rows)", "opts": ["Both dimensions always", "The column size (you may omit the first/row dimension)", "The row size (you may omit the column dimension)", "Neither dimension"], "ans": 1, "exp": "The compiler needs the COLUMN count to compute the offset i*COLS+j. So int a[][COLS] is required; the row count can be omitted and passed separately. int a[][] is a syntax error."}, {"ch": 8, "kind": "Concept", "q": "Why is  int f(int a[][], int r, int c)  illegal?", "opts": ["Too many parameters", "Leaving the column brackets empty means the compiler can't compute i*COLS+j", "2D arrays can't be passed", "a must be const"], "ans": 1, "exp": "Without the column size, the row-major offset formula i*COLS+j is undefined, so the compiler rejects the empty second bracket. You must write a[][COLS]."}, {"ch": 8, "kind": "Trace", "q": "What are the values of m[1][2] and m[2][0]?", "code": "int m[3][3] = {\n    {1, 2},\n    {3},\n    {7, 8, 9}\n};", "opts": ["m[1][2]=0, m[2][0]=7", "m[1][2]=3, m[2][0]=7", "both garbage", "Compile error"], "ans": 0, "exp": "Nested-brace init zero-fills missing entries per row. Row 1 = {3,0,0} so m[1][2]=0. Row 2 = {7,8,9} so m[2][0]=7."}, {"ch": 8, "kind": "Concept", "q": "To sum a 2D array column-by-column, you should:", "opts": ["Make the row index the outer loop", "Make the column index the outer loop and the row index the inner loop", "Use a single loop", "It's impossible without copying"], "ans": 1, "exp": "For per-column totals, put the column index on the OUTER loop and iterate rows on the inner loop, accumulating matrix[row][column]."}, {"ch": 8, "kind": "Trace", "q": "How many times does the innermost body run?", "code": "int a[4][6];\nfor (int i = 0; i < 4; i++)\n    for (int j = 0; j < 6; j++)\n        a[i][j] = 0;", "opts": ["10", "24", "6", "4"], "ans": 1, "exp": "Nested traversal visits every element: ROWS * COLS = 4 * 6 = 24."}, {"ch": 8, "kind": "Recall", "q": "C++ stores 2D arrays in which order?", "opts": ["Column-major (like Fortran/MATLAB)", "Row-major (row by row, contiguous)", "Diagonal order", "Unspecified"], "ans": 1, "exp": "C++ is ROW-major: all of row 0, then row 1, etc., in one contiguous block. Fortran/MATLAB are column-major."}, {"ch": 8, "kind": "Concept", "q": "For large 2D arrays, iterating row-outer/column-inner is faster than the reverse because:", "opts": ["It uses fewer iterations", "It accesses memory sequentially (cache-friendly), matching row-major layout", "The compiler forbids the other order", "It avoids overflow"], "ans": 1, "exp": "Row-major means consecutive columns are adjacent in memory. Row-outer/col-inner walks memory sequentially (cache-friendly); the reverse jumps across rows and thrashes the cache."}, {"ch": 8, "kind": "Recall", "q": "A 3D array for 6 students x 5 exams x 2 parts is declared:", "opts": ["double s[6, 5, 2];", "double s[6][5][2];", "double s[60];", "double s[6][10];"], "ans": 1, "exp": "Each dimension gets its own brackets: double s[6][5][2]; -- an array of arrays of arrays."}, {"ch": 8, "kind": "Trace", "q": "For the multiple-choice grader, what does this count for student i?", "code": "int correct = 0;\nfor (int j = 0; j < Q; j++)\n    if (answers[i][j] == keys[j])\n        correct++;", "opts": ["Total questions", "How many of student i's answers match the 1D key array", "The student's row index", "Always Q"], "ans": 1, "exp": "It compares row i of the 2D answers against the 1D key column by column, counting matches -- the student's score."}, {"ch": 9, "kind": "Concept", "q": "A class and an object relate how?", "opts": ["They're the same thing", "A class is a blueprint/type; an object is a concrete instance of it", "An object is a blueprint for classes", "A class is one instance of an object"], "ans": 1, "exp": "A class is the blueprint (a new type) describing data fields + functions. An object is one concrete instance with its own copy of the data. 'Object' and 'instance' are interchangeable."}, {"ch": 9, "kind": "Concept", "q": "If you write a class with no access specifier, its members are:", "code": "class C { int x; void f(); };", "opts": ["public by default", "private by default", "protected by default", "A compile error"], "ans": 1, "exp": "In a C++ class, members are PRIVATE by default if no 'public:' (or 'protected:') label is given. (A struct defaults to public.)"}, {"ch": 9, "kind": "Concept", "q": "Which is NOT one of the three peculiarities of a constructor?", "opts": ["It has the exact same name as the class", "It has no return type, not even void", "It is invoked automatically when an object is created", "It must return the new object"], "ans": 3, "exp": "Constructors: (1) same name as the class, (2) NO return type (not even void), (3) auto-invoked on object creation. They don't 'return' anything."}, {"ch": 9, "kind": "Concept", "q": "What happens if you write  void Circle()  inside class Circle?", "opts": ["It's a valid constructor", "It becomes an ordinary member function named Circle, NOT a constructor (a logic-error trap)", "Compile error: duplicate name", "It's the destructor"], "ans": 1, "exp": "A constructor must have NO return type. Adding void turns it into a regular function that happens to share the class name -- it won't run on construction. A nasty silent logic error."}, {"ch": 9, "kind": "Concept", "q": "C++ provides a free no-arg default constructor only when:", "opts": ["Always", "Never", "The class declares NO constructors at all (define any constructor and the free one disappears)", "Only for empty classes"], "ans": 2, "exp": "The implicit default constructor exists only if you declare zero constructors. Define even one (e.g. a parameterized one) and the free default vanishes -- source of 'no matching constructor' errors."}, {"ch": 9, "kind": "Concept", "q": "To create an object using the no-arg constructor, the correct syntax is:", "code": "// A:\nCircle c1;\n// B:\nCircle c1();", "opts": ["A", "B", "Both work", "Neither"], "ans": 0, "exp": "Circle c1; calls the no-arg constructor. Circle c1(); is parsed as a FUNCTION PROTOTYPE returning Circle -- the most-vexing-parse trap, not an object."}, {"ch": 9, "kind": "Concept", "q": "Which members can ONLY be initialized via the constructor's initializer list (not assigned in the body)?", "opts": ["int and double members", "const members and reference members", "static members", "private members"], "ans": 1, "exp": "const members can't be assigned after creation, and reference members must be bound at construction, so both REQUIRE the initializer list. Ordinary members can use either."}, {"ch": 9, "kind": "Concept", "q": "In  Range(int h) : high(h), low(high) { }  with fields declared  int low; int high;  -- what's the trap?", "code": "class Range {\n    int low;    // declared first\n    int high;   // declared second\npublic:\n    Range(int h) : high(h), low(high) { }\n};", "opts": ["Nothing, low gets h", "Members init in DECLARATION order (low first), so low uses an uninitialized high -> UB", "high(h) runs first because it's listed first", "Compile error"], "ans": 1, "exp": "Initialization follows DECLARATION order, not the init-list order. low is declared first, so it's initialized first using 'high' which is still garbage -> undefined behavior. Write the list in declaration order."}, {"ch": 9, "kind": "Concept", "q": "The :: in  double Circle::getArea() { ... }  (in the .cpp) does what?", "opts": ["Calls the function", "Tells the compiler this function belongs to class Circle (scope resolution)", "Marks it const", "Makes it private"], "ans": 1, "exp": "The binary scope resolution operator :: ties the externally-defined function body to its class. Without Circle::, the compiler treats getArea as a free function."}, {"ch": 9, "kind": "Concept", "q": "A class definition in a header file must end with:", "opts": ["A blank line", "A semicolon after the closing brace ( }; )", "return 0;", "Nothing special"], "ans": 1, "exp": "A class definition ends with }; -- the semicolon is required. Omitting it is a classic syntax error that produces confusing messages."}, {"ch": 9, "kind": "Concept", "q": "Inclusion guards (#ifndef / #define / #endif) prevent:", "opts": ["Runtime crashes", "A header being included multiple times -> 'multiple definition' compile errors", "Slow compilation only", "Private access violations"], "ans": 1, "exp": "They stop a header's contents from being pasted more than once in a translation unit, which would otherwise cause multiple-definition errors."}, {"ch": 9, "kind": "Concept", "q": "Inside a member function, the 'this' pointer refers to:", "opts": ["The class itself", "The object the function was called on", "The base class", "A copy of the object"], "ans": 1, "exp": "'this' points to the specific object that invoked the function, so this->radius and radius both mean that object's member. It's how shared code knows whose data to touch."}, {"ch": 9, "kind": "Concept", "q": "sizeof(myObject) counts:", "opts": ["Data fields + member functions", "Only the data fields (member functions are shared, not stored per object)", "Nothing, objects have no size", "The number of members"], "ans": 1, "exp": "Member functions are shared by all instances, so they take no per-object space. sizeof(object) is the bytes needed for its data fields (plus any padding)."}, {"ch": 9, "kind": "Concept", "q": "A variable hiding trap inside a member function: a local variable with the same name as a data field will:", "code": "class Foo {\npublic:\n    int x;\n    Foo() { x = 10; }\n    void p() { int x = 20; cout << x; }\n};", "opts": ["Print 10 (the data field)", "Print 20 (the local hides the data field)", "Compile error", "Print garbage"], "ans": 1, "exp": "The local x shadows the data field x within p(), so cout << x prints 20. To reach the field you'd use this->x."}, {"ch": 9, "kind": "Recall", "q": "By naming convention, an accessor (getter) for a bool data field 'on' is usually named:", "opts": ["getOn()", "isOn()", "on()", "readOn()"], "ans": 1, "exp": "Accessors retrieve private fields; for bool fields the 'is' prefix is conventional: isOn(). Mutators (setters) modify, e.g. setOn(bool)."}, {"ch": 9, "kind": "Recall", "q": "In UML class notation, + and - mean:", "opts": ["+ private, - public", "+ public, - private", "+ static, - const", "+ add, - remove"], "ans": 1, "exp": "+ marks public visibility, - marks private. Fields are shown as name: type; functions as name(param: type): returnType."}, {"ch": 2, "kind": "Recall", "q": "The range of a signed int is:", "opts": ["[-2^15, 2^15 - 1]", "[-2^31, 2^31 - 1]", "[0, 2^32 - 1]", "[-2^63, 2^63 - 1]"], "ans": 1, "exp": "int is [-2^31, 2^31 - 1] (about +/-2.1 billion). short is [-2^15, 2^15-1]; unsigned int is [0, 2^32-1]. long matches int on typical 32-bit-int systems."}, {"ch": 2, "kind": "Recall", "q": "Among short, int, long, float, double, which needs the LEAST memory?", "opts": ["int", "short (2 bytes)", "float", "They're equal"], "ans": 1, "exp": "short uses 2 bytes (16 bits) on modern machines -- the smallest of these. int/float are typically 4, double 8."}, {"ch": 2, "kind": "Recall", "q": "The range of an unsigned short is:", "opts": ["[-2^15, 2^15 - 1]", "[0, 2^16 - 1]", "[0, 2^15 - 1]", "[-2^16, 2^16 - 1]"], "ans": 1, "exp": "unsigned short is [0, 2^16 - 1]. Dropping the sign bit doubles the positive range but removes negatives."}, {"ch": 2, "kind": "Recall", "q": "Compared to a float, a double is:", "opts": ["Half the size", "Usually twice as big (double precision)", "The same size", "Smaller but more precise"], "ans": 1, "exp": "float is single precision; double is double precision -- usually twice the size, holding more significant digits."}, {"ch": 2, "kind": "Recall", "q": "C++ numeric limit constants are defined in which header?", "opts": ["<climits> only", "<limits>", "<cmath>", "<cstdlib>"], "ans": 1, "exp": "The <limits> header defines nu
