<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#0B1220;--bg2:#0E1726;--panel:#141E33;--panel2:#192541;--line:#26334E;--line2:#33425f;
 --ink:#E7ECF7;--muted:#8A97AD;--faint:#5C6981;--amber:#E7B53D;--good:#4FC08A;--bad:#EB6A4E;
 --blue:#6F9BE8;--purple:#B79BE0;--orange:#E08A5B;--teal:#4FB89A;--green:#4FC08A;
 --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
 --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 70% -10%,rgba(231,181,61,.06),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(79,184,154,.06),transparent 55%),var(--bg);
 color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;min-height:100dvh}
.wrap{max-width:820px;margin:0 auto;padding:0 14px env(safe-area-inset-bottom) 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.term{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 24px 60px -28px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.03)}
.termbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--line)}
.dot{width:11px;height:11px;border-radius:50%}.dot.r{background:#e8654b}.dot.y{background:#e7b53d}.dot.g{background:#4fc08a}
.tt{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:8px}
.body{padding:16px 16px 22px}@media(min-width:560px){.body{padding:20px 22px 26px}}
.prompt{font-family:var(--mono);font-size:13px;color:var(--muted);margin:0 0 8px}
.prompt .u{color:var(--good)}.prompt .p{color:var(--blue)}.prompt .d{color:var(--amber)}
h1{font-family:var(--mono);font-weight:700;font-size:23px;margin:4px 0 2px}@media(min-width:560px){h1{font-size:27px}}
h1 .ac{color:var(--amber)}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.back{display:inline-flex;gap:6px;font-family:var(--mono);font-size:12.5px;color:var(--muted);text-decoration:none;cursor:pointer;margin-bottom:12px}
.back:hover{color:var(--amber)}
.search{display:flex;align-items:center;gap:9px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:2px 0 12px}
.search span{font-family:var(--mono);color:var(--amber);font-size:13px}.search input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:var(--mono);font-size:13px}
.chlabel{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.chlabel::before{content:"";width:14px;height:1px;background:var(--line2)}
.plist{display:flex;flex-direction:column;gap:7px}
.pitem{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;cursor:pointer;transition:border-color .15s,background .15s}
.pitem:hover{border-color:var(--line2);background:linear-gradient(var(--panel),var(--panel2))}
.pnum{font-family:var(--mono);font-size:11px;color:var(--amber);flex:0 0 auto;width:34px}
.ptitle{flex:1 1 auto;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.05em;padding:2px 6px;border-radius:5px;flex:0 0 auto}
.badge.j{background:rgba(79,184,154,.14);color:var(--teal);border:1px solid rgba(79,184,154,.3)}
.badge.p{background:rgba(140,150,170,.1);color:var(--faint);border:1px solid var(--line2)}
.pgo{color:var(--faint);font-family:var(--mono)}
/* problem view */
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--muted)}
.statement{font-size:14.5px;color:var(--ink);margin:10px 0 14px;line-height:1.6}
.fmt{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 14px}
@media(min-width:560px){.fmt{grid-template-columns:1fr 1fr}}
.fmtbox{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.fmtbox .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.fmtbox .v{font-size:13px;color:var(--muted)}
.io{display:grid;grid-template-columns:1fr;gap:8px;margin:0 0 8px}
@media(min-width:560px){.io{grid-template-columns:1fr 1fr}}
.iobox .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
pre{font-family:var(--mono);font-size:12.5px;background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;white-space:pre-wrap;word-break:break-word;color:var(--ink);overflow-x:auto}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
.editor{width:100%;min-height:230px;font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--ink);background:#0a0f1c;border:1px solid var(--line);border-radius:9px;padding:12px;resize:vertical;outline:none;tab-size:4}
.editor:focus{border-color:var(--line2)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{font-family:var(--mono);font-size:13px;padding:9px 15px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--amber)}
.btn.primary{background:var(--amber);color:#0d1322;border-color:var(--amber);font-weight:700}
.btn.ghost{color:var(--muted)}
.verdict{border-radius:9px;padding:13px 14px;margin:12px 0;border:1px solid var(--line);font-family:var(--mono);font-size:13px}
.verdict.ok{border-color:rgba(79,184,154,.5);background:rgba(79,184,154,.08)}
.verdict.no{border-color:rgba(235,106,78,.5);background:rgba(235,106,78,.08)}
.verdict h3{margin:0 0 8px;font-size:14px}.verdict.ok h3{color:var(--good)}.verdict.no h3{color:var(--bad)}
.case{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.case:first-of-type{border-top:none}
.case .res{font-weight:700;flex:0 0 auto}.case .res.pass{color:var(--good)}.case .res.fail{color:var(--bad)}
.case .meta{color:var(--faint);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diff{margin-top:8px}.diff .d{font-size:12px;color:var(--muted)}
.hint{color:var(--faint);font-size:12px;line-height:1.6;margin:8px 0}
.hint code{font-family:var(--mono);color:var(--amber)}
details{margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
summary{cursor:pointer;padding:9px 12px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
summary:hover{color:var(--amber)}
details pre{border:none;border-top:1px solid var(--line);border-radius:0}
.sel{font-family:var(--mono);font-size:12px;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.foot{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;margin:18px 0 4px}
.note{color:var(--faint);font-size:12px;border-top:1px solid var(--line);padding-top:12px;margin-top:18px;line-height:1.6}
.note b{color:var(--muted)}
</style>
</head>

<script>
const PROBLEMS = [{"num": "1.4", "ch": 1, "title": "Print a Table", "statement": "Print a table of the numbers 1 to 4 alongside their squares and cubes, separated by tabs, with a header row a, a^2, a^3.", "inFmt": "No input.", "outFmt": "Rows of: a, a squared, a cubed (tab-separated), starting with the header.", "tests": [{"in": "", "out": "a\ta^2\ta^3\n1\t1\t1\n2\t4\t8\n3\t9\t27\n4\t16\t64\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\n#include <string> \n#include <cmath>\n#include <climits>\n#include <fstream>\nusing namespace std;\n\nint main() {\n    cout << \"a\\ta^2\\ta^3\\n\";\n    cout << \"1\\t1\\t1\\n\";\n    cout << \"2\\t4\\t8\\n\";\n    cout << \"3\\t9\\t27\\n\";\n    cout << \"4\\t16\\t64\\n\";\n    return 0;\n}"}, {"num": "1.7", "ch": 1, "title": "Approximate pi", "statement": "Approximate pi using the series 4*(1 - 1/3 + 1/5 - 1/7 + 1/9 - 1/11).", "inFmt": "No input.", "outFmt": "The approximated value of pi.", "tests": [{"in": "", "out": "2.97605\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << 4 * (1.0 - 1.0/3 + 1.0/5 - 1.0/7 + 1.0/9 - 1.0/11) << endl;\n    return 0;\n}"}, {"num": "1.11", "ch": 1, "title": "Population Projection", "statement": "Population starts at 312,032,486 with a net change of about 2,780,096 per year. Print the projected population for each of the next 5 years.", "inFmt": "No input.", "outFmt": "Five lines, one projected population per year.", "tests": [{"in": "", "out": "314812582\n317592678\n320372774\n323152870\n325932966\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int current = 312032486;\n    int change = 2780096;\n    cout << current + change << endl;\n    cout << current + 2*change << endl;\n    cout << current + 3*change << endl;\n    cout << current + 4*change << endl;\n    cout << current + 5*change << endl;\n    return 0;\n}"}, {"num": "2.6", "ch": 2, "title": "Sum the Digits in an Integer", "statement": "Read an integer (assume at most five digits) and print the sum of its digits. e.g. 12345 -> 15.", "inFmt": "One integer n.", "outFmt": "The sum of the digits of n.", "tests": [{"in": "12345", "out": "15\n"}, {"in": "905", "out": "14\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nvoid solve() {\n    int n; \n    cin >> n;\n    int sum = 0;\n    while (n > 0) {\n        sum += n % 10;\n        n /= 10;\n    }\n    cout << sum << \"\\n\";\n}"}, {"num": "2.8", "ch": 2, "title": "Current Time with Offset", "statement": "Read an offset in hours from GMT and print the current time at that offset.", "inFmt": "One integer (hour offset from GMT).", "outFmt": "The current local time at the offset. (Depends on the clock — practice only.)", "tests": [{"in": "5", "out": "11:59:54\n"}], "judge": false, "nondet": true, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\n#include <ctime>\nusing namespace std;\n\nvoid solve() {\n    int current = time(0);\n    int total = current % (24 * 60 * 60);\n    int hour = total / 3600; \n    total -= 3600 * hour; \n    int minute = total / 60;\n    total -= 60 * minute;\n    int second = total;\n    int offset; \n    cin >> offset;\n    hour += offset; \n    hour = (hour + 48) % 24;\n    cout << (hour <= 9 ? \"0\" : \"\") << hour << \":\"\n         << (minute <= 9 ? \"0\" : \"\") << minute << \":\"\n         << (second <= 9 ? \"0\" : \"\") << second << \"\\n\";\n}"}, {"num": "2.13", "ch": 2, "title": "Financial Application: Compound Value", "statement": "Read a monthly deposit amount and print the account value after 6 months at 1.00417 monthly growth.", "inFmt": "One number (monthly deposit).", "outFmt": "The account value after six months, followed by a $ sign.", "tests": [{"in": "100", "out": "608.818$\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nvoid solve() {\n    double sum = 0.0;\n    int x; \n    cin >> x;\n    for (int i = 1; i <= 6; i++) {\n        sum += x;\n        sum *= 1.00417; \n    }\n    cout << sum << \"$\\n\";\n}"}, {"num": "2.24", "ch": 2, "title": "Monetary Units Precision Fix", "statement": "Read a total amount in cents and break it into dollars, quarters, dimes, nickels, and pennies (precision-safe).", "inFmt": "One integer (total cents).", "outFmt": "The monetary breakdown.", "tests": [{"in": "1156", "out": "Dollars: 11\nCents: 56\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nvoid solve() {\n    int totalCents; \n    cin >> totalCents; \n\n    int dollars = totalCents / 100; \n    int cents = totalCents % 100;   \n\n    cout << \"Dollars: \" << dollars << \"\\n\";\n    cout << \"Cents: \" << cents << \"\\n\";\n}"}, {"num": "3.8", "ch": 3, "title": "Financial Application (Monetary Breakdown)", "statement": "Read an integer amount of money and split it into the fewest dollars, quarters, dimes, nickels, and pennies.", "inFmt": "One integer (amount).", "outFmt": "The breakdown into coins/notes.", "tests": [{"in": "1156", "out": "11 dollars\n2 quarters\n1 nickel\n1 penny\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nvoid solve() {\n    int n; \n    cin >> n;\n    \n    int dollars = n / 100;\n    n -= 100 * dollars;\n    \n    int quart = n / 25;\n    n -= 25 * quart;\n    \n    int dime = n / 10;\n    n -= 10 * dime;\n    \n    int nick = n / 5;\n    n -= 5 * nick;\n    \n    if(dollars) cout << dollars << ((dollars == 1) ? \" dollar\\n\" : \" dollars\\n\");\n    if(quart) cout << quart << ((quart == 1) ? \" quarter\\n\" : \" quarters\\n\");\n    if(dime) cout << dime << ((dime == 1) ? \" dime\\n\" : \" dimes\\n\");\n    if(nick) cout << nick << ((nick == 1) ? \" nickel\\n\" : \" nickels\\n\");\n    if(n) cout << n << ((n == 1) ? \" penny\\n\" : \" pennies\\n\");\n}"}, {"num": "3.9", "ch": 3, "title": "Find the Number of Days in a Month", "statement": "Read a month and a year and print how many days are in that month (account for leap years).", "inFmt": "Two integers: month and year.", "outFmt": "The number of days in that month.", "tests": [{"in": "2 2000", "out": "29 days\n"}, {"in": "3 2015", "out": "31 days\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nvoid solve() {\n    int month, year;\n    cin >> month >> year;\n\n    switch (month) {\n        case 4: case 6: case 9: case 11:\n            cout << \"30 days\\n\";\n            break;\n            \n        case 2:\n            if ((year % 400 == 0) || (year % 4 == 0 && year % 100 != 0))\n                cout << \"29 days\\n\";\n            else\n                cout << \"28 days\\n\";\n            break;\n            \n        default:\n            cout << \"31 days\\n\";\n    }\n}"}, {"num": "3.14", "ch": 3, "title": "Game: Lottery", "statement": "Generate a two-digit lottery number, read the user's guess, and award a prize per the matching rules.", "inFmt": "One integer (the guess). A random lottery number is drawn.", "outFmt": "The result. (Uses randomness — practice only.)", "tests": [{"in": "50", "out": "Lottery is 148\n$0\n"}], "judge": false, "nondet": true, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\n#include <cstdlib>\n#include <ctime>\nusing namespace std;\n\nvoid solve() {\n    srand(time(0));\n    int lottery = rand() % 900 + 100; \n    int guess;\n    cin >> guess;\n    \n    int l1 = lottery / 100, l2 = (lottery / 10) % 10, l3 = lottery % 10;\n    int g1 = guess / 100, g2 = (guess / 10) % 10, g3 = guess % 10;\n\n    cout << \"Lottery is \" << lottery << \"\\n\";\n\n    if (guess == lottery) {\n        cout << \"$10,000\\n\";\n    } else if ((g1 == l1 || g1 == l2 || g1 == l3) &&\n               (g2 == l1 || g2 == l2 || g2 == l3) &&\n               (g3 == l1 || g3 == l2 || g3 == l3)) {\n        cout << \"$3,000\\n\";\n    } else if (g1 == l1 || g1 == l2 || g1 == l3 ||\n               g2 == l1 || g2 == l2 || g2 == l3 ||\n               g3 == l1 || g3 == l2 || g3 == l3) {\n        cout << \"$1,000\\n\";\n    } else {\n        cout << \"$0\\n\";\n    }\n}"}, {"num": "3.24", "ch": 3, "title": "Logical Operators (texttt&&", "statement": "Read an integer n and report, using boolalpha, whether it is divisible by both 5 and 6, by 5 or 6, and by 5 or 6 but not both.", "inFmt": "One integer n.", "outFmt": "Three lines of true/false answers.", "tests": [{"in": "10", "out": "Is 10 divisible by 5 and 6? false\nIs 10 divisible by 5 or 6? true\nIs 10 divisible by 5 or 6, but not both? true\n"}, {"in": "12", "out": "Is 12 divisible by 5 and 6? false\nIs 12 divisible by 5 or 6? true\nIs 12 divisible by 5 or 6, but not both? true\n"}, {"in": "30", "out": "Is 30 divisible by 5 and 6? true\nIs 30 divisible by 5 or 6? true\nIs 30 divisible by 5 or 6, but not both? false\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nvoid solve() {\n    int n; \n    cin >> n;\n    \n    cout << boolalpha; \n    \n    cout << \"Is \" << n << \" divisible by 5 and 6? \" \n         << (n % 5 == 0 && n % 6 == 0) << \"\\n\";\n         \n    cout << \"Is \" << n << \" divisible by 5 or 6? \" \n         << (n % 5 == 0 || n % 6 == 0) << \"\\n\";\n         \n    cout << \"Is \" << n << \" divisible by 5 or 6, but not both? \" \n         << ((n % 5 == 0 || n % 6 == 0) && !(n % 5 == 0 && n % 6 == 0)) << \"\\n\";\n}"}, {"num": "4.2", "ch": 4, "title": "Geometry (Great Circle Distance)", "statement": "Read the latitude and longitude (degrees) of two points and print the great-circle distance using earth radius 6378.1 km.", "inFmt": "Four numbers: x1 y1 x2 y2 (lat/long of the two points).", "outFmt": "The great-circle distance in km.", "tests": [{"in": "39.55 -116.25 41.5 87.37", "out": "10703.7\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "double rad(double deg){\n    return deg*(PI/180);\n}\nvoid solve(){  \n    double x1,y1,x2,y2;cin>>x1>>y1>>x2>>y2; \n    double ans=(sin(rad(x1))*sin(rad(x2))+cos(rad(x1))*cos(rad(x2))*cos(rad(y1-y2)));\n    ans=max(-1.0,min(1.0,ans));\n    cout<<6378.1*acos(ans)<<\"\\n\";\n}"}, {"num": "4.11", "ch": 4, "title": "Convert an Uppercase Letter to Lowercase", "statement": "Read an uppercase letter and print its lowercase form (using ASCII arithmetic).", "inFmt": "One uppercase letter.", "outFmt": "The corresponding lowercase letter.", "tests": [{"in": "B", "out": "Enter an uppercase letter: The lowercase letter is b\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace ent": "Read a string and decide whether it is a valid SSN in the exact format DDD-DD-DDDD.", "inFmt": "One token (the candidate SSN).", "outFmt": "YES if valid, otherwise NO.", "tests": [{"in": "232-23-5435", "out": "YES\n"}, {"in": "12-34-5678", "out": "NO\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "void solve(){  \n    string s;cin>>s;\n    if(s.size()!=11){\n        cout<<\"NO\\n\";\n        return;\n    }\n    int cond1=(s[3]=='-' && s[6]=='-');\n    int ans=0LL;\n    for(int i=0;i<=10;i++){\n        if(i!=3 && i!=6){\n            if(isdigit(s[i])){\n                ans++;\n            }\n        }\n    }\n    int cond2=(ans==9);\n    if(cond1 && cond2){\n        cout<<\"YES\\n\"; \n    }else{\n        cout<<\"NO\\n\";\n    }\n}"}, {"num": "5.1", "ch": 5, "title": "Count Positives/Negatives and Average", "statement": "Read integers until 0 is entered; print the count of positives, count of negatives, total, and average.", "inFmt": "Integers separated by spaces, ending with 0.", "outFmt": "Counts, total, and average (no input case handled).", "tests": [{"in": "1 2 -1 3 0", "out": "Enter integers (0 to end): The number of positives is 3\nThe number of negatives is 1\nThe total is 5\nThe average is 1.25\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int number, positives = 0, negatives = 0, count = 0, total = 0;\n    cout << \"Enter integers (0 to end): \";\n    cin >> number;\n    while (number != 0) {\n        if (number > 0) positives++;\n        else negatives++;\n        total += number;\n        count++;\n        cin >> number;\n    }\n    if (count == 0) {\n        cout << \"No numbers are entered except 0\" << endl;\n    } else {\n        cout << \"The () {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int perLine = 0;\n    for (char c = '!'; c <= '~'; c++) {\n        cout << c << ' ';\n        if (++perLine % 10 == 0)   // 10 characters per line\n            cout << endl;\n    }\n    cout << endl;\n    return 0;\n}"}, {"num": "5.18", "ch": 5, "title": "Find the Factors of an Integer", "statement": "Read a positive integer and print all of its factors in increasing order (prime factorization).", "inFmt": "One integer n.", "outFmt": "The factors of n separated by spaces.", "tests": [{"in": "120", "out": "Enter an integer: 2 2 2 3 5 \n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nint main() {\n    int n;\n    cout << \"Enter an integer: \";\n    cin >> n;\n\n    int factor = 2;\n    while (n > 1) {\n        if (n % factor == 0) {     // peel the smallest factor repeatedly\n            cout << factor << \" \";\n            n /= factor;\n        } else {\n            factor++;\n        }\n    }\n    cout << endl;\n    return 0;\n}"}, {"num": "6.8", "ch": 6, "title": "Conversions Between Feet and Meters", "statement": "Using two functions footToMeter and meterToFoot, print conversion tables between feet and meters.", "inFmt": "No input.", "outFmt": "Two side-by-side conversion tables.", "tests": [{"in": "", "out": "Feet    Meters  |  Meters   Feet\n1.000    0.305  |  20.000   65.574\n2.000    0.610  |  25.000   81.967\n3.000    0.915  |  30.000   98.361\n4.000    1.220  |  35.000  114.754\n5.000    1.525  |  40.000  131.148\n6.000    1.830  |  45.000  147.541\n7.000    2.135  |  50.000  163.934\n8.000    2.440  |  55.000  180.328\n9.000    2.745  |  60.000  196.721\n10.000    3.050  |  65.000  213.115\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\n#include <iomanip>\nusing namespace std;\n\ndouble footToMeter(double foot)  { return 0.305 * foot; }\ndouble meterToFoot(double meter) { return meter / 0.305; }\n\nint main() {\n    cout << \"Feet    Meters  |  Meters   Feet\" << endl;\n    cout << fixed << setprecision(3);\n    double foot = 1.0, meter = 20.0;\n    for (int i = 0; i < 10; i++) {\n        cout << setw(4) << foot  << setw(9) << footToMeter(foot)\n             << \"  |  \"\n             << setw(6) << meter << setw(9) << meterToFoot(meter) << endl;\n        foot  += 1.0;\n        meter += 5.0;\n    }\n    return 0;\n}"}, {"num": "6.13", "ch": 6, "title": "Estimate Pi with an Alternating Series", "statement": "Write a function that estimates pi using the alternating series up to i terms, and print estimates for several i.", "inFmt": "No input.", "outFmt": "Pi estimates for increasing numbers of terms.", "tests": [{"in": "", "out": "i       m(i)\n  1      4.0000\n101      3.1515\n201      3.1466\n301      3.1449\n401      3.1441\n501      3.1436\n601      3.1433\n701      3.1430\n801      3.1428\n901      3.1427\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\n#include <iomanip>\nusing namespace std;\n\ndouble m(int i) {\n    double sum = 0;\n    int sign = 1;\n    for (int k = 1; k <= i; k++) {\n        sum += sign * 1.0 / (2 * k - 1);\n        sign = -sign;              // flip instead of pow(-1, k)\n    }\n    return 4 * sum;\n}\n\nint main() {\n    cout << \"i       m(i)\" << endl;\n    cout << fixed << setprecision(4);\n    for (int i = 1; i <= 901; i += 100)\n        cout << setw(3) << i << setw(12) << m(i) << endl;\n    return 0;\n}"}, {"num": "6.14", "ch": 6, "title": "Financial Application: Print a Tax Table", "statement": "Using a computeTax func h": 9, "title": "The StopWatch Class", "statement": "Define a StopWatch class that measures elapsed time; use it to time sorting a large random array.", "inFmt": "No input. (Uses timing/randomness — practice only.)", "outFmt": "The elapsed time. (Varies — practice only.)", "tests": [], "judge": false, "nondet": true, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\n#include <chrono>\n#include <cstdlib>\nusing namespace std;\nusing namespace std::chrono;\n\nlong currentTimeMillis() {\n    return duration_cast<milliseconds>(\n        system_clock::now().time_since_epoch()).count();\n}\n\nclass StopWatch {\nprivate:\n    long startTime;\n    long endTime;\npublic:\n    StopWatch() { startTime = currentTimeMillis(); endTime = startTime; }\n    long getStartTime() const { return startTime; }\n    long getEndTime()   const { return endTime;   }\n    void start() { startTime = currentTimeMillis(); }\n    void stop()  { endTime   = currentTimeMillis(); }\n    long getElapsedTime() const { return endTime - startTime; }\n};\n\nvoid selectionSort(int list[], int size) {\n    for (int i = 0; i < size - 1; i++) {\n        int minIndex = i;\n        for (int j = i + 1; j < size; j++)\n            if (list[j] < list[minIndex]) minIndex = j;\n        int t = list[i]; list[i] = list[minIndex]; list[minIndex] = t;\n    }\n}\n\nint main() {\n    const int SIZE = 100000;\n    int* list = new int[SIZE];\n    for (int i = 0; i < SIZE; i++) list[i] = rand();\n\n    StopWatch watch;          // records start time on construction\n    watch.start();\n    selectionSort(list, SIZE);\n    watch.stop();\n\n    cout << \"Sorting \" << SIZE << \" numbers took \"\n         << watch.getElapsedTime() << \" milliseconds.\" << endl;\n    delete[] list;\n    return 0;\n}"}, {"num": "9.9", "ch": 9, "title": "Algebra: 2x2 LinearEquation Class", "statement": "Define a LinearEquation class for a 2x2 system (Cramer's rule) and solve a system read from input.", "inFmt": "Six numbers: a b c d e f.", "outFmt": "x and y, or a no-solution message.", "tests": [{"in": "1 2 2 3 4 5", "out": "Enter a, b, c, d, e, f: x = -2, y = 3\n"}, {"in": "1 2 2 4 4 8", "out": "Enter a, b, c, d, e, f: The equation has no solution.\n"}], "judge": true, "nondet": false, "template": "#include <iostream>\nusing namespace std;\n\nint main() {\n    // your code here\n\n    return 0;\n}\n", "solution": "#include <iostream>\nusing namespace std;\n\nclass LinearEquation {\nprivate:\n    double a, b, c, d, e, f;\npublic:\n    LinearEquation(double a, double b, double c,\n                   double d, double e, double f) {\n        this->a = a; this->b = b; this->c = c;\n        this->d = d; this->e = e; this->f = f;\n    }\n    double getA() const { return a; }\n    double getB() const { return b; }\n    double getC() const { return c; }\n    double getD() const { return d; }\n    double getE() const { return e; }\n    double getF() const { return f; }\n    bool isSolvable() const { return a * d - b * c != 0; }\n    double getX() const { return (e * d - b * f) / (a * d - b * c); }\n    double getY() const { return (a * f - e * c) / (a * d - b * c); }\n};\n\nint main() {\n    double a, b, c, d, e, f;\n    cout << \"Enter a, b, c, d, e, f: \";\n    cin >> a >> b >> c >> d >> e >> f;\n\n    LinearEquation eq(a, b, c, d, e, f);\n    if (eq.isSolvable())\n        cout << \"x = \" << eq.getX() << \", y = \" << eq.getY() << endl;\n    else\n        cout << \"The equation has no solution.\" << endl;\n    return 0;\n}"}];

function renderProblem(p){
  tt.textContent=p.num+' — cpp_judge'; document.title='Problem '+p.num+' — '+p.title;
  var sample=p.tests&&p.tests[0];
  var saved=store('judge:'+p.num);
  var code=(saved!=null)?saved:p.template;
  var testOpts=(p.tests||[]).map(function(t,i){return '<option value="'+i+'">test '+(i+1)+(t.in?(' · in: '+esc(t.in).slice(0,24)):' · (no input)')+'</option>';}).join('');
  app.innerHTML=
    '<div class="back" id="back">‹ all problems</div>'+
    '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><h1 style="margin:0">'+esc(p.num)+'</h1>'+
      '<span class="tag">Ch '+p.ch+'</span><span class="badge '+(p.judge?'j':'p')+'">'+(p.judge?'AUTO-JUDGED':'PRACTICE ONLY')+'</span></div>'+
    '<p class="sub" style="margin-top:6px;font-size:15px;color:var(--ink)">'+esc(p.title)+'</p>'+
    '<p class="statement">'+esc(p.statement)+'</p>'+
    '<div class="fmt"><div class="fmtbox"><div class="k">Input</div><div class="v">'+esc(p.inFmt)+'</div></div>'+
      '<div class="fmtbox"><div class="k">Output</div><div class="v">'+esc(p.outFmt)+'</div></div></div>'+
    (sample?('<div class="lbl">Sample</div><div class="io"><div class="iobox"><div class="k">Input</div><pre>'+(sample.in?esc(sample.in):'(no input)')+'</pre></div>'+
      '<div class="iobox"><div class="k">Expected output</div><pre>'+esc(sample.out)+'</pre></div></div>'):'')+
    '<div class="lbl">Your code</div>'+
    '<textarea class="editor" id="ed" spellcheck="false">'+esc(code)+'</textarea>'+
    '<div class="btns">'+
      '<button class="btn primary" id="run">▷ Run (browser, beta)</button>'+
      '<button class="btn" id="check">✓ Check my output</button>'+
      '<button class="btn ghost" id="reset">⟲ Reset</button>'+
    '</div>'+
    '<div id="out"></div>'+
    '<details><summary>Compile in Visual Studio &amp; paste your program\u2019s output</summary>'+
      '<div style="padding:12px">'+
      (p.tests&&p.tests.length>1?'<div style="margin-bottom:8px">Which test did you run? <select class="sel" id="tcsel">'+testOpts+'</select></div>':'')+
      '<textarea class="editor" id="paste" style="min-height:120px" placeholder="paste exactly what your program printed…"></textarea>'+
      '<div class="btns"><button class="btn" id="cmp">Compare to expected</button></div>'+
      '<div id="cmpout"></div></div></details>'+
    '<details><summary>Show reference solution</summary><pre>'+esc(p.solution)+'</pre></details>'+
    (p.nondet?'<p class="note">This problem uses the system clock or random numbers, so its output changes every run — there\u2019s no fixed answer to test against. Use it for practice and check your logic against the reference.</p>':'')+
    '<p class="foot">&gt; realmathmodel.github.io</p>';

  document.getElementById('back').addEventListener('click',function(){location.hash='';});
  var ed=document.getElementById('ed'), outd=document.getElementById('out');
  ed.addEventListener('keydown',function(e){if(e.key==='Tab'){e.preventDefault();var s=ed.selectionStart,en=ed.selectionEnd;ed.value=ed.value.slice(0,s)+'    '+ed.value.slice(en);ed.selectionStart=ed.selectionEnd=s+4;}});
  ed.addEventListener('input',function(){store('judge:'+p.num, ed.value);});
  document.getElementById('reset').addEventListener('click',function(){if(confirm('Reset to the starter template?')){ed.value=p.template;store('judge:'+p.num,p.template);}});

  document.getElementById('run').addEventListener('click',function(){
    if(!p.tests||!p.tests.length){outd.innerHTML='<div class="verdict no"><h3>No test cases</h3>This is a practice-only problem — nothing to auto-judge.</div>';return;}
    outd.innerHTML='<div class="verdict"><h3>Running…</h3>loading the in-browser runner (first time needs network)…</div>';
    loadJSCPP().then(function(JSCPP){
      var rows='', allpass=true, ran=0;
      for(var i=0;i<p.tests.length;i++){
        var t=p.tests[i], got, err=null;
        try{ got=runOne(JSCPP, ed.value, t.in?(t.in+'\n'):''); }catch(e){ err=String(e&&e.message||e); }
        if(err){ outd.innerHTML='<div class="verdict no"><h3>Browser runner couldn\u2019t run this</h3>'+
          '<div class="hint">'+esc(err.slice(0,180))+'</div>'+
          '<div class="hint">The in-browser interpreter supports only a subset of C++ (no classes, no <code>static_cast</code>, limited STL). Compile in Visual Studio and use <b>Check my output</b> below — that\u2019s the MSVC-exact path.</div></div>'; return; }
        ran++; var ok=norm(got)===norm(t.out); if(!ok)allpass=false;
        var d=ok?'':firstDiff(norm(t.out),norm(got));
        rows+='<div class="case"><span class="res '+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+'</span>'+
          '<span class="meta">test '+(i+1)+(t.in?(' · in: '+esc(t.in).slice(0,30)):'')+'</span></div>'+
          (ok?'':'<div class="diff"><div class="d">line '+d.line+' — expected <span style="color:var(--good)">'+esc(d.exp==null?'(end)':JSON.stringify(d.exp))+'</span>, got <span style="color:var(--bad)">'+esc(d.got==null?'(end)':JSON.stringify(d.got))+'</span></div></div>');
      }
      outd.innerHTML='<div class="verdict '+(allpass?'ok':'no')+'"><h3>'+(allpass?'✓ Accepted — all '+ran+' tests passed':'✗ Wrong Answer')+'</h3>'+rows+'</div>';
    }).catch(function(){
      outd.innerHTML='<div class="verdict no"><h3>Runner unavailable</h3><div class="hint">Couldn\u2019t load the in-browser runner (you may be offline). Compile in Visual Studio and use <b>Check my output</b>.</div></div>';
    });
  });

  document.getElementById('check').addEventListener('click',function(){
    var det=document.querySelectorAll('details')[0]; det.open=true; det.scrollIntoView({behavior:'smooth',block:'center'});
  });
  var cmp=document.getElementById('cmp');
  if(cmp) cmp.addEventListener('click',function(){
    var sel=document.getElementById('tcsel'); var idx=sel?+sel.value:0;
    var t=p.tests[idx]; var got=document.getElementById('paste').value;
    var ok=norm(got)===norm(t.out);
    var d=ok?null:firstDiff(norm(t.out),norm(got));
    document.getElementById('cmpout').innerHTML='<div class="verdict '+(ok?'ok':'no')+'"><h3>'+(ok?'✓ Correct — matches expected':'✗ Does not match')+'</h3>'+
      (ok?'':'<div class="diff"><div class="d">line '+d.line+' — expected <span style="color:var(--good)">'+esc(d.exp==null?'(end of output)':JSON.stringify(d.exp))+'</span>, got <span style="color:var(--bad)">'+esc(d.got==null?'(end of output)':JSON.stringify(d.got))+'</span></div></div>')+'</div>';
  });
}

function route(){
  var num=decodeURIComponent((location.hash||'').replace(/^#/,''));
  window.scrollTo(0,0);
  if(!num){renderList('');return;}
  var p=PROBLEMS.filter(function(x){return x.num===num;})[0];
  if(!p){renderList('');return;}
  renderProblem(p);
}
window.addEventListener('hashchange',route);
route();
})();
</script>
</body>
</html>
