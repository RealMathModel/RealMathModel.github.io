rg constructor, the correct syntax is:", "code": "// A:\nCircle c1;\n// B:\nCircle c1();", "opts": ["Both work", "B", "Neither", "A"], "ans": 3, "exp": "Circle c1; calls the no-arg constructor. Circle c1(); is parsed as a FUNCTION PROTOTYPE returning Circle -- the most-vexing-parse trap, not an object."}, {"ch": 9, "kind": "Concept", "q": "Which members can ONLY be initialized via the constructor's initializer list (not assigned in the body)?", "opts": ["static members", "private members", "int and double members", "const members and reference members"], "ans": 3, "exp": "const members can't be assigned after creation, and reference members must be bound at construction, so both REQUIRE the initializer list. Ordinary members can use either."}, {"ch": 9, "kind": "Concept", "q": "In  Range(int h) : high(h), low(high) { }  with fields declared  int low; int high;  -- what's the trap?", "code": "class Range {\n    int low;    // declared first\n    int high;   // declared second\npublic:\n    Range(int h) : high(h), low(high) { }\n};", "opts": ["Nothing, low gets h", "Members init in DECLARATION order (low first), so low uses an uninitialized high -> UB", "high(h) runs first because it's listed first", "Compile error"], "ans": 1, "exp": "Initialization follows DECLARATION order, not the init-list order. low is declared first, so it's initialized first using 'high' which is still garbage -> undefined behavior. Write the list in declaration order."}, {"ch": 9, "kind": "Concept", "q": "The :: in  double Circle::getArea() { ... }  (in the .cpp) does what?", "opts": ["Marks it const", "Makes it private", "Calls the function", "Tells the compiler this function belongs to class Circle (scope resolution)"], "ans": 3, "exp": "The binary scope resolution operator :: ties the externally-defined function body to its class. Without Circle::, the compiler treats getArea as a free function."}, {"ch": 9, "kind": "Concept", "q": "A class definition in a header file must end with:", "opts": ["Nothing special", "return 0;", "A blank line", "A semicolon after the closing brace ( }; )"], "ans": 3, "exp": "A class definition ends with }; -- the semicolon is required. Omitting it is a classic syntax error that produces confusing messages."}, {"ch": 9, "kind": "Concept", "q": "Inclusion guards (#ifndef / #define / #endif) prevent:", "opts": ["A header being included multiple times -> 'multiple definition' compile errors", "Runtime crashes", "Slow compilation only", "Private access violations"], "ans": 0, "exp": "They stop a header's contents from being pasted more than once in a translation unit, which would otherwise cause multiple-definition errors."}, {"ch": 9, "kind": "Concept", "q": "Inside a member function, the 'this' pointer refers to:", "opts": ["The class itself", "A copy of the object", "The base class", "The object the function was called on"], "ans": 3, "exp": "'this' points to the specific object that invoked the function, so this->radius and radius both mean that object's member. It's how shared code knows whose data to touch."}, {"ch": 9, "kind": "Concept", "q": "sizeof(myObject) counts:", "opts": ["Data fields + member functions", "Nothing, objects have no size", "The number of members", "Only the data fields (member functions are shared, not stored per object)"], "ans": 3, "exp": "Member functions are shared by all instances, so they take no per-object space. sizeof(object) is the bytes needed for its data fields (plus any padding)."}, {"ch": 9, "kind": "Concept", "q": "A variable hiding trap inside a member function: a local variable with the same name as a data field will:", "code": "class Foo {\npublic:\n    int x;\n    Foo() { x = 10; }\n    void p() { int x = 20; cout << x; }\n};", "opts": ["Print garbage", "Compile error", "Print 10 (the data field)", "Print 20 (the local hides the data field)"], "ans": 3, "exp": "The local x shadows the data field x within p(), so cout << x prints 20. To reach the field you'd use this->x."}, {"ch": 9, "kind": "Recall", "q": "By naming convention, an accessor (getter) for a bool data field 'on' is usually named:", "opts": ["getOn()", "isOn()", "readOn()", "on()"], "ans": 1, "exp": "Accessors retrieve private fields; for bool fields the 'is' prefix is conventional: isOn(). Mutators (setters) modify, e.g. setOn(bool)."}, {"ch": 9, "kind": "Recall", "q": "In UML class notation, + and - mean:", "opts": ["+ private, - public", "+ public, - private", "+ static, - const", "+ add, - remove"], "ans": 1, "exp": "+ marks public visibility, - marks private. Fields are shown as name: type; functions as name(param: type): returnType."}, {"ch": 2, "kind": "Recall", "q": "The range of a signed int is:", "opts": ["[-2^31, 2^31 - 1]", "[-2^63, 2^63 - 1]", "[-2^15, 2^15 - 1]", "[0, 2^32 - 1]"], "ans": 0, "exp": "int is [-2^31, 2^31 - 1] (about +/-2.1 billion). short is [-2^15, 2^15-1]; unsigned int is [0, 2^32-1]. long matches int on typical 32-bit-int systems."}, {"ch": 2, "kind": "Recall", "q": "Among short, int, long, float, double, which needs the LEAST memory?", "opts": ["int", "short (2 bytes)", "float", "They're equal"], "ans": 1, "exp": "short uses 2 bytes (16 bits) on modern machines -- the smallest of these. int/float are typically 4, double 8."}, {"ch": 2, "kind": "Recall", "q": "The range of an unsigned short is:", "opts": ["[0, 2^15 - 1]", "[-2^16, 2^16 - 1]", "[0, 2^16 - 1]", "[-2^15, 2^15 - 1]"], "ans": 2, "exp": "unsigned short is [0, 2^16 - 1]. Dropping the sign bit doubles the positive range but removes negatives."}, {"ch": 2, "kind": "Recall", "q": "Compared to a float, a double is:", "opts": ["Usually twice as big (double precision)", "Smaller but more precise", "The same size", "Half the size"], "ans": 0, "exp": "float is single precision; double is double precision -- usually twice the size, holding more significant digits."}, {"ch": 2, "kind": "Recall", "q": "C++ numeric limit constants are defined in which header?", "opts": ["<limits>", "<cmath>", "<climits> only", "<cstdlib>"], "ans": 0, "exp": "The <limits> header defines numeric range constants. (These may be missing on some older compilers.)"}, {"ch": 2, "kind": "Recall", "q": "Which writes the integer eight as an OCTAL literal?", "opts": ["010", "8", "8o", "0x8"], "ans": 0, "exp": "A leading 0 makes a literal octal: 010 = 8. A leading 0x/0X makes it hex. Plain digits are decimal."}, {"ch": 2, "kind": "Recall", "q": "Why is it called 'floating-point'?", "opts": ["Points are approximate", "Values are stored in scientific notation, so the decimal point 'floats' to a new position", "The point can be deleted", "The values float in memory"], "ans": 1, "exp": "Internally a value like 50.534 is stored as 5.0534E+1 -- the decimal point moves (floats) to normalize the number, hence 'floating-point'."}, {"ch": 2, "kind": "Recall", "q": "The Unix/epoch time origin is:", "opts": ["Midnight Jan 1, 2000", "Midnight Jan 1, 1970 GMT", "System boot time", "The program's start time"], "ans": 1, "exp": "The epoch is midnight, January 1, 1970 GMT. time(0) (in <ctime>) returns seconds elapsed since then -- handy for seeding srand(time(0))."}, {"ch": 2, "kind": "Concept", "q": "Some compilers compute pow(a, 2) wrong; the safe form is:", "opts": ["pow(a, 2.0)", "a ** 2", "a ^ 2", "pow(a, 2)"], "ans": 0, "exp": "pow expects floating-point; some compilers need at least one float/double argument. Write pow(a, 2.0). Also note ^ is bitwise XOR in C++, not exponent, and ** doesn't exist."}, {"ch": 2, "kind": "Concept", "q": "Which is a STATEMENT (not just an expression)?", "opts": ["x > 5", "x + 5", "x + 5;", "x * y"], "ans": 2, "exp": "An expression produces a value (x + 5, x > 5). Add a semicolon and it becomes a statement that performs the action: x + 5;"}, {"ch": 2, "kind": "Concept", "q": "Which claim is FALSE? (CP 2.22)", "opts": ["x = y = x = 0 is illegal (assuming x, y declared)", "Any expression can be used as a statement", "x++ can be used as a statement", "x = x + 5 is also an expression"], "ans": 0, "exp": "x = y = x = 0 is LEGAL when the variables are declared (= is right-associative). The other three are true. So the 'illegal' claim is the false one."}, {"ch": 2, "kind": "Trace", "q": "If today is Tuesday, what day is it in 100 days? (CP 2.13)", "opts": ["Thursday", "Friday", "Tuesday", "Wednesday"], "ans": 0, "exp": "100 % 7 = 2. Tuesday + 2 = Thursday. Cyclic day math is pure modulo."}, {"ch": 2, "kind": "Concept", "q": "An explicit cast from double to int does what to the value AND the variable being cast?", "opts": ["Truncates; changes the variable", "Rounds; leaves the variable", "Rounds the value; changes the original variable", "Truncates the fractional part; does NOT change the original variable"], "ans": 3, "exp": "Casting truncates (drops the fraction) and produces a new value -- it does not modify the variable being cast."}, {"ch": 2, "kind": "Recall", "q": "short int is synonymous with short. Which pair is also synonymous?", "opts": ["char and int", "long int and long", "unsigned int and int", "float and double"], "ans": 1, "exp": "long int == long, unsigned int == unsigned, short int == short. float/double and char/int are distinct types."}, {"ch": 3, "kind": "Recall", "q": "In a switch, the default case:", "opts": ["Must be first", "Replaces break", "Is required", "Is optional and may appear anywhere among the cases"], "ans": 3, "exp": "default is optional; it runs when no case matches and can be placed anywhere (though conventionally last). It still needs break if more code follows it."}, {"ch": 3, "kind": "Concept", "q": "For  a && b  to be true, and for  a || b  to be true:", "opts": ["&& needs both true; || needs at least one true", "Both need both true", "Both need at least one true", "&& needs at least one true; || needs both true"], "ans": 0, "exp": "AND (&&) is true only when BOTH operands are true. OR (||) is true when AT LEAST ONE is true."}, {"ch": 3, "kind": "Trace", "q": "What does  cout << (3 > 2 ? 'A' : 'B');  print?", "opts": ["B", "A", "true", "1"], "ans": 1, "exp": "3 > 2 is true, so the ternary yields the first branch 'A'. The ternary evaluates only the selected branch."}, {"ch": 4, "kind": "Recall", "q": "Assuming E = 2.71828, what does log(E) return? (<cmath>)", "opts": ["0.0", "1.0", "2.71828", "10.0"], "ans": 1, "exp": "log is the NATURAL log (ln). ln(e) = 1.0. log10(10.0) = 1.0; exp(1.0) = 2.71828."}, {"ch": 4, "kind": "Recall", "q": "What does pow(2.0, 3) return, and of what type?", "opts": ["6.0, a double", "8.0, a double", "9.0, a double", "8, an int"], "ans": 1, "exp": "pow returns a double: 2^3 = 8.0. All <cmath> functions return double."}, {"ch": 4, "kind": "Recall", "q": "What does sqrt(4.0) return?", "opts": ["16.0", "2.0", "2", "Error"], "ans": 1, "exp": "sqrt(4.0) = 2.0 (a double). sqrt requires x >= 0."}, {"ch": 4, "kind": "Recall", "q": "ceil(2.1) and floor(2.1) return, respectively:", "opts": ["2.0 and 3.0", "3.0 and 2.0", "2.1 and 2.1", "3 and 2"], "ans": 1, "exp": "ceil rounds up (3.0), floor rounds down (2.0). Both return doubles. ceil(-2.1) = -2.0, floor(-2.1) = -3.0 (toward +inf / -inf)."}, {"ch": 4, "kind": "Recall", "q": "min, max, and abs are declared in which header?", "opts": ["<iomanip>", "<cstdlib>", "<cmath>", "<algorithm> only"], "ans": 1, "exp": "Per the course summary, min/max/abs are in <cstdlib> and work with int, long, float, or double. abs(-2.1) returns 2.1; max(2.5, 3.0) returns 3.0."}, {"ch": 4, "kind": "Recall", "q": "The size of a char and the ASCII scheme width are:", "opts": ["2 bytes, 16-bit", "1 byte, 7-bit only", "1 byte, 8-bit", "4 bytes, 32-bit"], "ans": 2, "exp": "char is 1 byte; C++ uses the 8-bit ASCII encoding to map characters to codes."}, {"ch": 4, "kind": "Recall", "q": "'A' to 'Z' occupy which ASCII range?", "opts": ["65-90", "48-57", "97-122", "65-122"], "ans": 0, "exp": "'A'-'Z' = 65-90, 'a'-'z' = 97-122, '0'-'9' = 48-57. Lowercase = uppercase + 32."}, {"ch": 4, "kind": "Recall", "q": "The ASCII code of the tab escape '' is:", "opts": ["13", "9", "8", "10"], "ans": 1, "exp": "=8 (backspace), =9 (tab), =10 (linefeed), =12 (formfeed), =13 (carriage return), =92, \\\"=34."}, {"ch": 4, "kind": "Recall", "q": "Which is NOT a whitespace character?", "opts": ["'\\n'", "'\\t'", "'\\0'", "space ' '"], "ans": 2, "exp": "Whitespace = space, , , , . '\\0' is the NULL terminator (code 0), not whitespace."}, {"ch": 4, "kind": "Concept", "q": "The difference between '' and endl is:", "opts": ["'\\n' flushes; endl doesn't", "No difference", "endl is faster", "endl also flushes the output buffer; '\\n' just moves to a new line"], "ans": 3, "exp": "Both start a new line, but endl ALSO flushes the buffer (forcing immediate display). That flush makes endl slightly slower in tight loops."}, {"ch": 4, "kind": "Trace", "q": "What does this store? (int -> char keeps low 8 bits)", "code": "char c = 0xFF41;\ncout << c;", "opts": ["A (only the low byte 0x41 = 65 is kept)", "Garbage", "FF41", "Compile error"], "ans": 0, "exp": "Casting an int to char keeps only the low 8 bits: 0xFF41 -> 0x41 = 65 = 'A'."}, {"ch": 4, "kind": "Trace", "q": "What does  char c = 65.25; cout << c;  print?", "opts": ["65.25", "A", "65", "Compile error"], "ans": 1, "exp": "A floating value cast to char goes double -> int (truncate to 65) -> char ('A'). Prints A."}, {"ch": 4, "kind": "Trace", "q": "What integer is  '2' + '3'  (as ASCII codes)?", "opts": ["23", "'5'", "101", "5"], "ans": 2, "exp": "'2'=50, '3'=51. char + char adds codes: 50 + 51 = 101. Not 2 + 3."}, {"ch": 4, "kind": "Concept", "q": "'A' versus \"A\":", "opts": ["Both are strings", "Identical", "'A' is a char (single quotes); \"A\" is a string (double quotes)", "'A' is a string; \"A\" is a char"], "ans": 2, "exp": "Single quotes = a single char ('A'). Double quotes = a string literal (\"A\", which also carries a hidden '\\0')."}, {"ch": 4, "kind": "Concept", "q": "The string type is:", "opts": ["A primitive type like int", "A built-in keyword", "An object type (instance of the string class), needs <string>", "A char array only"], "ans": 2, "exp": "string is NOT primitive -- it's a class; a string variable is an object. Include <string>. Functions are called as s.length(), s.at(i), etc."}, {"ch": 4, "kind": "Concept", "q": "getline(cin, s, delimiter): the delimiter character is:", "opts": ["Stored at the end of s", "Read from input but NOT stored in s; defaults to '\\n'", "Left in the buffer", "Required, no default"], "ans": 1, "exp": "getline reads up to the delimiter, consumes it from the stream, but does NOT put it in s. The third argument defaults to '', so getline(cin, s) reads a whole line."}, {"ch": 4, "kind": "Recall", "q": "s.length() and s.size() are:", "opts": ["length() includes the '\\0'", "The same -- both return the character count", "Different (size counts bytes)", "size() is for arrays only"], "ans": 1, "exp": "For std::string, length() and size() are identical. (std::string doesn't expose a '\\0' in its count.)"}, {"ch": 4, "kind": "Trace", "q": "What prints (no 'fixed')?", "code": "cout << setprecision(5) << 12.34567;", "opts": ["12.3", "12.34567", "12.35", "12.346"], "ans": 3, "exp": "Without fixed, setprecision = total significant digits. 5 sig-figs of 12.34567, rounded -> 12.346."}, {"ch": 4, "kind": "Trace", "q": "What prints?", "code": "cout << setprecision(3) << 23456;", "opts": ["234", "23456", "2.34e4", "23500"], "ans": 1, "exp": "If the precision is smaller than the integer part it's IGNORED, and it has no effect on plain integers anyway -> 23456."}, {"ch": 4, "kind": "Recall", "q": "After 'fixed' with no setprecision, how many digits print after the decimal point?", "opts": ["6 (the default)", "All of them", "0", "2"], "ans": 0, "exp": "fixed defaults to 6 digits after the decimal point. After fixed, setprecision(n) sets digits AFTER the point (not total significant digits)."}, {"ch": 4, "kind": "Trace", "q": "What prints?", "code": "cout << showpoint << 1;", "opts": ["1.0", "1.", "1.00000", "1"], "ans": 3, "exp": "showpoint only affects floating-point values. Applied to the int 1 it has no effect -> prints 1."}, {"ch": 4, "kind": "Concept", "q": "If the item is wider than setw's width, the output is:", "opts": ["Padded anyway", "Truncated to the width", "Printed in full; the width auto-increases (no truncation)", "An error"], "ans": 2, "exp": "setw sets a MINIMUM field width. If the value needs more room, it's printed in full -- setw never truncates."}, {"ch": 4, "kind": "Trace", "q": "What prints (use _ for space)?", "code": "cout << left << setw(8) << \"Hello\" << \"World\";", "opts": ["HelloWorld", "Hello World", "Hello___World  (Hello left-justified in 8, 3 trailing spaces)", "___HelloWorld"], "ans": 2, "exp": "left justifies within setw's field: 'Hello' in 8 cols, left -> 3 trailing spaces. Then 'World' prints immediately (setw is transient). 'Hello___World'."}, {"ch": 6, "kind": "Recall", "q": "The actual value passed in a call is the ARGUMENT; the variable that receives it in the function header is the:", "opts": ["Return value", "Local constant", "Prototype", "Parameter (formal parameter)"], "ans": 3, "exp": "Argument (actual parameter) = the value passed at the call site. Parameter (formal parameter) = the variable in the function definition that receives it."}, {"ch": 6, "kind": "Concept", "q": "A function prototype (declaration) differs from a definition in that it:", "opts": ["Allocates the function's memory", "Includes the body", "Must repeat parameter names", "Gives only the signature + return type and ends with a semicolon (no body)"], "ans": 3, "exp": "A prototype declares the interface (return type, name, parameter types) and ends with ';' -- no body. Parameter names are optional in a prototype."}, {"ch": 6, "kind": "Concept", "q": "The <cmath> functions like abs/sqrt are 'overloaded' meaning:", "opts": ["They can be redefined by you", "Versions exist for different argument types (int, float, double), chosen by the compiler", "They take any number of arguments", "They return multiple values"], "ans": 1, "exp": "Overloading provides multiple versions distinguished by parameter types; the compiler picks the matching one for your argument's type."}, {"ch": 7, "kind": "Concept", "q": "In the deck-of-cards model (cards 0..51), the suit and rank are:", "opts": ["suit = card % 13, rank = card / 13", "suit = card / 4, rank = card % 4", "suit = card / 13, rank = card % 13", "suit = card % 4, rank = card / 4"], "ans": 2, "exp": "With 13 ranks per suit: suit = card / 13 (0..3), rank = card % 13 (0..12). Division groups; modulo positions within the group."}, {"ch": 7, "kind": "Concept", "q": "To count letter occurrences with int counts[26], you increment:", "opts": ["counts['a' - ch]++", "counts[ch - 'a']++", "counts[ch]++", "counts[ch - '0']++"], "ans": 1, "exp": "ch - 'a' maps 'a'..'z' to 0..25, the array index. So counts[ch - 'a']++ tallies that letter."}, {"ch": 7, "kind": "Recall", "q": "Linear search vs binary search:", "opts": ["Both are O(1)", "Linear needs a sorted array; binary works on any array", "Both need sorted arrays", "Linear works on any array (O(n)); binary needs a sorted array (O(log n))"], "ans": 3, "exp": "Linear search scans sequentially -- works unsorted, O(n). Binary search halves a SORTED array each step, O(log n)."}, {"ch": 7, "kind": "Recall", "q": "Selection sort works by:", "opts": ["Splitting and merging halves", "Repeatedly selecting the smallest remaining element and swapping it into the next position", "Partitioning around a pivot", "Swapping adjacent out-of-order pairs repeatedly"], "ans": 1, "exp": "Selection sort finds the minimum of the unsorted region and swaps it into place, advancing one position each pass."}, {"ch": 7, "kind": "Concept", "q": "A correct array function prototype is:", "opts": ["void p(int, int);", "void p(int* []);", "void p(int[], int);", "void p(int[10]);"], "ans": 2, "exp": "For an array parameter you keep the empty brackets: void p(int[], int size). The size is passed separately because the array decays to a pointer."}, {"ch": 7, "kind": "Concept", "q": "If function A passes a const array to function B, then B's parameter must:", "opts": ["Copy the array first", "Return the array", "Also be declared const (cascading const)", "Be non-const for speed"], "ans": 2, "exp": "const cascades: a const array can only be passed to a parameter that is also const, otherwise B could modify what A promised not to."}, {"ch": 7, "kind": "Concept", "q": "A lookup/lookup-table replaces a long if-else ladder; e.g. month name is:", "code": "string months[] = {\"January\", ..., \"December\"};", "opts": ["months[monthNumber]", "months.at(monthNumber, -1)", "months[monthNumber - 1]", "months[monthNumber + 1]"], "ans": 2, "exp": "Months 1..12 map to indices 0..11, so months[monthNumber - 1]. This one expression replaces a 12-branch if-else."}, {"ch": 8, "kind": "Concept", "q": "In the closest-pair scan over points, the inner loop starts at:", "code": "for (int i = 0; i < n; i++)\n    for (int j = ?; j < n; j++)", "opts": ["j = 1", "j = i", "j = 0", "j = i + 1"], "ans": 3, "exp": "Starting the inner loop at j = i + 1 checks each unordered pair once, avoiding self-pairs (i==j) and duplicate (j,i) comparisons."}, {"ch": 8, "kind": "Concept", "q": "In Sudoku, the top-left cell of the 3x3 box containing grid[i][j] is:", "opts": ["grid[i/3][j/3]", "grid[i%3][j%3]", "grid[i-3][j-3]", "grid[(i/3)*3][(j/3)*3]"], "ans": 3, "exp": "(i/3)*3 snaps the row down to the box's starting row (0,3,6); same for columns. So the box origin is grid[(i/3)*3][(j/3)*3]."}, {"ch": 8, "kind": "Recall", "q": "Weather data for 10 days x 24 hours x 2 metrics is naturally a:", "opts": ["1D array of 480", "Array of strings", "3D array data[10][24][2]", "2D array [10][48]"], "ans": 2, "exp": "Three independent dimensions -> a 3D array data[10][24][2]: day, hour, metric."}, {"ch": 9, "kind": "Concept", "q": "Copying one object to another with = does what by default?", "code": "Circle c2 = c1;", "opts": ["Memberwise copy: copies each data field; c2 is independent", "Makes them share memory", "Copies only public fields", "Compile error"], "ans": 0, "exp": "Default copy is memberwise -- each data field is copied, producing an independent object. Changing c2 afterward doesn't affect c1."}, {"ch": 9, "kind": "Concept", "q": "A const member function such as  double getArea() const  promises:", "opts": ["It is private", "It can only be called once", "The return value is const", "Not to modify the object's data members"], "ans": 3, "exp": "The trailing const means the function won't modify the object's state; it can be called on const objects."}, {"ch": 9, "kind": "Concept", "q": "To display the area of a temporary (anonymous) object you write:", "opts": ["cout << Circle().getArea();", "cout << getArea(Circle);", "cout << Circle.getArea();", "cout << Circle{}.getArea;"], "ans": 0, "exp": "Circle() constructs an anonymous object; .getArea() calls on it. The parentheses are required -- without them Circle is just a type name."}, {"ch": 9, "kind": "Concept", "q": "A member function defined INSIDE the class body is:", "opts": ["Illegal -- must be outside", "A constructor", "Always private", "Automatically inline"], "ans": 3, "exp": "Functions defined within the class definition are implicitly inline. Defining them outside (with ClassName::) does not make them inline."}, {"ch": 9, "kind": "Recall", "q": "In separate compilation, the class definition usually goes in the ___ and the function bodies in the ___:", "opts": ["both in .cpp", ".cpp / .h", ".h (header) / .cpp (source)", "both in .h"], "ans": 2, "exp": "The class definition (members) lives in a .h header; the out-of-class function bodies (ReturnType ClassName::method) live in the .cpp. Headers use inclusion guards."}, {"ch": 9, "kind": "Concept", "q": "At end of scope, an object's members are destroyed in what order relative to construction?", "opts": ["Alphabetical", "Random order", "Reverse order of construction", "Same order as constructed"], "ans": 2, "exp": "Construction initializes members in declaration order; destruction runs in the REVERSE order. (LIFO, like the stack.)"}, {"ch": 9, "kind": "Concept", "q": "Encapsulation in a class means:", "opts": ["Making everything public", "Hiding data (private fields) and exposing controlled access via public functions", "Using only global variables", "Avoiding constructors"], "ans": 1, "exp": "Encapsulation = private data + public interface (accessors/mutators). The outside world can't touch the internals directly, so the class controls its own state."}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.23:  Explain the C++ keywords. List some C++ keywords you learned in this chapter.", "opts": ["Keywords are lines the compiler ignores, like comments.", "Keywords are user-defined names you can redefine as variables.", "Keywords are library functions such as cout and cin.", "Keywords are reserved words built into the language; they cannot be used as identifiers (e.g. int, double, return, if, for)."], "ans": 3, "exp": "They Keywords are the words that are built inside the compiler and cannot be used as identifiers using , namespace return , int."}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.24:  Is C++ case sensitive? What is the case for C++ keywords?", "opts": ["Yes , C++ is case sensitive. The case for C++ keywords is uppercase.", "Yes , C++ is case insensitive. The case for C++ keywords is lowercase.", "no , C++ is case sensitive. The case for C++ keywords is lowercase.", "Yes , C++ is case sensitive. The case for C++ keywords is lowercase."], "ans": 3, "exp": "Yes , C++ is case sensitive. The case for C++ keywords is lowercase."}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.25:  What is the C++ source file name extension, and what is the C++ executable file name extension on Windows?", "opts": [".h for source file and .exe for executable file.", ".cpp for source file and .exe for executable file on Windows.", ".cpp for source file and .obj for executable file.", ".c for source file and .out for executable file."], "ans": 1, "exp": ".cpp for source file and .exe for executable file on Windows."}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.26:  What is a comment? What is the syntax for a comment in C++? Is the comment ignored by the compiler?", "opts": ["A comment is any line that begins with cout.", "A comment starts with # and ends at a semicolon.", "A comment is text the compiler ignores; // starts a single-line comment and /* ... */ wraps a multi-line comment.", "A comment is a statement the compiler runs last."], "ans": 2, "exp": "A comment is a line that's written by the programmer and completely ignored by the compiler , mainly for making the code easier to understand and for future editing , syntax is // for single line and /* .. */ for multiple lines"}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.27:  What is the statement to display a string on the console?", "opts": ["cout<<\"MESSAGE\";", "cout>>\"MESSAGE\";", "cin>>variable;", "pow(2.0,3.5);"], "ans": 0, "exp": "cout<<\"MESSAGE\";"}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.28:  What does the namespace std stand for?", "opts": ["std is the standard input device (the keyboard).", "std means 'standard'; a namespace groups names so identifiers with the same name don't collide.", "std means 'system type definitions' and makes the program faster.", "std is the function that starts execution."], "ans": 1, "exp": "std stands for standard , Namespaces prevent identifiers of the same name from being confused, but using using namespace std; places all identifiers in the standard library on an equal footing with all other libraries that contain common identifiers, resulting in ambiguity errors rather than giving priority."}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.29:  Which of the following preprocessor directive is correct?", "opts": ["import iostream", "#include iostream", "#include <iostream>", "include <iostream>"], "ans": 2, "exp": "Option B is the standard definition and is the only correct one."}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.30:  Which of the following preprocessor directive will work with all C++ compilers?", "opts": ["#include <iostream >", "#include <iostream>", "include <iostream>", "#include  < iostream>"], "ans": 1, "exp": "Option D is the standard. option a has space at beginning , option b has space at end , option c missing #"}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.31:  Show the output of the following code:", "opts": ["3.5 * 4 / 2 - 2.5 = 4.5", "3.5 * 4 / 2 - 2.5 = 5.5", "3.5 * 8 / 2 - 2.5 = 4.5", "3.5 * 4 / 2 - 1.5 = 4.5"], "ans": 0, "exp": "3.5 * 4 / 2 - 2.5 = 4.5", "code": "#include <iostream>\nusing namespace std;\nint main()\n{\ncout << \"3.5 * 4 / 2 - 2.5 = \" << ( 3.5 * 4 / 2 - 2.5 ) << endl;\nreturn 0;\n}"}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.32:  Show the output of the following code:", "opts": ["C++Java\nC++Java\nC++, Java, and C#", "C++Java\nC++\nJava\nC++, Java, and C#", "C++\nJava\nC++\nJava\nC++, Java, and C#", "C++ Java C++ Java C++, Java, and C#"], "ans": 1, "exp": "The output will be as following :\nC++Java\nC++\nJava\nC++, Java, and C#\ninclude <iostream>;\nusing namespace std;\nint main\n// Display Welcome to C++ to the console\ncout << Welcome to C++! << endl;\nreturn 0;\nYou should add double quotes and the beginning and end of string literal to be printed.", "code": "#include <iostream>\nusing namespace std;\nint main()\n{\ncout << \"C++\" << \"Java\" << endl;\ncout << \"C++\" << endl << \"Java\" << endl;\ncout << \"C++, \" << \"Java, \" << \"and C#\" << endl;\nreturn 0;\n}"}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.36:  How do you denote a comment line and a comment paragraph?", "opts": ["A comment line uses //; a comment paragraph (block) uses /* ... */.", "A comment line uses #; a block uses < ... >.", "Both use // - C++ has no block comments.", "A comment line uses /* */; a block uses //."], "ans": 0, "exp": "Comment line using // and comment paragraph /* lines */"}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.38:  What are syntax errors (compile errors), runtime errors, and logic errors?", "opts": ["All three kinds are caught by the compiler before the program runs.", "Logic errors stop the program from compiling.", "Syntax (compile) errors break the grammar and stop compilation; runtime errors crash the running program (e.g. divide by zero); logic errors run but give wrong results.", "Syntax errors happen while running; runtime errors are caught by the compiler."], "ans": 2, "exp": "- Syntax Errors : The Error that occur due a typo in typing or calling something in wrong syntax , In general synatx error is any error that doesn't follow compiler synatx rules\n- Runtime Errors : The Errors that happens during the execution of the program (reading from a file that doesn't exist , division by 0)\n- Logic Errors : The Errors that doesn't cause the program's functionality to be off , but rather than the expected purpose and behavior is unlike what's desired"}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.39:  If you forget to put a closing quotation mark on a string, what kind of error will occur?", "opts": ["A syntax (compile) error - the compiler cannot parse the unterminated string literal.", "A runtime error - it crashes only when that line runs.", "A logic error - it compiles and runs but prints the wrong text.", "No error - the compiler adds the missing quote automatically."], "ans": 0, "exp": "Synatx Error"}, {"ch": 1, "kind": "Checkpoint", "q": "Check Point 1.40:  If your program needs to read data from a file, but the file does not exist, an error would occur when running this program. What kind of error is this?", "opts": ["Nothing happens; the read statements are silently skipped.", "A new empty file is created automatically and rea =1;\n    return 0;\n}"}, {"ch": 2, "kind": "Checkpoint", "q": "Check Point 2.7:  What are the benefits of using named constants? Declare an int constant SIZE with value 20 .", "opts": ["They are required for every loop in a program.", "They run faster than variables because they skip memory.", "They can't change during execution, make the code more readable, and let you update a value in just one place.", "They can be reassigned at any time during the program."], "ans": 2, "exp": "They don't change during the execution of the program , It's more convinient to avoid using variables for never-changed values , const int SIZE=20;"}, {"ch": 2, "kind": "Checkpoint", "q": "Check Point 2.8:  Translate the following algorithm into C++ code: Step 1: Declare a double variable named miles with initial value 100 . Step 2: Declare a double constant named KILOMETERS_PER_MILE with value 1.609 Step 3: Declare a double variable named kilometers , multiply miles and KILOMETERS_PER_MILE , and assign the result to kilometers . Step 4: Display kilometers to the console. What is kilometers after Step 4?", "opts": ["f takes a double&.", "1,3,4 are equivalent.", "double miles=100;", "only first."], "ans": 2, "exp": "double miles=100;\nconst double KILOMETERS_PER_MILE=1.609;\ndouble kilometers=miles*KILOMETERS_PER_MILE;\ncout<<kilometers;"}, {"ch": 2, "kind": "Checkpoint", "q": "Check Point 2.9:  Find the largest and smallest short , int , long , float , and double on your machine. Which of these data types requires the least amount of memory?", "opts": ["short holds the smallest range and double the largest; you can find the exact limits with <climits>/<cfloat> (or numeric_limits).", "double is the smallest because it stores decimals.", "All numeric types hold exactly the same range.", "int is always the largest type and char the smallest."], "ans": 0, "exp": "Generally the smallest is short and largest is double , To find the exact limits programmatically, we use the macro constants defined in the <climits> header file:\n- short: Min is SHRT_MIN, Max is SHRT_MAX (Requires 2 bytes).\n- int: Min is INT_MIN, Max is INT_MAX (Requires 4 bytes).\n- long: Min is LONG_MIN, Max is LONG_MAX (Requires 4 bytes on Windows).\n- float: Min is -FLT_MAX, Max is FLT_MAX (Requires 4 bytes).\n- double: Min is -DBL_MAX, Max is DBL_MAX (Requires 8 bytes).\nAmong these data types, short requires the least amount of memory, allocating only 2 bytes (16 bits) on modern machines."}, {"ch": 2, "kind": "Checkpoint", "q": "Check Point 2.10:  Which of the following are correct literals for floating-point numbers?", "opts": ["Illegal: t1 and t2.", "All of them except 39 and 40.", "Yes all of them", "All except last"], "ans": 1, "exp": "All of them except 39 and 40.", "code": "12.3, 12.3e+2, 23.4e-2, -334.4, 20.5, 39, 40"}, {"ch": 2, "kind": "Checkpoint", "q": "Check Point 2.11:  Which of the following are the same as 52.534 ?", "opts": ["Yes all of them", "All except first", "All except last", "All of them except 39 and 40."], "ans": 2, "exp": "All except last", "code": "5.2534e+1, 0.52534e+2, 525.34e-1, 5.2534e+0"}, {"ch": 2, "kind": "Checkpoint", "q": "Check Point 2.12:  Show the result of the following remainders:", "opts": ["2 , 2 , 4 , 2 , 0 , 1", "2 , 2 , 5 , 4 , 0 , 1", "2 , 2 , 4 , 4 , 0 , 1", "2 , 2 , 4 , 7 , 0 , 1"], "ans": 2, "exp": "2 , 2 , 4 , 4 , 0 , 1", "code": "56 % 6\n78 % 4\n34 % 5\n34 % 15\n5 % 1\n1 % 5"}, {"ch": 2, "kind": "Checkpoint", "q": "Check Point 2.13:  If today is Tuesday, what day will it be in 100 days?", "opts": ["Wednesday - 100 mod 7 = 1.", "Thursday - 100 mod 7 = 2, so two days after Tuesday.", "Tuesday - 100 is a multiple of 7.", "Friday - 100 mod 7 = 3."], "ans": 1, "exp": "(Tuesday+100)=(Tuesday+100) 7=(Tuesday+(100 7)) 7\n=(Tuesday+2)=Thursady."}, {"ch": 2, "kind": "Checkpoint", "q": "Check Point 2.14:  What is the result of 25 / 4 ? How would you rewrite the expression if you wished the result to be a floating-point number?", "opts": ["Yes , clusive-or: the ^ operator (or != on the two bool results)."}, {"ch": 3, "kind": "Checkpoint", "q": "Check Point 3.32:  What data types are required for a switch variable? If the keyword break is not used after a case is processed, what is the next statement to be executed? Can you convert a switch statement to an equivalent if statement, or vice versa? What are the advantages of using a switch statement?", "opts": ["A switch can only test a single boolean condition.", "A switch tests only integral types (int, short, long, char, bool); without break, execution falls through into the following cases.", "A switch can test any type, including double and string.", "A switch needs break after every case or it won't compile."], "ans": 1, "exp": "integral only (int,short,long,bool) , if break not used , all statement after the case that got statisfied will be executed , yes it's possible to convert in both ways , using a switch statement reduces the casework overhead comparingly to if-statements in certain cases."}, {"ch": 3, "kind": "Checkpoint", "q": "Check Point 3.33: What is y after this switch runs?", "opts": ["y is 0", "y is 3", "y is 1", "y is 2"], "ans": 3, "exp": "x+3 is 6, so case 6 sets y = 1; with no break it falls through to default, y += 1, giving y = 2.", "code": "int x = 3; int y = 3;\nswitch (x + 3)\n{\n  case 6:  y = 1;     // no break -> falls through\n  default: y += 1;\n}"}, {"ch": 3, "kind": "Checkpoint", "q": "Check Point 3.34:  What is x after the following if-else statement is executed? Use a switch state- ment to rewrite it and draw the flowchart for the new switch statement.", "opts": ["x is 51 (every branch is applied).", "x is 1 (no branch matches).", "x is 11.", "x is 17 (a == 3, so x += 16 is applied to the initial 1)."], "ans": 3, "exp": "17 and the rewritten code is\nint x=1,a=3;\nswitch(a)\ncase 1:\nx+=5;\nbreak;\ncase 2:\nx+=10;\nbreak;\ncase 3:\nx+=16;\nbreak;\ncase 4:\nx+=34;\nbreak;", "code": "int x = 1, a = 3;\nif (a == 1 )\nx += 5;\n : ["Prints the odd numbers less than 10: 3, 5, 7, 9.", "Prints 1, 3, 5, 7, 9.", "Prints the even numbers: 2, 4, 6, 8.", "Infinite loop - nothing is printed."], "ans": 0, "exp": "i++ % 2 tests the old i then increments. The test is true for old i = 2,4,6,8, and by then i has become 3,5,7,9, which is what prints.", "code": "int i = 1;\nwhile (i < 10)\n  if (i++ % 2 == 0)\n    cout << i << endl;"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.4:  Suppose the input is 2 3 4 5 0 . What is the output of the following code?", "opts": ["max is 5 , number is 0", "max is 5 , number is 2", "max is 5 , number is 1", "max is 6 , number is 0"], "ans": 0, "exp": "max is 5 , number is 0", "code": "# include <iostream>\nusing namespace std;\nint main()\n{\nint number, max;\ncin >> number;\nmax = number;\nwhile (number != 0 )\n{\ncin >> number;\nif (number > max)\nmax = number;\n}\ncout << \"max is \" << max << endl;\ncout << \"number \" << number << endl;\nreturn 0;\n}"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.5: What is the output of the following code? Explain.", "opts": ["x is -2147483648 (because of int overflow)", "Infinite loop - x is always positive, so nothing is printed", "x is 80000001 (the loop body runs once)", "x is 2147483647 (the loop stops at INT_MAX)"], "ans": 0, "exp": "x keeps incrementing past INT_MAX (2147483647); the next ++ overflows to INT_MIN (-2147483648), which is <= 0, so the loop ends and that value prints.", "code": "int x = 80000000;\nwhile (x > 0)\n  x++;\ncout << \"x is \" << x << endl;"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.6:  How do you test end of the file when reading data from a file?", "opts": ["Invoke the end() function on the input stream object.", "Compare each value read against a constant named EOF_MARKER.", "Invoke the eof() function on the input stream object.", "Check whether the input object is equal to NULL."], "ans": 2, "exp": "invoke the eof() function on the input object."}, {"ch": 5, "kind": "C he while loop checks is always 0 (as initilaised) and always runs once.", "code": "int total = 0, num = 0;\ndo\n{\n// Read the next data\ncout << \"Enter an int value, \" <<\n\"\\nexit if the input is 0: \";\nint num;\ncin >> num;\ntotal += num;\n} while (num != 0 );\ncout << \"Total is \" << total << endl;"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.10:  Do the following two loops result in the same value in sum ?", "opts": ["Yes - both loops give the same sum; ++i vs i++ only differs when the expression's value is used, not as a standalone loop step.", "No - ++i skips the first iteration.", "No - i++ runs one extra iteration.", "They differ only in speed, not in the result."], "ans": 0, "exp": "The difference between ++i and i++ only matters when you use the expression inside an assignment or a calculation on the same line (like array[i++] or int x = ++i).\nBoth run the same (i=0 i=9)", "code": "for (int i = 0; i < 10; ++i)\n{\n sum += i;\n}"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.12: Suppose the input is 2 3 4 5 0. What is the output?", "opts": ["sum is 14, count is 5", "sum is 24, count is 5", "sum is 9, count is 5", "sum is 14, count is 4"], "ans": 0, "exp": "The loop reads 5 numbers (count 0..4): 2+3+4+5+0 = 14. count is incremented to 5 when the loop exits.", "code": "int number, sum = 0, count;\nfor (count = 0; count < 5; count++)\n{\n  cin >> number;\n  sum += number;\n}\ncout << \"sum is \" << sum << endl;\ncout << \"count is \" << count << endl;"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.13:  What does the following statement do?", "opts": ["Creates an infinite loop", "first and second", "No but pointing to the same memory location.", "Illegal: t1 and t2."], "ans": 0, "exp": "Creates an infinite loop", "code": "for (;; )\n{\n// Do something\n}"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.14:  If a variable is declared in the for loop control, can it be used after the loop exits?", "opts": ["No - a variable declared in the for header is local to the loop and is not accessible afterward.", "Yes - it stays in scope for the rest of the function.", "Only if the loop ran at least one iteration.", "Yes, but only if it was initialized to 0."], "ans": 0, "exp": "NO (the variable only belongs to the for-loop scope)"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.15:  Convert the following for loop statement to a while loop and to a do-while loop:", "opts": ["A for loop cannot be rewritten as a while loop here.", "do-while: do { i++; sum+=i; } while(i<1000);", "while: while(i<=1000) sum+=i;  (counter never updates).", "while: int i=0; while(i<=1000) sum+=i++;   do-while: int i=0; do { sum+=i; i++; } while(i<=1000);"], "ans": 3, "exp": "long sum=0;\nint i=0;\nwhile(i<=1000)\nsum+=i++;\n//2nd part\nlong sum=0;\nint i=0;\ndo\nsum+=i;\ni++;\nwhile(i<=1000);", "code": "long sum = 0;\nfor ( int i = 0; i <= 1000; i++)\nsum = sum + i;"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.16 (a): How many iterations does this loop run (in terms of n)?", "opts": ["n - 1 iterations", "n + 1 iterations", "n iterations", "Infinite loop"], "ans": 2, "exp": "count goes 0, 1, ..., n-1, running the body n times.", "code": "int count = 0;\nwhile (count < n)\n{\n  count++;\n}"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.16 (b): How many iterations does this loop run (in terms of n)?", "opts": ["n + 2 iterations", "n iterations", "n + 1 iterations", "n - 1 iterations"], "ans": 2, "exp": "count goes 0, 1, ..., n (because of count <= n), which is n + 1 iterations.", "code": "for (int count = 0; count <= n; count++)\n{\n}"}, {"ch": 5, "kind": "Checkpoint", "q": "Check Point 5.16 (c): How many iterations does this loop run (in terms of n)?", "opts": ["n - 5 iterations", "n iterations", "n + 5 iterations", "n - 4 iterations"], "ans": 0, "exp": "count starts at 5 and rises to n-1, so it runs n - 5 times.", "code": "int count = 5;\nwhile (count < n)\n{\n  count++;\n}"}, {"ch": 5, "kind":
