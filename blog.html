<style>
:root{
  --bg:#0B1220; --bg2:#0E1726; --panel:#141E33; --panel2:#192541;
  --line:#26334E; --line2:#33425f;
  --ink:#E7ECF7; --muted:#8A97AD; --faint:#5C6981;
  --amber:#E7B53D; --good:#4FC08A; --bad:#EB6A4E;
  --blue:#6F9BE8; --purple:#B79BE0; --orange:#E08A5B; --teal:#4FB89A; --green:#4FC08A;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; line-height:1.5; min-height:100vh; min-height:100dvh;}
#mathbg{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block; opacity:.9;}
.bgveil{position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(1100px 620px at 72% -8%, rgba(231,181,61,.07), transparent 60%),
    radial-gradient(900px 520px at -8% 112%, rgba(79,184,154,.07), transparent 55%),
    radial-gradient(700px 700px at 50% 45%, rgba(11,18,32,.55), rgba(11,18,32,.0) 70%);}
.wrap{position:relative; z-index:2; max-width:760px; margin:0 auto;
  padding:0 16px env(safe-area-inset-bottom) 16px; padding-top:calc(14px + env(safe-area-inset-top));}
.term{position:relative; border:1px solid var(--line); border-radius:14px; overflow:hidden;
  background:linear-gradient(180deg, rgba(20,30,51,.82), rgba(14,23,38,.9));
  -webkit-backdrop-filter:blur(9px) saturate(115%); backdrop-filter:blur(9px) saturate(115%);
  box-shadow:0 30px 70px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.02) inset, 0 1px 0 rgba(255,255,255,.04) inset;}
.termbar{display:flex; align-items:center; gap:8px; padding:11px 14px;
  background:rgba(255,255,255,.025); border-bottom:1px solid var(--line);}
.dot{width:11px;height:11px;border-radius:50%}.dot.r{background:#e8654b}.dot.y{background:#e7b53d}.dot.g{background:#4fc08a}
.termtitle{font-family:var(--mono); font-size:12px; color:var(--faint); margin-left:8px; letter-spacing:.02em;
  display:flex; align-items:center; gap:7px}
.termbody{padding:18px 18px 22px}
@media(min-width:560px){.termbody{padding:26px 28px 30px}}

.back{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12.5px;
  color:var(--muted); text-decoration:none; margin-bottom:12px; transition:color .15s}
.back:hover{color:var(--amber)} .back i{font-size:11px}
.crumb{font-family:var(--mono); font-size:11.5px; color:var(--faint); margin:0 0 10px; word-break:break-word}
.crumb a{color:var(--muted); text-decoration:none} .crumb a:hover{color:var(--amber)}
.crumb .sep{color:var(--line2); margin:0 6px}
.prompt{font-family:var(--mono); font-size:13px; color:var(--muted); margin:0 0 6px}
.prompt .u{color:var(--good)} .prompt .p{color:var(--blue)} .prompt .d{color:var(--amber)}
.cursor{display:inline-block;width:8px;height:15px;background:var(--amber);vertical-align:-2px;margin-left:3px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

h1{font-family:var(--mono); font-weight:700; font-size:27px; letter-spacing:-.01em; margin:6px 0 2px; line-height:1.12}
@media(min-width:560px){h1{font-size:32px}}
h1 .ac{color:var(--amber)}
.sub{color:var(--muted); font-size:14px; margin:0 0 16px}
.label{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--faint); margin:18px 0 10px; display:flex; align-items:center; gap:9px}
.label::before{content:""; width:16px; height:1px; background:var(--line2)}

.search{display:flex; align-items:center; gap:10px; background:var(--bg2); border:1px solid var(--line);
  border-radius:10px; padding:11px 13px; margin:2px 0 4px; transition:border-color .15s, box-shadow .15s}
.search:focus-within{border-color:var(--line2); box-shadow:0 0 0 3px rgba(231,181,61,.08)}
.search i{color:var(--amber); font-size:13px}
.search input{flex:1; background:none; border:none; outline:none; color:var(--ink); font-family:var(--mono); font-size:13px}
.search input::placeholder{color:var(--faint)}

.grid{display:grid; grid-template-columns:1fr; gap:10px; margin-top:4px}
.card{display:flex; align-items:center; gap:13px; padding:14px; cursor:pointer;
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  text-decoration:none; color:inherit; transition:border-color .15s, background .15s, transform .12s, box-shadow .15s}
.card:hover{border-color:var(--line2); background:linear-gradient(var(--panel),var(--panel2));
  box-shadow:0 14px 30px -22px rgba(0,0,0,.9)} .card:active{transform:translateY(1px)}
.ic{flex:0 0 auto; display:grid; place-items:center; border:1px solid transparent;
  width:42px;height:42px;border-radius:11px; font-size:17px}
.ic.amber{background:rgba(231,181,61,.16); color:var(--amber); border-color:rgba(231,181,61,.3)}
.ic.blue{background:rgba(111,155,232,.16); color:var(--blue); border-color:rgba(111,155,232,.3)}
.ic.teal{background:rgba(79,184,154,.16); color:var(--teal); border-color:rgba(79,184,154,.3)}
.ic.purple{background:rgba(183,155,224,.16); color:var(--purple); border-color:rgba(183,155,224,.3)}
.cbody{flex:1 1 auto; min-width:0}
.ctitle{font-size:14.5px; color:var(--ink); font-weight:600; display:flex; align-items:center; gap:8px}
.cblurb{font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cmeta{font-family:var(--mono); font-size:11px; color:var(--faint); flex:0 0 auto; text-align:right}
.arrow{color:var(--faint); font-family:var(--mono); font-size:15px; flex:0 0 auto; transition:color .15s, transform .15s}
.card:hover .arrow{color:var(--amber); transform:translateX(2px)}

/* ---- post body ---- */
.post{font-family:var(--sans); font-size:15.5px; line-height:1.75; color:var(--ink); margin-top:6px}
.post p{margin:0 0 18px}
.post em{font-style:italic; color:var(--ink)}
.post strong{font-weight:700; color:#fff}
.post a{color:var(--amber); text-decoration:none; border-bottom:1px solid rgba(231,181,61,.35)}
.post a:hover{border-bottom-color:var(--amber)}
.post mjx-container[display="true"]{margin:22px 0 !important; overflow-x:auto; overflow-y:hidden}

.empty,.miss{color:var(--faint); font-family:var(--mono); font-size:13.5px; padding:16px 2px} .miss a{color:var(--amber)}
.loading{display:flex; align-items:center; gap:10px; color:var(--muted); font-family:var(--mono); font-size:13px; padding:26px 2px}
.loading i{color:var(--amber)}
.errbox{border:1px solid rgba(235,106,78,.4); background:rgba(235,106,78,.08); border-radius:11px;
  padding:14px 16px; margin-top:6px; font-size:13px; color:var(--ink)}
.errbox b{color:var(--bad)} .errbox code{font-family:var(--mono); color:var(--amber); font-size:12px;
  background:rgba(231,181,61,.1); padding:1px 6px; border-radius:5px}
.note{color:var(--faint); font-size:12.5px; line-height:1.6; margin:20px 2px 4px; border-top:1px solid var(--line); padding-top:14px}
.note b{color:var(--muted); font-weight:600} .note code{font-family:var(--mono); color:var(--amber); font-size:12px}
.foot{font-family:var(--mono); font-size:11px; color:var(--faint); text-align:center; margin:18px 0 6px;
  display:flex; align-items:center; justify-content:center; gap:7px}
:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important; transition-duration:.05s !important} }
</style>
</head>
